      // ── Format detection ──────────────────────────────────────────────────────
      // mobi-detect-core.js – detects MOBI file format from an ArrayBuffer.
      // Returns { format: 'kf8'|'palmdoc'|'unknown', drm: boolean, compressionCode: number }
      //
      // Detection logic based on PalmDB header:
      //   firstRecOffset  = dv.getUint32(78)
      //   compression     = dv.getUint16(firstRecOffset + 0)
      //   encryption      = dv.getUint16(firstRecOffset + 12)
      //   compression 2     → PalmDoc LZ77 (Mobi7)
      //   compression 17480 → HUFF/CDIC (KF8)
      //   encryption != 0   → DRM-protected

      function detectMobiFormat(buffer) {
        if (!buffer || buffer.byteLength < 100) {
          return { format: "unknown", drm: false, compressionCode: 0 };
        }
        try {
          const dv = new DataView(buffer);
          const firstRecOffset = dv.getUint32(78);
          if (firstRecOffset + 14 > buffer.byteLength) {
            return { format: "unknown", drm: false, compressionCode: 0 };
          }
          const compression = dv.getUint16(firstRecOffset);
          const encryption = dv.getUint16(firstRecOffset + 12);
          const drm = encryption !== 0;
          let format;
          if (compression === 17480) format = "kf8";
          else if (compression === 2) format = "palmdoc";
          else if (compression === 1)
            format = "palmdoc"; // no compression, still PalmDoc-style
          else format = "unknown";
          return { format, drm, compressionCode: compression };
        } catch (e) {
          return { format: "unknown", drm: false, compressionCode: 0 };
        }
      }


      // ── KF8 core ──────────────────────────────────────────────────────────────
      // ─────────────────────────────────────────────────────────────────────────────
      // HuffCdicBase – shared HUFF/CDIC decompression logic
      // Used by mobiConverter.html and Tools/MobiReader.html

      class HuffCdicBase {
        constructor(buffer) {

          this.raw = new Uint8Array(buffer);

          // Flat TypedArrays for dict1 (256 entries, indexed by top 8 bits of code).

          this.dict1Codelen = new Uint8Array(256);

          this.mincodeArr = new Uint32Array(33);
          this.maxcodeArr = new Uint32Array(33);

          // 131072 bytes ≫ any single KF8 text record (typically 2-8 KB).
          this._decompOutBuf = new Uint8Array(131072);

        t(key, fallback, vars) {

          return String(fallback || key).replace(/\{(\w+)}/g, (_, k) =>

        _stripTrailingWithFlags(data, flags) {
          // KindleUnpack parity: count trailer entries from set bits > 0 and trim one entry per count.
          const multibyte = flags & 1;
          let trailers = 0;
          let tmp = flags >>> 1;
          while (tmp > 0) {
            if (tmp & 1) trailers++;
            tmp >>>= 1;
          }

          const getSizeOfTrailingDataEntry = (buf) => {
            if (buf.length === 0) return 0;
            let num = 0;
            const start = Math.max(0, buf.length - 4);
            for (let i = start; i < buf.length; i++) {
              const v = buf[i];
              if (v & 0x80) num = 0;
              num = ((num << 7) | (v & 0x7f)) >>> 0;
            }
            return num;
          };

          let out = data;
          for (let i = 0; i < trailers; i++) {
            const num = getSizeOfTrailingDataEntry(out);
            const keep = Math.max(0, out.length - num);
            out = out.subarray(0, keep);
          }

          if (multibyte) {
            const tail = out.length ? out[out.length - 1] : 0;
            const num = (tail & 3) + 1;
            const keep = Math.max(0, out.length - num);
            out = out.subarray(0, keep);
          }

          return out;
        }

        _normalizeExtraDataFlags(raw, sourceLabel) {
          if (raw === 0xffff) {
            // For sentinel/noisy values, start in conservative mode immediately.
            addLog(
              this.t(
                "logExtraDataSentinel",
                "⚠️ {source}: ExtraDataFlags is 0xFFFF (sentinel/noisy), forcing conservative strip mode 0x1.",
                {
                  source: sourceLabel,
                },
              ),
            );
            return 0x0001;
          }
          // MOBI ExtraDataFlags trailer layout uses low bits; high bits are often noisy/vendor-specific.
          const masked = raw & 0x001f;
          if (masked !== raw) {
            addLog(
              this.t(
                "logExtraDataMask",
                "⚠️ {source}: masking ExtraDataFlags 0x{from} -> 0x{to}",
                {
                  source: sourceLabel,
                  from: raw.toString(16),
                  to: masked.toString(16),
                },
              ),
            );
          }
          return masked || 0x0001;
        }

        // ── Low-level readers ─────────────────────────────────────────────────────
        u32(o) {
          const r = this.raw;
          return ((r[o] << 24) | (r[o + 1] << 16) | (r[o + 2] << 8) | r[o + 3]) >>> 0;
        }
        u16(o) {
          return ((this.raw[o] << 8) | this.raw[o + 1]) >>> 0;
        }

        _getRecord0Base() {
          const r0 = this.recs[0];
          let mobi = r0 + 16;
          if (
            !(
              this.raw[mobi] === 0x4d &&
              this.raw[mobi + 1] === 0x4f &&
              this.raw[mobi + 2] === 0x42 &&
              this.raw[mobi + 3] === 0x49
            )
          ) {
            mobi = r0;
          }
          return mobi === r0 + 16 ? r0 : mobi;
        }

        // PalmDOC text_records is the authoritative end of text payload.
        getTextRecordMax(huffIdx) {
          const recBase = this._getRecord0Base();
          const headerCount = this.u16(recBase + 0x08);
          const huffBound = Math.max(0, huffIdx - 1);

          if (!headerCount) return huffBound;
          if (headerCount > huffBound) {
            addLog(
              this.t(
                "logTextRecordsClamp",
                "⚠️ text_records ({headerCount}) exceeds HUFF bound ({huffBound}); clamping.",
                {
                  headerCount,
                  huffBound,
                },
              ),
            );
            return huffBound;
          }
          return headerCount;
        }

        // ── PDB record list ───────────────────────────────────────────────────────
        // Populates this.recs with file offsets and returns the array.
        buildRecords() {
          const n = this.u16(76);
          this.recs = [];
          for (let i = 0; i < n; i++) this.recs.push(this.u32(78 + i * 8));
          return this.recs;
        }

        // ── Find ExtraDataFlags ───────────────────────────────────────────────────
        // KindleUnpack-parity lookup for pure and hybrid KF8 files (EXTH tag 121 boundary override).
        findExtraDataFlags() {
          const recs = this.recs;
          const recBase = this._getRecord0Base();

          // KindleUnpack header offsets are relative to the record start (PalmDOC + MOBI block).
          const hdrLen = this.u32(recBase + 0x14);
          const mobiVer = this.u32(recBase + 0x68);
          const encoding = hdrLen >= 0x10 ? this.u32(recBase + 0x1c) : 0;

          const verLabel =
            mobiVer >= 8 ? "KF8" : mobiVer >= 6 ? "MOBI6" : `MOBI${mobiVer}`;
          const encLabel =
            encoding === 65001 || encoding === 0
              ? "UTF-8"
              : encoding === 1252
                ? "Windows-1252"
                : `encoding ${encoding}`;
          addLog(
            this.t("logMobiFormat", "MOBI: {label} (v{ver}), encoding: {enc}", {
              label: verLabel,
              ver: mobiVer,
              enc: encLabel,
            }),
          );

          let flags = 0x0001;
          if (hdrLen >= 0xe4 && mobiVer >= 5) {
            const raw = this.u16(recBase + 0xf2);
            flags = this._normalizeExtraDataFlags(raw, "MOBI header");
          }

          // EXTH tag 121 points to the KF8 boundary; when present, use KF8 section flags.
          const exthOff = recBase + 16 + hdrLen;
          if (
            this.raw[exthOff] === 0x45 &&
            this.raw[exthOff + 1] === 0x58 &&
            this.raw[exthOff + 2] === 0x54 &&
            this.raw[exthOff + 3] === 0x48
          ) {
            const exthLen = this.u32(exthOff + 4);
            const numRec = this.u32(exthOff + 8);
            let pos = exthOff + 12;

            for (let i = 0; i < numRec && pos + 8 <= exthOff + exthLen; i++) {
              const tag = this.u32(pos);
              const len = this.u32(pos + 4);
              if (tag === 121 && len === 12) {
                const kf8Bound = this.u32(pos + 8);
                const kf8RecIdx = kf8Bound + 1;
                if (kf8RecIdx < recs.length) {
                  const kf8Off = recs[kf8RecIdx];
                  let kf8Mobi = kf8Off + 16;
                  if (
                    !(
                      this.raw[kf8Mobi] === 0x4d &&
                      this.raw[kf8Mobi + 1] === 0x4f &&
                      this.raw[kf8Mobi + 2] === 0x42 &&
                      this.raw[kf8Mobi + 3] === 0x49
                    )
                  )
                    kf8Mobi = kf8Off;
                  const kf8Base = kf8Mobi === kf8Off + 16 ? kf8Off : kf8Mobi;
                  const kl = this.u32(kf8Base + 0x14);
                  const kv = this.u32(kf8Base + 0x68);
                  if (kl >= 0xe4 && kv >= 5) {
                    const raw = this.u16(kf8Base + 0xf2);
                    flags = this._normalizeExtraDataFlags(raw, "KF8 override");
                  }
                }
              }
              pos += len;
            }
          }

          return flags;
        }

        // ── Strip trailing bytes ───────────────────────────────────────────────────
        stripTrailing(data, flags) {
          if (!flags || data.length === 0) return data;
          return this._stripTrailingWithFlags(data, flags);
        }

        // ── Load HUFF record ──────────────────────────────────────────────────────
        loadHuff(hOff) {
          if (
            this.raw[hOff] !== 0x48 ||
            this.raw[hOff + 1] !== 0x55 ||
            this.raw[hOff + 2] !== 0x46 ||
            this.raw[hOff + 3] !== 0x46 ||
            this.raw[hOff + 4] !== 0x00 ||
            this.raw[hOff + 5] !== 0x00 ||
            this.raw[hOff + 6] !== 0x00 ||
            this.raw[hOff + 7] !== 0x18
          ) {
            throw new Error(this.t("errInvalidHuffHeader", "invalid huff header"));
          }

          const off1 = this.u32(hOff + 8);
          const off2 = this.u32(hOff + 12);
          // Populate flat TypedArray tables (one entry per top-byte value 0-255).
          for (let i = 0; i < 256; i++) {
            const v = this.u32(hOff + off1 + i * 4);
            const codelen = v & 0x1f;
            const term = !!(v & 0x80);
            if (codelen === 0)
              throw new Error(
                this.t(
                  "errInvalidHuffTableZeroCodeLen",
                  "invalid huff table: zero codelen",
                ),
              );
            if (codelen <= 8 && !term)
              throw new Error(
                this.t(
                  "errInvalidHuffTableShortNonTerminal",
                  "invalid huff table: short non-terminal code",
                ),
              );
            const mxraw = (v >>> 8) >>> 0;
            const maxcode =
              Number((BigInt(mxraw + 1) << BigInt(32 - codelen)) - 1n) >>> 0;
            this.dict1Codelen[i] = codelen;
            this.dict1Term[i] = term ? 1 : 0;
            this.dict1Maxcode[i] = maxcode;
          }
          this.mincodeArr = new Uint32Array(33);
          this.maxcodeArr = new Uint32Array(33);
          for (let i = 1; i <= 32; i++) {
            const rawMin = this.u32(hOff + off2 + (i - 1) * 8);
            const rawMax = this.u32(hOff + off2 + (i - 1) * 8 + 4);
            const shift = 32 - i;
            this.mincodeArr[i] = Number(BigInt(rawMin) << BigInt(shift)) >>> 0;
            this.maxcodeArr[i] =
              Number((BigInt(rawMax + 1) << BigInt(shift)) - 1n) >>> 0;
          }
          addLog(
            this.t("logHuffLoaded", "HUFF loaded. off1=0x{off1} off2=0x{off2}", {
              off1: off1.toString(16),
              off2: off2.toString(16),
            }),
          );
        }

        // ── Load one CDIC record ──────────────────────────────────────────────────
        loadCdic(rOff) {
          if (
            this.raw[rOff] !== 0x43 ||
            this.raw[rOff + 1] !== 0x44 ||
            this.raw[rOff + 2] !== 0x49 ||
            this.raw[rOff + 3] !== 0x43 ||
            this.raw[rOff + 4] !== 0x00 ||
            this.raw[rOff + 5] !== 0x00 ||
            this.raw[rOff + 6] !== 0x00 ||
            this.raw[rOff + 7] !== 0x10
          ) {
            throw new Error(this.t("errInvalidCdicHeader", "invalid cdic header"));
          }

          const phrases = this.u32(rOff + 8);
          const bits = this.u32(rOff + 12);
          const n = Math.min(1 << bits, phrases - this.dict.length);
          for (let j = 0; j < n; j++) {
            const off = this.u16(rOff + 16 + j * 2);
            const blen = this.u16(rOff + 16 + off);
            const flag = !!(blen & 0x8000);
            const slen = blen & 0x7fff;
            const slice = this.raw.subarray(rOff + 18 + off, rOff + 18 + off + slen);
            // Store as [slice, flagBit] to defer expansion until loadAllCdic finishes.
            this.dict.push(flag ? slice : { slice, flag: false });
          }
        }

        // ── Load all consecutive CDIC records after a HUFF record ────────────────
        // After all records are loaded, pre-expand every non-terminal (compressed)
        // CDIC entry so the hot decompress loop only ever sees plain Uint8Arrays.
        // This eliminates the per-symbol flag check and {slice,flag} object wrapper
        // from ~33M inner-loop iterations, improving cache locality significantly.
        loadAllCdic(huffIdx) {
          const recs = this.recs;
          let count = 0;
          for (let i = huffIdx + 1; i < recs.length; i++) {
            const rOff = recs[i];
            const magic = String.fromCharCode(
              this.raw[rOff],
              this.raw[rOff + 1],
              this.raw[rOff + 2],
              this.raw[rOff + 3],
            );
            if (magic !== "CDIC") break;
            this.loadCdic(rOff);
            count++;
          }
          // Pre-expand all non-terminal entries (flag=false means still compressed).
          // After this loop, every this.dict[i] is a plain Uint8Array.
          const dict = this.dict;
          for (let i = 0; i < dict.length; i++) {
            const e = dict[i];
            if (e && !(e instanceof Uint8Array)) {
              // Guard against circular references: set null before recursing so any
              // re-entrant access to dict[i] hits the null-break and returns empty.
              dict[i] = null;
              dict[i] = this.decompress(e.slice, false);
            }
          }
          addLog(
            this.t(
              "logCdicLoaded",
              "Loaded {count} CDIC records -> {symbols} symbols in dictionary.",
              {
                count,
                symbols: this.dict.length,
              },
            ),
          );
        }

        // ── HUFF/CDIC decompression ────────────────────────────────────────────────
        // Hot-path optimisation: the original used BigInt for 64-bit bitstream
        // arithmetic. BigInt is ~10x slower than 32-bit integer ops in V8.
        // We represent the 64-bit sliding window as two 32-bit ints (hi, lo) and
        // compute the 32-bit code extraction with plain bitwise ops instead.
        //
        // We also eliminate the "padded" Uint8Array copy by using bounds-checked
        // reads of the raw data directly: the slow branch only fires for the last
        // ~4 reads per record, saving 53K allocations per conversion.
        //
        // dict1 is now stored as three flat Uint8/Uint32Arrays instead of an object
        // array, eliminating property-lookup overhead and pointer chasing in the
        // 33M-iteration inner loop.
        //
        // Top-level calls (isTopLevel = true, the default) write directly into a
        // pre-allocated this._decompOutBuf, returning a zero-copy subarray view.
        // This avoids 53K × (new Array chunks + new Uint8Array result + copy loop),
        // reducing ~212 MB of temporary allocations and major GC pressure.
        // Recursive calls (CDIC expansion) use the legacy chunks path and are rare.
        decompress(data, isTopLevel = true) {
          if (data.length === 0 || this.dict.length === 0) return new Uint8Array(0);

          const dlen = data.length;

          // Read 4 bytes big-endian at byte offset p.
          // Fast path (p+3 < dlen): direct byte access.
          // Slow path (near end of data): byte-by-byte with zero padding.
          const read32 = (p) => {
            if (p + 3 < dlen) {
              return (
                ((data[p] << 24) |
                  (data[p + 1] << 16) |
                  (data[p + 2] << 8) |
                  data[p + 3]) >>>
                0
              );
            }
            return (
              (((p < dlen ? data[p] : 0) << 24) |
                ((p + 1 < dlen ? data[p + 1] : 0) << 16) |
                ((p + 2 < dlen ? data[p + 2] : 0) << 8) |
                (p + 3 < dlen ? data[p + 3] : 0)) >>>
              0
            );
          };

          // Cache TypedArray references in locals to avoid repeated property lookups.
          const dict1Codelen = this.dict1Codelen;
          const dict1Term = this.dict1Term;
          const dict1Maxcode = this.dict1Maxcode;
          const mincodeArr = this.mincodeArr;
          const maxcodeArr = this.maxcodeArr;
          const dict = this.dict;

          let bitsleft = dlen * 8;
          let pos = 0;

          // Initialise 64-bit window as two big-endian uint32 halves.
          let hi = read32(0);
          let lo = read32(4);
          // n = bits remaining in the current "hi" half (1..32).
          let n = 32;

          if (isTopLevel) {
            // ── Fast path: write directly into the pre-allocated output buffer ──────
            // Avoids 53K × (chunks array + Uint8Array allocation + copy loop).
            // The caller immediately decodes the returned subarray to a string, so the
            // buffer is safe to reuse for the next record.
            let outBuf = this._decompOutBuf;
            let outLen = 0;

            while (true) {
              if (n <= 0) {
                pos += 4;
                hi = lo;
                lo = read32(pos + 4);
                n += 32;
              }
              const code = n === 32 ? hi : ((hi << (32 - n)) | (lo >>> n)) >>> 0;
              const idx = code >>> 24;
              let codelen = dict1Codelen[idx];
              let maxcode = dict1Maxcode[idx];
              if (!dict1Term[idx]) {
                while (code < mincodeArr[codelen]) codelen++;
                maxcode = maxcodeArr[codelen];
              }
              n -= codelen;
              bitsleft -= codelen;
              if (bitsleft < 0) break;
              const r = ((maxcode - code) >>> (32 - codelen)) >>> 0;
              if (r >= dict.length) break;
              const slice = dict[r];
              if (!slice) break;
              const needed = outLen + slice.length;
              if (needed > outBuf.length) {
                // Grow the reusable buffer (rare: only if a record expands beyond 128 KB).
                const bigger = new Uint8Array(Math.max(outBuf.length * 2, needed));
                bigger.set(outBuf.subarray(0, outLen));
                outBuf = this._decompOutBuf = bigger;
              }
              outBuf.set(slice, outLen);
              outLen += slice.length;
            }
            return outBuf.subarray(0, outLen); // zero-copy view, valid until next call
          }

          // ── Legacy/recursive path: used only during CDIC expansion ─────────────
          const chunks = [];
          let outLen = 0;

          while (true) {
            if (n <= 0) {
              pos += 4;
              hi = lo;
              lo = read32(pos + 4);
              n += 32;
            }
            const code = n === 32 ? hi : ((hi << (32 - n)) | (lo >>> n)) >>> 0;
            const idx = code >>> 24;
            let codelen = dict1Codelen[idx];
            let maxcode = dict1Maxcode[idx];
            if (!dict1Term[idx]) {
              while (code < mincodeArr[codelen]) codelen++;
              maxcode = maxcodeArr[codelen];
            }
            n -= codelen;
            bitsleft -= codelen;
            if (bitsleft < 0) break;
            const r = ((maxcode - code) >>> (32 - codelen)) >>> 0;
            if (r >= dict.length) break;
            let entry = dict[r];
            if (!entry) break;
            // During recursive CDIC expansion (called from loadAllCdic pre-expansion),
            // some entries may still be unexpanded objects. Expand them lazily here.
            if (!(entry instanceof Uint8Array)) {
              dict[r] = null;
              const expanded = this.decompress(entry.slice, false);
              entry = expanded;
              dict[r] = entry;
            }
            chunks.push(entry);
            outLen += entry.length;
          }

          const result = new Uint8Array(outLen);
          let off = 0;
          for (const c of chunks) {
            result.set(c, off);
            off += c.length;
          }
          return result;
        }

        // ── Parse MOBI ORTH+INFL binary indexes → inflection form map ──────────────
        // Delegates to the shared parseMobiIndexes() function (mobi-index-core.js).
        // ORDT decoding is handled inside parseMobiIndexes itself, so we do NOT pass
        // finalMap keys here – those are in HTML extraction order, not ORTH ordinal
        // order, and would cause wrong headword↔group mappings.
        //
        // synMap is passed as outputMap so inflected forms are written directly,
        // avoiding a large intermediate Map of 2M+ entries.
        parseMobiIndexes() {
          const synMap = this.synMap || null;
          return parseMobiIndexes(this.raw, this.recs, addLog, null, synMap);
        }
      }


      class KF8Decoder extends HuffCdicBase {
        constructor(buffer) {
          super(buffer);
          this.huffIdx = -1;
          this.textRecordMax = 0;
          this.extraFlags = 1;
          this.decodedCache = new Map();
          this.lowerCache = new Map();
        }
        init() {
          this.buildRecords();
          addLog(`PDB records: ${this.recs.length}`);
          this.extraFlags = this.findExtraDataFlags();
          for (let i = 0; i < this.recs.length; i++) {
            const o = this.recs[i];
            if (
              this.raw[o] === 72 &&
              this.raw[o + 1] === 85 &&
              this.raw[o + 2] === 70 &&
              this.raw[o + 3] === 70
            ) {
              this.huffIdx = i;
              break;
            }
          }
          if (this.huffIdx === -1) {
            addLog("ERROR: No HUFF record found.");
            return false;
          }
          this.textRecordMax = this.getTextRecordMax(this.huffIdx);
          addLog(
            `HUFF record: ${this.huffIdx}  (text records: 1–${this.textRecordMax})`,
          );
          this.loadHuff(this.recs[this.huffIdx]);
          this.loadAllCdic(this.huffIdx);
          addLog(`${this.dict.length} symbols loaded.`);
          return true;
        }
        decodeRecord(idx) {
          if (this.decodedCache.has(idx)) return this.decodedCache.get(idx);
          const start = this.recs[idx];
          const end =
            idx + 1 < this.recs.length
              ? this.recs[idx + 1]
              : this.buffer.byteLength;
          let data = this.raw.slice(start, end);
          data = this.stripTrailing(data, this.extraFlags);
          const dec = this.decompress(data);
          const out = {
            text: new TextDecoder("utf-8", { fatal: false }).decode(dec),
            compressedBytes: data.length,
            decompressedBytes: dec.length,
          };
          this.decodedCache.set(idx, out);
          return out;
        }
        getRecordLowerText(idx) {
          if (this.lowerCache.has(idx)) return this.lowerCache.get(idx);
          const lower = this.decodeRecord(idx).text.toLowerCase();
          this.lowerCache.set(idx, lower);
          return lower;
        }
      }

      // ── PalmDoc core ──────────────────────────────────────────────────────────
      // ─────────────────────────────────────────────────────────────────────────────
      // PalmDocBase – shared PalmDoc decompression logic
      // Used by mobiConverter.html and Tools/MobiReader.html
      // DO NOT edit the compiled HTML files directly – edit this file and the
      // templates, then run:  node build.js
      // ─────────────────────────────────────────────────────────────────────────────
      class PalmDocBase {
        constructor(buffer) {
          this.buffer = buffer;
          this.view = new DataView(buffer);
          this.records = []; // array of { offset }
          this.extraFlags = 0;
        }

        // ── Build record list and read ExtraDataFlags from MOBI header ────────────
        buildRecords() {
          const numRecords = this.view.getUint16(76);
          this.records = [];
          for (let i = 0; i < numRecords; i++)
            this.records.push({ offset: this.view.getUint32(78 + i * 8) });
          this.extraFlags = this.view.getUint16(this.records[0].offset + 0xf2);
          return numRecords;
        }

        // ── Strip trailing bytes as specified by ExtraDataFlags ───────────────────
        stripTrailing(data, flags) {
          if (!flags || data.length === 0) return data;
          let trim = 0;
          for (let j = 0; j < 15; j++) {
            if ((flags >> (j + 1)) & 1) {
              let size = 0,
                pos = data.length - 1 - trim;
              let v = data[pos],
                shift = 7;
              size = v & 0x7f;
              while ((v & 0x80) === 0 && pos > 0) {
                v = data[--pos];
                size |= (v & 0x7f) << shift;
                shift += 7;
              }
              trim += size;
            }
          }
          if (flags & 1) trim += (data[data.length - 1 - trim] & 3) + 1;
          return trim > 0 && trim < data.length
            ? data.subarray(0, data.length - trim)
            : data;
        }

        // ── PalmDoc LZ77 decompression ────────────────────────────────────────────
        decompressPalmDoc(data) {
          // Pre-allocate worst-case output (PalmDoc records expand to at most 4096
          // bytes, but we allocate generously).  Using a typed array + index counter
          // avoids the overhead of Array.push() + the final Array→Uint8Array copy.
          const out = new Uint8Array(data.length * 8 + 256);
          let outLen = 0;
          for (let j = 0; j < data.length; j++) {
            let b = data[j];
            if (b >= 1 && b <= 8) {
              for (let k = 0; k < b; k++) out[outLen++] = data[++j];
            } else if (b <= 127) {
              out[outLen++] = b;
            } else if (b >= 192) {
              out[outLen++] = 32;
              out[outLen++] = b ^ 128;
            } else if (b >= 128 && b <= 191) {
              let next = data[++j];
              let dist = (((b << 8) | next) >> 3) & 0x7ff;
              let len = (next & 7) + 3;
              let s = outLen - dist;
              if (s >= 0) for (let k = 0; k < len; k++) out[outLen++] = out[s + k];
            } else {
              out[outLen++] = b;
            }
          }
          return out.subarray(0, outLen);
        }

        // ── Read, strip, and decompress a single record; return UTF-8 string ──────
        getRecordText(idx) {
          if (idx < 1 || idx >= this.records.length) return "";
          const start = this.records[idx].offset;
          const end = this.records[idx + 1]
            ? this.records[idx + 1].offset
            : this.buffer.byteLength;
          let data = new Uint8Array(this.buffer, start, end - start);
          data = this.stripTrailing(data, this.extraFlags);
          const out = this.decompressPalmDoc(data);
          return new TextDecoder("utf-8").decode(out);
        }

        // ── Parse MOBI ORTH+INFL binary indexes → inflection form map ──────────────
        // Delegates to the shared parseMobiIndexes() function (mobi-index-core.js).
        // ORDT decoding is handled inside parseMobiIndexes itself, so we do NOT pass
        // finalMap keys here – those are in HTML extraction order, not ORTH ordinal
        // order, and would cause wrong headword↔group mappings.
        parseMobiIndexes(outputMap) {
          const raw = new Uint8Array(this.buffer);
          const offsets = this.records.map((r) => r.offset);
          const logFn =
            typeof addLog === "function"
              ? addLog
              : typeof this.log === "function"
                ? this.log
                : null;
          return parseMobiIndexes(raw, offsets, logFn, null, outputMap);
        }
      }


      class MobiReaderPalmDoc extends PalmDocBase {
        constructor(buffer) {
          super(buffer);
        }
        init() {
          return this.buildRecords();
        }
      }

      // ── Shared state ──────────────────────────────────────────────────────────

      // ── KF8 reader init ───────────────────────────────────────────────────────
      function initKF8Reader(buffer) {
        activeFormat = "kf8";
        document.getElementById("kf8Section").style.display = "block";
        document.getElementById("palmSection").style.display = "none";
        kf8Decoder = new KF8Decoder(buffer);
        searchCache = new Map();
        const ok = kf8Decoder.init();
        if (!ok) return;
        const maxRec = kf8Decoder.textRecordMax;
        document.getElementById("recFrom").max = maxRec;
        document.getElementById("recTo").max = maxRec;
        document.getElementById("recTo").value = Math.min(5, maxRec);
        document.getElementById("decodeBtn").disabled = false;
        document.getElementById("prevBtn").disabled = false;
        document.getElementById("nextBtn").disabled = false;
        document.getElementById("searchRow").style.display = "flex";
        document.getElementById("kf8DownloadHtmlBtn").disabled = false;
        addLog(`Ready. Text records: 1–${maxRec}. Use controls to inspect.`);
      }

      // KF8 decode
      document.getElementById("decodeBtn").onclick = decodeSelected;
      document.getElementById("prevBtn").onclick = () => shiftRange(-1);
      document.getElementById("nextBtn").onclick = () => shiftRange(+1);

      function shiftRange(dir) {
        const from = parseInt(document.getElementById("recFrom").value);
        const to = parseInt(document.getElementById("recTo").value);
        const span = to - from;
        const max = kf8Decoder ? kf8Decoder.textRecordMax : 9999;
        const newFrom = Math.max(
          1,
          Math.min(max - span, from + dir * (span + 1)),
        );
        document.getElementById("recFrom").value = newFrom;
        document.getElementById("recTo").value = Math.min(max, newFrom + span);
        decodeSelected();

      function decodeSelected() {
        if (!kf8Decoder) return;
        const from = parseInt(document.getElementById("recFrom").value);
        const to = Math.min(
          parseInt(document.getElementById("recTo").value),
          kf8Decoder.textRecordMax,
        );
        document.getElementById("recInfo").textContent =
          `(max: ${kf8Decoder.textRecordMax})`;
        let markers = "",
          combined = "",
          renderedCombined = "";
        let totalComp = 0,
          totalDecomp = 0;
        for (let i = from; i <= to; i++) {
          try {
            const { text, compressedBytes, decompressedBytes } =
              kf8Decoder.decodeRecord(i);
            markers += `<!-- ═══ RECORD ${i} | ${compressedBytes}b → ${decompressedBytes}b ═══ -->\n`;
            combined += text;
            renderedCombined += text;
            totalComp += compressedBytes;
            totalDecomp += decompressedBytes;

            markers += `<!-- RECORD ${i}: ERROR: ${e.message} -->\n`;
          }

        document.getElementById("bytesBadge").textContent =
          `${totalComp}b → ${totalDecomp}b`;

          `Decoded records ${from}–${to}: ${totalComp} → ${totalDecomp} bytes`,

          const parts = [];
          for (let i = 1; i <= kf8Decoder.textRecordMax; i++)
            parts.push(kf8Decoder.decodeRecord(i).text);
          const html = `<!doctype html>\n<html lang="${window.LANG}">\n<head><meta charset="UTF-8"><title>${sourceFileName}</title></head>\n<body>\n${parts.join("\n")}\n</body>\n</html>`;
          const outName = `${sourceFileName}-decoded-kf8.html`;
          downloadBlob(outName, html, "text/html;charset=utf-8");
          addLog(`Exported: ${outName}`);
        } catch (e) {
          addLog(`Download failed: ${e.message}`);
        } finally {
          btn.disabled = false;
        }
      };

      // KF8 search
      document.getElementById("searchBtn").onclick = searchWord;
      document.getElementById("wordSearch").addEventListener("keydown", (e) => {
        if (e.key === "Enter") searchWord();
      });
      document.getElementById("searchPrev").onclick = () => navigateSearch(-1);
      document.getElementById("searchNext").onclick = () => navigateSearch(+1);

      function showSearchResult(idx) {
        const max = kf8Decoder.textRecordMax;
        const rec = searchResults[idx];
        document.getElementById("recFrom").value = Math.max(1, rec - 1);
        document.getElementById("recTo").value = Math.min(max, rec + 1);
        decodeSelected();
        const q = document.getElementById("wordSearch").value.trim();
        const raw = document.getElementById("rawOutput");
        const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
        raw.innerHTML = raw.textContent
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(re, (m) => `<mark>${m}</mark>`);
        const first = raw.querySelector("mark");
        if (first) first.scrollIntoView({ block: "center" });
        document.getElementById("searchHits").textContent =
          `Result ${idx + 1} / ${searchResults.length}  (record #${rec})`;
        document.getElementById("searchPrev").disabled = idx === 0;
        document.getElementById("searchNext").disabled =
          idx === searchResults.length - 1;
      }
      function navigateSearch(dir) {
        const next = searchCursor + dir;
        if (next < 0 || next >= searchResults.length) return;
        searchCursor = next;
        showSearchResult(searchCursor);
      }
      function searchWord() {
        if (!kf8Decoder) return;
        const q = document
          .getElementById("wordSearch")
          .value.trim()
          .toLowerCase();
        if (!q) return;
        const hitsEl = document.getElementById("searchHits");
        hitsEl.textContent = "Scanning…";
        document.getElementById("searchPrev").disabled = true;
        document.getElementById("searchNext").disabled = true;
        const max = kf8Decoder.textRecordMax;
        if (searchCache.has(q)) {
          searchResults = searchCache.get(q).slice();
        } else {
          const hits = [];
          for (let i = 1; i <= max; i++) {
            try {
              if (kf8Decoder.getRecordLowerText(i).includes(q)) hits.push(i);
            } catch (e) {}
          }
          searchResults = hits;
          searchCache.set(q, hits.slice());
        }
        if (searchResults.length === 0) {
          hitsEl.textContent = `No records found for "${q}".`;
          return;
        }
        searchCursor = 0;
        addLog(`Search "${q}": ${searchResults.length} hit(s)`);
        showSearchResult(0);
      }

      // ── PalmDoc reader init ───────────────────────────────────────────────────
      function initPalmReader(buffer) {
        activeFormat = "palmdoc";
        document.getElementById("palmSection").style.display = "block";
        document.getElementById("kf8Section").style.display = "none";
        palmReader = new MobiReaderPalmDoc(buffer);
        const total = palmReader.init();
        const t = I18N[window.LANG] || I18N.en;
        addLog(
          `Loaded ${total} records. Extra flags: 0x${palmReader.extraFlags.toString(16)}`,
        );
        updatePalmView(1);
      }

      function updatePalmView(idx) {
        if (!palmReader) return;
        palmCurrentIdx = idx;
        const text = palmReader.getRecordText(idx);
        const t = I18N[window.LANG] || I18N.en;
        document.getElementById("rawContent").textContent = text;
        document.getElementById("htmlContent").innerHTML = text;
        document.getElementById("palmPageInfo").innerHTML =
          `<span data-i18n="recordLabel">${t.recordLabel || "Record:"}</span> ${idx} / ${palmReader.records.length - 1}`;
        document.getElementById("palmRecordMeta").textContent =
          `Offset: ${palmReader.records[idx].offset} | ${t.sizeLabel || "Size"}: ${text.length}`;
        document.getElementById("palmPrevBtn").disabled = idx <= 1;
        document.getElementById("palmNextBtn").disabled =
          idx >= palmReader.records.length - 1;
      }

      document.getElementById("palmPrevBtn").onclick = () =>
        updatePalmView(palmCurrentIdx - 1);
      document.getElementById("palmNextBtn").onclick = () =>
        updatePalmView(palmCurrentIdx + 1);
      document.getElementById("jumpBtn").onclick = () => {
        const val = parseInt(document.getElementById("jumpTo").value);
        if (palmReader && val > 0 && val < palmReader.records.length)
          updatePalmView(val);
      };
      document.getElementById("palmDownloadHtmlBtn").onclick = () => {
        if (!palmReader) return;
        try {
          const parts = [];
          for (let i = 1; i < palmReader.records.length; i++)
            parts.push(palmReader.getRecordText(i));
          const html = `<!doctype html>\n<html lang="${window.LANG}">\n<head><meta charset="UTF-8"><title>${sourceFileName}</title></head>\n<body>\n${parts.join("\n")}\n</body>\n</html>`;
          const outName = `${sourceFileName}-decoded-palmdoc.html`;
          downloadBlob(outName, html, "text/html;charset=utf-8");
          addLog(`Exported: ${outName}`);
        } catch (e) {
          addLog(`Export failed: ${e.message}`);
        }
      };

      // ── i18n ──────────────────────────────────────────────────────────────────
      const I18N = {
        en: {
          pageTitle: "MOBI Reader",
          title: "🔬 MOBI File Inspector",
          dropzone: "📁 Click or drag your .mobi file here",
          formatKF8: "KF8 / HUFF·CDIC (modern)",
          formatPalm: "PalmDoc / Mobi7 (legacy)",
          drmDetected: "DRM protected – cannot read",
          logIdle: "Status: Idle. Load a .mobi file to begin.",
          recordLabel: "Record:",
          toLabel: "to",
          decodeBtn: "DECODE RECORDS",
          prevBtn: "◀ Prev",
          nextBtn: "Next ▶",
          searchBtn: "Find",
          searchPh: "🔍 Search word in all records…",
          outputLabel: "Decoded Output",
          downloadHtmlBtn: "💾 Download full HTML",
          copyBtn: "📋 Copy raw text",
          tabRaw: "Raw HTML source",
          tabRendered: "Rendered HTML",
          jumpPh: "Record no.",
          jumpBtn: "Go",
          rawTitle: "SOURCE CODE (Raw tags)",
          renderedTitle: "RENDERED PREVIEW",
          sizeLabel: "Size (chars)",
          langToggleTitle: "Switch language / Zmień język",
        },
        pl: {
          pageTitle: "Przeglądarka MOBI",
          title: "🔬 Inspektor pliku MOBI",
          dropzone: "📁 Kliknij lub przeciągnij plik .mobi tutaj",
          formatKF8: "KF8 / HUFF·CDIC (nowoczesny)",
          formatPalm: "PalmDoc / Mobi7 (starszy)",
          drmDetected: "Zabezpieczony DRM – nie można odczytać",
          logIdle: "Status: Bezczynny. Wczytaj plik .mobi, aby rozpocząć.",
          recordLabel: "Rekord:",
          toLabel: "do",
          decodeBtn: "DEKODUJ REKORDY",
          prevBtn: "◀ Poprz.",
          nextBtn: "Nast. ▶",
          searchBtn: "Szukaj",
          searchPh: "🔍 Szukaj słowa we wszystkich rekordach…",
          outputLabel: "Zdekodowane dane",
          downloadHtmlBtn: "💾 Pobierz pełny HTML",
          copyBtn: "📋 Kopiuj tekst",
          tabRaw: "Źródło HTML",
          tabRendered: "Podgląd HTML",
          jumpPh: "Nr rekordu",
          jumpBtn: "Skocz",
          rawTitle: "KOD ŹRÓDŁOWY (Surowe tagi)",
          renderedTitle: "PODGLĄD RENDEROWANIA",
          sizeLabel: "Rozmiar (znaki)",
          langToggleTitle: "Switch language / Zmień język",
        },
      };
      // ── i18n: language detection, application & toggle ───────────────────────────
      // Expects a global `const I18N = { en: {...}, pl: {...} }` defined before this
      // file is included. All text lives only in I18N — HTML elements are empty shells.

      (function () {
        var stored = localStorage.getItem("lang");
        var auto =
          navigator.language && navigator.language.startsWith("pl") ? "pl" : "en";
        window.LANG = stored || auto;
        document.documentElement.lang = window.LANG;
      })();

      function applyI18n() {
        var t = I18N[window.LANG] || I18N.en;
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          var v = t[el.getAttribute("data-i18n")];
          if (v !== undefined) el.textContent = v;
        });
        document.querySelectorAll("[data-i18n-html]").forEach(function (el) {
          var v = t[el.getAttribute("data-i18n-html")];
          if (v !== undefined) el.innerHTML = v;
        });
        document.querySelectorAll("[data-i18n-ph]").forEach(function (el) {
          var v = t[el.getAttribute("data-i18n-ph")];
          if (v !== undefined) el.placeholder = v;
        });
        document.querySelectorAll("[data-i18n-title]").forEach(function (el) {
          var v = t[el.getAttribute("data-i18n-title")];
          if (v !== undefined) el.title = v;
        });
        var btn = document.getElementById("langToggle");
        if (btn) btn.textContent = window.LANG === "pl" ? "🇬🇧 EN" : "🇵🇱 PL";
      }

      function toggleLang() {
        window.LANG = window.LANG === "pl" ? "en" : "pl";
        localStorage.setItem("lang", window.LANG);
        document.documentElement.lang = window.LANG;
        applyI18n();
      }

      // Script is always placed at the end of <body> — DOM is ready, safe to apply immediately.
      applyI18n();

    </script>
  </body>
</html>
