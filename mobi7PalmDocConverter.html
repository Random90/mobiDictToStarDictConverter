            //   all set), read the VWI byte-count header immediately.  ALL byte-count
            //   VWIs for ALL tags are consumed first, advancing pos past the header
            //   block.  Direct-count tags consume nothing here.
            //
            // Pass 2 – read actual VWI values in tag order, using the counts collected
            //   in pass 1.  This ordering matches the on-disk layout:
            //     [ctrl][byteCount_T1][byteCount_T2]…[values_T1][values_T2]…
            //
            const tagSpecs = [];
            const tagVals = {};
            let cbIdx = 0;
            for (const t of tagx.tags) {
              if (t.mask !== 0 && cbIdx < ctrlBytes.length) {
                const maskedVal = ctrlBytes[cbIdx] & t.mask;
                if (maskedVal !== 0) {
                  const maskBits = t.mask.toString(2).split('').filter(c => c === '1').length;
                  if (maskBits > 1 && maskedVal === t.mask) {
                    // Extended: consume the VWI byte-count header NOW (pass 1).
                    const [byteCount, np0] = readVWI(rec, pos);
                    pos = np0;
                    tagSpecs.push({ tag: t.tag, count: null, byteCount });
                  } else {
                    // Direct: count is encoded in the control bits, no header to read.
                    const flagValue = maskedVal >>> t.shift;
                    const count = t.numVals * flagValue;
                    tagSpecs.push({ tag: t.tag, count, byteCount: null });
                  }
                }
              }
              if (t.end) cbIdx++;
            }
            // Pass 2 – read VWI values for each tag in order.
            for (const spec of tagSpecs) {
              const vals = [];
              if (spec.count !== null) {
                for (let v = 0; v < spec.count && pos < rec.length; v++) {
                  const [val, np] = readVWI(rec, pos);
                  vals.push(val);
                  pos = np;
                }
              } else {
                const limit = pos + spec.byteCount;
                while (pos < limit && pos < rec.length) {
                  const [val, np] = readVWI(rec, pos);
                  vals.push(val);
                  pos = np;
                }
              }
              tagVals[spec.tag] = vals;
            }
            entries.push({ labelBytes, tagVals });
          }
          return entries;
        };

        // Reverse a Uint8Array byte-by-byte (for reversed UTF-8 suffix chunks).
        const reverseBytes = (arr) => {
          const r = new Uint8Array(arr.length);
          for (let i = 0; i < arr.length; i++) r[i] = arr[arr.length - 1 - i];
          return r;
        };

        // Parse a Type-B INFL form entry label.
        // Returns { formSuffix, canonicalSuffix } or null if not a Type-B entry.
        //
        // Label format:  [0x02][reversed_form_suffix_bytes][0x03][reversed_canonical_suffix_bytes]
        //   - 0x02 chunk (mandatory): reversed bytes → form suffix string
        //   - 0x03 chunk (optional):  reversed bytes → canonical suffix string (empty = no stripping)
        //   - 0x01 prefix entries are grammar/metadata (Type A) – skipped by returning null
        //   - Other marker bytes (0x04, 0x0c, …) are ignored
        const parseFormLabel = (lb) => {
          if (!lb || lb.length === 0 || lb[0] === 0x01) return null;

          let formSuffixBytes = null;
          let canonicalSuffixBytes = null;

          let i = 0;
          while (i < lb.length) {
            const marker = lb[i++];
            // Read chunk until next control byte (< 0x20) or end
            const start = i;
            while (i < lb.length && lb[i] >= 0x20) i++;
            const chunk = lb.slice(start, i);

            if (marker === 0x02) formSuffixBytes = chunk;
            else if (marker === 0x03) canonicalSuffixBytes = chunk;
            // 0x04, 0x0c, etc. → ignore
          }

          if (!formSuffixBytes) return null;

          const formSuffix      = utf8.decode(reverseBytes(formSuffixBytes));
          const canonicalSuffix = canonicalSuffixBytes
            ? utf8.decode(reverseBytes(canonicalSuffixBytes))
            : '';

          return { formSuffix, canonicalSuffix };
        };

        // Scan all records to build INDX groups (control record + data sub-records).
        const groups = [];
        let cur = null;
        for (let i = 0; i < recsOffsets.length; i++) {
          const s = recsOffsets[i];
          if (totalLen - s < 4) continue;
          if (raw[s]     !== 0x49 || raw[s + 1] !== 0x4E ||
              raw[s + 2] !== 0x44 || raw[s + 3] !== 0x58) continue;

          const rec    = getRec(i);
          if (rec.length < 8) continue;
          const hdrLen = ru32(rec, 4);
          if (hdrLen >= rec.length) continue;

          const tagx = parseTagx(rec, hdrLen);
          if (tagx) {
            cur = { ctrlRecIdx: i, tagx, subRecs: [] };
            groups.push(cur);
          } else if (cur) {
            cur.subRecs.push(i);
          }
        }


        if (groups.length < 2) return inflMap;

        // Identify groups by TAGX tag numbers:
        //   ORTH: contains tag 42 (infl_group_ref)
        //   INFL: contains tag 26 (form entry list in paradigm templates)
        //         also contains tag 27 in form entries, but group is identified by tag 26
        const orthGroup = groups.find(g => g.tagx.tags.some(t => t.tag === 42));
        const inflGroup = groups.find(g => g.tagx.tags.some(t => t.tag === 26 || t.tag === 27));

        if (!orthGroup) return inflMap;
        if (!inflGroup) return inflMap;

        // Read ORDT from the ORTH control record for correct label decoding.
        const orthOrdt = readOrdt(getRec(orthGroup.ctrlRecIdx));

        // Build ordered ORTH headwords array from all ORTH sub-records.
        // Always decode from binary using ORDT when available, so the array is in
        // the correct ORTH index ordinal order (critical for group→headword mapping).
        // The optional externalHeadwords is accepted only when the caller guarantees
        // it is indexed by ORTH ordinal (i.e. same order as the binary ORTH index).
        let orthHeadwords;
        if (Array.isArray(externalHeadwords) && externalHeadwords.length > 0) {
          orthHeadwords = externalHeadwords;
        } else {
          orthHeadwords = [];
          for (const ri of orthGroup.subRecs) {
            for (const e of parseSubRec(getRec(ri), orthGroup.tagx)) {
              orthHeadwords.push(decodeOrthLabel(e.labelBytes, orthOrdt));
            }
          }
        }

        if (orthHeadwords.length === 0) return inflMap;

        // ── Step 1: Pre-load ALL INFL entries into a flat array ─────────────────────
        //
        // INFL entries fall into two types by their position:
        //   - Paradigm template entries (empty label, tag26): one per inflection group G,
        //     at ordinal == G.  Their tag26 lists the ordinals of all form entries that
        //     belong to this paradigm.
        //   - Form entries (non-empty label, tag27): encode a specific inflected form
        //     via reversed-suffix label bytes.
        //
        // We pre-load everything so we can do O(1) random access by ordinal.
        //
        const inflEntries = [];
        for (const ri of inflGroup.subRecs) {
          for (const e of parseSubRec(getRec(ri), inflGroup.tagx)) {
            inflEntries.push(e);
          }
        }

        // ── Step 2: Build groupHeadwords from ORTH ──────────────────────────────────
        //
        // For every ORTH entry that carries tag42=G, store its headword text
        // in groupHeadwords[G].  We collect ALL headwords per group (not just the
        // first) so we can generate inflected forms for each headword separately
        // (e.g., for group 5566: 'arcypies', 'kunopies', 'pies' each get their own
        // inflected forms 'arcypsa', 'kunopsa', 'psa' etc.).
        //
        const groupHeadwords = new Map(); // G → string[]
        {
          let oOrd = 0;
          for (const ri of orthGroup.subRecs) {
            for (const e of parseSubRec(getRec(ri), orthGroup.tagx)) {
              const t42 = e.tagVals[42];
              if (t42 && t42.length > 0) {
                const g = t42[0];
                if (!groupHeadwords.has(g)) groupHeadwords.set(g, []);
                const hw = orthHeadwords[oOrd];
                if (hw) groupHeadwords.get(g).push(hw);
              }
              oOrd++;
            }
          }
        }

        if (groupHeadwords.size === 0) return inflMap;

        // ── Step 3: Process paradigm templates → derive inflected forms ─────────────
        //
        // A paradigm template entry at INFL ordinal G corresponds to group G.
        // Its tag26 list contains ordinals of form entries.  Each form entry's label
        // encodes the inflected form via reversed-suffix chunks:
        //
        //   label = [0x02][rev_form_bytes][0x03][rev_canonical_bytes]
        //
        // Algorithm for each (canonical, form_entry) pair:
        //   canonical_suffix = reverse(rev_canonical_bytes)
        //   form_suffix      = reverse(rev_form_bytes)
        //   if canonical.endsWith(canonical_suffix):
        //     stem = canonical[:-len(canonical_suffix)]
        //     form = stem + form_suffix
        //     inflMap.set(form, canonical)   ← unless form == canonical
        //
        for (let G = 0; G < inflEntries.length; G++) {
          const tmpl = inflEntries[G];
          const t26 = tmpl.tagVals[26];
          if (!t26 || t26.length === 0) continue; // not a template

          const headwords = groupHeadwords.get(G);
          if (!headwords || headwords.length === 0) continue;

          for (const formOrd of t26) {
            if (formOrd >= inflEntries.length) continue;
            const formEntry = inflEntries[formOrd];
            const parsed = parseFormLabel(formEntry.labelBytes);
            if (!parsed) continue;

            const { formSuffix, canonicalSuffix } = parsed;

            for (const canonical of headwords) {
              let stem;
              if (canonicalSuffix) {
                if (!canonical.endsWith(canonicalSuffix)) continue;
                stem = canonical.slice(0, canonical.length - canonicalSuffix.length);
              } else {
                stem = canonical;
              }
              const form = stem + formSuffix;
              if (form && form !== canonical) {
                inflMap.set(form, canonical);
              }
            }
          }
        }

        if (inflMap.size > 0) {
          const sample = [...inflMap.entries()].slice(0, 5).map(([k, v]) => `${k}→${v}`).join(', ');
          log(t('logMobiIndexSample', 'Inflection examples: {sample}', { sample }));
        }

        return inflMap;
      }


      // ─────────────────────────────────────────────────────────────────────────────
      // ─────────────────────────────────────────────────────────────────────────────
      // PalmDocBase – shared PalmDoc decompression logic
      // Used by mobi7PalmDocConverter.html and Tools/MobiReader-PalmDoc.html
      // DO NOT edit the compiled HTML files directly – edit this file and the
      // templates, then run:  node build.js
      // ─────────────────────────────────────────────────────────────────────────────
      class PalmDocBase {
        constructor(buffer) {
          this.buffer = buffer;
          this.view = new DataView(buffer);
          this.records = []; // array of { offset }
          this.extraFlags = 0;
        }

        // ── Build record list and read ExtraDataFlags from MOBI header ────────────
        buildRecords() {
          const numRecords = this.view.getUint16(76);
          this.records = [];
          for (let i = 0; i < numRecords; i++)
            this.records.push({ offset: this.view.getUint32(78 + i * 8) });
          this.extraFlags = this.view.getUint16(this.records[0].offset + 0xf2);
          return numRecords;
        }

        // ── Strip trailing bytes as specified by ExtraDataFlags ───────────────────
        stripTrailing(data, flags) {
          if (!flags || data.length === 0) return data;
          let trim = 0;
          for (let j = 0; j < 15; j++) {
            if ((flags >> (j + 1)) & 1) {
              let size = 0,
                pos = data.length - 1 - trim;
              let v = data[pos],
                shift = 7;
              size = v & 0x7f;
              while ((v & 0x80) === 0 && pos > 0) {
                v = data[--pos];
                size |= (v & 0x7f) << shift;
                shift += 7;
              }
              trim += size;
            }
          }
          if (flags & 1) trim += (data[data.length - 1 - trim] & 3) + 1;
          return trim > 0 && trim < data.length
            ? data.slice(0, data.length - trim)
            : data;
        }

        // ── PalmDoc LZ77 decompression ────────────────────────────────────────────
        decompressPalmDoc(data) {
          let out = [];
          for (let j = 0; j < data.length; j++) {
            let b = data[j];
            if (b >= 1 && b <= 8) {
              for (let k = 0; k < b; k++) out.push(data[++j]);
            } else if (b <= 127) {
              out.push(b);
            } else if (b >= 192) {
              out.push(32);
              out.push(b ^ 128);
            } else if (b >= 128 && b <= 191) {
              let next = data[++j];
              let dist = (((b << 8) | next) >> 3) & 0x7ff;
              let len = (next & 7) + 3;
              let s = out.length - dist;
              if (s >= 0) for (let k = 0; k < len; k++) out.push(out[s + k]);
            } else {
              out.push(b);
            }
          }
          return new Uint8Array(out);
        }

        // ── Read, strip, and decompress a single record; return UTF-8 string ──────
        getRecordText(idx) {
          if (idx < 1 || idx >= this.records.length) return "";
          const start = this.records[idx].offset;
          const end = this.records[idx + 1]
            ? this.records[idx + 1].offset
            : this.buffer.byteLength;
          let data = new Uint8Array(this.buffer.slice(start, end));
          data = this.stripTrailing(data, this.extraFlags);
          const out = this.decompressPalmDoc(data);
          return new TextDecoder("utf-8").decode(out);
        }

        // ── Parse MOBI ORTH+INFL binary indexes → inflection form map ──────────────
        // Delegates to the shared parseMobiIndexes() function (mobi-index-core.js).
        // ORDT decoding is handled inside parseMobiIndexes itself, so we do NOT pass
        // finalMap keys here – those are in HTML extraction order, not ORTH ordinal
        // order, and would cause wrong headword↔group mappings.
        parseMobiIndexes() {
          const raw = new Uint8Array(this.buffer);
          const offsets = this.records.map(r => r.offset);
          const logFn = typeof addLog === 'function' ? addLog : (typeof this.log === 'function' ? this.log : null);
          return parseMobiIndexes(raw, offsets, logFn, null);
        }
      }

      // ─────────────────────────────────────────────────────────────────────────────

      // ── Converter: extends PalmDocBase with dictionary extraction logic ────────
      // Converter: extends PalmDocBase with dictionary extraction logic.
      class Converter extends PalmDocBase {
        constructor(buffer, options, logFn) {
          super(buffer);
          this.options = options;
          this.log = logFn;
          this.encoder = new TextEncoder();
          this.finalMap = new Map(); // word -> definition HTML
          this.synMap = new Map(); // alternate_form -> canonical_word
        }

        async run() {
          const numRecords = this.buildRecords();
          this.log(
            `Source detected. Extra Data Flags: 0x${this.extraFlags.toString(16)}`,
          );
          this.log("Step 1: Extracting text from MOBI records...");
          const html = await this.extractAsync(numRecords);
          this.log("Step 2: Running extraction engines...");
          this.parseDictionary(html);

          // Step 3: Parse MOBI binary INDX for inflected forms (ORTH+INFL indexes).
          if (this.options.generateSyn) {
            try {
              const inflMap = this.parseMobiIndexes();
              let added = 0;
              for (const [form, headword] of inflMap) {
                if (!this.synMap.has(form) && form !== headword) {
                  this.synMap.set(form, headword);
                  added++;
                }
              }
              if (inflMap.size > 0)
                this.log(`MOBI INDX: ${inflMap.size} inflected forms decoded, ${added} new syn entries added.`);
              else
                this.log('MOBI INDX: no ORTH/INFL index found (normal for many MOBI7 files).');
            } catch (e) {
              this.log('MOBI INDX parse skipped (non-fatal): ' + e.message);
            }
          }

          return { finalMap: this.finalMap, synMap: this.synMap };
        }

        extractAsync(numRecords) {
          return new Promise((resolve) => {
            let fullHtml = "";
            const decoder = new TextDecoder("utf-8");
            let i = 1;
            const processChunk = () => {
              const limit = Math.min(i + 1500, numRecords);
              for (; i < limit; i++) {
                const start = this.records[i].offset;
                const end =
                  i + 1 < numRecords
                    ? this.records[i + 1].offset
                    : this.buffer.byteLength;
                let data = new Uint8Array(this.buffer.slice(start, end));
                data = this.stripTrailing(data, this.extraFlags);
                if (data.length === 0) continue;
                fullHtml += decoder.decode(this.decompressPalmDoc(data));
              }
              if (i < numRecords) {
                this.log(`Extracted ${i}/${numRecords} records...`);
                setTimeout(processChunk, 0);
              } else {
                resolve(fullHtml);
              }
            };
            processChunk();
          });
        }

        parseDictionary(html) {
          this.log("Parsing structure...");
          const fmt = this.detectDictionaryFormat(html);
          this.log(`Detected entry format: ${fmt}`);
          if (fmt === "hr-bold") {
            this.log("Detected alternate HR/B parser format.");
            this.parseDictionaryHrBold(html);
            return;
          }
          this.parseDictionaryMain(html);
        }

        detectDictionaryFormat(html) {
          const h2Count = (html.match(/<h2\b/gi) || []).length;
          if (h2Count >= 20) return "main";

          const hrCount = (html.match(/<hr\b/gi) || []).length;
          if (hrCount < 100) return "main";

          const boldHeadCount = (html.match(
            /(?:^|<hr\b[^>]*>)\s*<b[^>]*>[^<]{1,120}<\/b>\s*<br\s*\/?>/gi,
          ) || []).length;

          if (boldHeadCount >= 100) return "hr-bold";
          return "main";
        }

        _ingestEntry(word, contentHtml, styleFn, phonetics = "", rawHeadHtml = "") {
          if (!word || word.length >= 100) return;

          const safeHead = rawHeadHtml || `<h2>${word}</h2>`;
          const entryHtml = styleFn(word, phonetics, safeHead, contentHtml);

          if (this.options.merge && this.finalMap.has(word)) {
            this.finalMap.set(
              word,
              this.finalMap.get(word) + '<hr style="margin:4px 0">' + entryHtml,
            );
          } else {
            this.finalMap.set(word, entryHtml);
          }

          this._collectSynonyms(word, contentHtml);
        }

        _collectSynonyms(word, contentHtml) {
          if (!this.options.generateSyn) return;

          const stripped = word.replace(/[\u2080-\u2089\u00B9\u00B2\u00B3]$/, "").trim();
          if (stripped !== word && stripped.length > 1 && !this.synMap.has(stripped)) {
            this.synMap.set(stripped, word);
          }

          const bMatches = contentHtml.matchAll(/<b>([^<]{3,70})<\/b>/g);
          for (const m of bMatches) {
            const phrase = m[1].trim();
            if (phrase.toLowerCase() === word.toLowerCase()) continue;
            if (phrase.length < 3 || phrase.length > 80) continue;
            if (/^\d+$/.test(phrase)) continue;
            if (!this.synMap.has(phrase)) this.synMap.set(phrase, word);
          }

          const tezRe = /\((?:też|also)\s+<b>([^<]{2,60})<\/b>/gi;
          for (const m of contentHtml.matchAll(tezRe)) {
            const alt = m[1].trim();
            if (alt && alt !== word && !this.synMap.has(alt)) this.synMap.set(alt, word);
          }
        }

        parseDictionaryMain(html) {
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, "text/html");
          const h2Entries = doc.querySelectorAll("h2");
          this.log(`Found ${h2Entries.length} headwords.`);

          const styleFn = STYLES[this.options.style] || STYLES.nice;

          h2Entries.forEach((h2) => {
            const rawHeader = h2.textContent;
            const phonMatch = rawHeader.match(/\[([^\]]+)\]/);
            const phonetics = phonMatch ? phonMatch[1] : "";
            const word = rawHeader.split("[")[0].trim();
            if (!word || word.length >= 100) return;

            // Collect sibling content until next H2/HR
            let contentHtml = "";
            let next = h2.nextSibling;
            while (next && next.tagName !== "H2" && next.tagName !== "HR") {
              contentHtml += next.outerHTML || next.textContent || "";
              next = next.nextSibling;
            }

            this._ingestEntry(word, contentHtml, styleFn, phonetics, h2.outerHTML);
          });

          this.log(
            `Entries: ${this.finalMap.size}. Synonyms collected: ${this.synMap.size}.`,
          );
        }

        parseDictionaryHrBold(html) {
          const styleFn = STYLES[this.options.style] || STYLES.nice;
          const parts = html.split(/<hr\b[^>]*>/i);
          let found = 0;

          for (const seg of parts) {
            const m = seg.match(/^\s*<b[^>]*>([\s\S]*?)<\/b>\s*<br\s*\/?>/i);
            if (!m) continue;

            const word = (m[1] || "")
              .replace(/<[^>]+>/g, " ")
              .replace(/\s+/g, " ")
              .trim();
            if (!word || word.length >= 100) continue;

            let contentHtml = seg.slice(m.index + m[0].length);
            contentHtml = contentHtml.replace(/^(?:\s*<br\s*\/?>)+/i, "").trim();

            found++;
            this._ingestEntry(word, contentHtml, styleFn, "", `<h2>${word}</h2>`);
          }

          this.log(`Found ${found} headwords.`);
          this.log(
            `Entries: ${this.finalMap.size}. Synonyms collected: ${this.synMap.size}.`,
          );
        }
      }


      // ── UI ────────────────────────────────────────────────────────────────────────
      const fileInput = document.getElementById("fileInput");
      const startBtn = document.getElementById("startBtn");
      const logEl = document.getElementById("log");
      let globalBuffer = null;

      function addLog(msg) {
        logEl.textContent += `\n[${new Date().toLocaleTimeString()}] ${msg}`;
        logEl.scrollTop = logEl.scrollHeight;
      }

      document.getElementById("dropZone").onclick = () => fileInput.click();
      fileInput.addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (file) {
          document.getElementById("fileNameDisplay").textContent =
            `📁 ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
          globalBuffer = await file.arrayBuffer();
          startBtn.disabled = false;
          addLog("File loaded. Ready.");
        }
      });

      startBtn.onclick = () => {
        startBtn.disabled = true;
        startBtn.classList.add("processing");
        startBtn.textContent = "WORKING...";

        const options = {
          style: document.getElementById("styleSelect").value,
          merge: true,
          generateSyn: true,
        };

        const converter = new Converter(globalBuffer, options, addLog);
        setTimeout(async () => {
          try {
            const { finalMap, synMap } = await converter.run();
            renderOutput(finalMap, synMap, converter.encoder, true);
            startBtn.classList.remove("processing");
            startBtn.textContent = "✅ DONE";
          } catch (err) {
            addLog("ERROR: " + err.message + "\n" + err.stack);
            startBtn.disabled = false;
            startBtn.classList.remove("processing");
            startBtn.textContent = "RETRY";
          }
        }, 100);
      };

      // ── Output ────────────────────────────────────────────────────────────────────
      // Shared StarDict validator logic used by converter and standalone validator tool.
      (function () {
        function create(config) {
          const ids = config.ids || {};
          const el = {
            status: document.getElementById(ids.status),
            search: document.getElementById(ids.search),
            resultCard: document.getElementById(ids.resultCard),
            resultWord: document.getElementById(ids.resultWord),
            byteBadge: document.getElementById(ids.byteBadge),
            synInfo: document.getElementById(ids.synInfo),
            paneRendered: document.getElementById(ids.paneRendered),
            paneRaw: document.getElementById(ids.paneRaw),
            copyBtn: document.getElementById(ids.copyBtn),
          };

          let idxData = null;
          let dictData = null;
          let wordMap = new Map();
          let synMap = new Map();
          let ordinalToKey = [];
          let rawHtml = "";

          const dec = new TextDecoder("utf-8");

          function formatText(template, vars) {
            if (!vars) return template;
            return String(template).replace(/\{(\w+)}/g, (_, k) =>
              vars[k] !== undefined ? String(vars[k]) : `{${k}}`,
            );
          }

          function tr(key, fallback, vars) {
            if (typeof config.t === "function") return config.t(key, vars);
            if (typeof i18nText === "function") return i18nText(key, fallback, vars);
            return formatText(fallback || key, vars);
          }

          function setStatus(msg) {
            if (el.status) el.status.textContent = msg;
          }

          function parseIdx(buffer) {
            idxData = new DataView(buffer);
            wordMap.clear();
            ordinalToKey = [];
            let offset = 0;
            while (offset < idxData.byteLength) {
              const start = offset;
              while (offset < idxData.byteLength && idxData.getUint8(offset) !== 0)
                offset++;
              const word = dec.decode(
                new Uint8Array(idxData.buffer, start, offset - start),
              );
              offset++;
              if (offset + 8 > idxData.byteLength) break;
              const dataOffset = idxData.getUint32(offset, false);
              const dataSize = idxData.getUint32(offset + 4, false);
              const lc = word.toLowerCase();
              ordinalToKey.push(lc);
              const entry = { off: dataOffset, sz: dataSize, original: word };
              if (wordMap.has(lc)) wordMap.get(lc).push(entry);
              else wordMap.set(lc, [entry]);
              offset += 8;
            }
          }

          function parseSyn(buffer) {
            synMap.clear();
            if (!buffer) return;
            const synView = new DataView(buffer);
            let so = 0;
            while (so < synView.byteLength) {
              const ss = so;
              while (so < synView.byteLength && synView.getUint8(so) !== 0) so++;
              const alt = dec.decode(new Uint8Array(synView.buffer, ss, so - ss));
              so++;
              if (so + 4 > synView.byteLength) break;
              const ordinal = synView.getUint32(so, false);
              so += 4;
              if (ordinal < ordinalToKey.length)
                synMap.set(alt.toLowerCase(), ordinalToKey[ordinal]);
            }
          }

          function showEntry(lowerKey, matchInfo) {
            const entries = wordMap.get(lowerKey);
            if (!entries) return;

            rawHtml = entries
              .map((e) => dec.decode(new Uint8Array(dictData, e.off, e.sz)))
              .join("");
            const first = entries[0];

            if (el.resultWord) el.resultWord.textContent = first.original;
            if (el.byteBadge) {
              el.byteBadge.textContent =
                entries.length > 1
                  ? tr(
                      "validatorByteBadgeMulti",
                      "{entries} idx entries · {bytes} bytes",
                      {
                        entries: entries.length,
                        bytes: entries.reduce((s, e) => s + e.sz, 0),
                      },
                    )
                  : tr("validatorByteBadgeSingle", "{bytes} bytes", {
                      bytes: first.sz,
                    });
            }

            if (el.synInfo) {
              if (matchInfo && matchInfo.mode === "synonym") {
                el.synInfo.style.display = "block";
                el.synInfo.innerHTML = tr(
                  "validatorSynRedirect",
                  "Synonym redirect: <b>{query}</b> -> <b>{word}</b>",
                  { query: matchInfo.query, word: first.original },
                );
              } else if (matchInfo && matchInfo.mode === "fallback-word") {
                el.synInfo.style.display = "block";
                el.synInfo.innerHTML = tr(
                  "validatorFallbackWord",
                  "Inflection fallback: <b>{query}</b> -> <b>{word}</b>",
                  { query: matchInfo.query, word: first.original },
                );
              } else if (matchInfo && matchInfo.mode === "fallback-synonym") {
                el.synInfo.style.display = "block";
                el.synInfo.innerHTML = tr(
                  "validatorFallbackSynonym",
                  "Inflection -> synonym fallback: <b>{query}</b> -> <b>{word}</b>",
                  { query: matchInfo.query, word: first.original },
                );
              } else {
                el.synInfo.style.display = "none";
              }
            }

            if (el.paneRendered) el.paneRendered.innerHTML = rawHtml;
            if (el.paneRaw) el.paneRaw.textContent = rawHtml;
            if (el.resultCard) el.resultCard.style.display = "block";
          }

          function bindSearch() {
            if (!el.search) return;

            const candidateBases = (q) => {
              const out = new Set();
              const w = (q || "").toLowerCase();
              if (!w) return out;
              out.add(w);
              if (w.endsWith("ies") && w.length > 4) out.add(w.slice(0, -3) + "y");
              if (w.endsWith("es") && w.length > 3) out.add(w.slice(0, -2));
              if (w.endsWith("s") && w.length > 2) out.add(w.slice(0, -1));
              if (w.endsWith("ing") && w.length > 5) {
                out.add(w.slice(0, -3));
                out.add(w.slice(0, -3) + "e");
              }
              if (w.endsWith("ed") && w.length > 4) {
                out.add(w.slice(0, -2));
                out.add(w.slice(0, -1));
              }
              return out;
            };

            const resolveKey = (queryLower) => {
              if (wordMap.has(queryLower)) {
                return { key: queryLower, mode: "exact" };
              }
              if (synMap.has(queryLower)) {
                return { key: synMap.get(queryLower), mode: "synonym" };
              }

              for (const base of candidateBases(queryLower)) {
                if (base === queryLower) continue;
                if (wordMap.has(base)) {
                  return { key: base, mode: "fallback-word" };
                }
                if (synMap.has(base)) {
                  return { key: synMap.get(base), mode: "fallback-synonym" };
                }
              }
              return null;
            };

            el.search.addEventListener("input", (e) => {
              const query = e.target.value.trim();
              const lower = query.toLowerCase();
              if (!query) {
                if (el.resultCard) el.resultCard.style.display = "none";
                return;
              }

              const resolved = resolveKey(lower);
              const matchKey = resolved ? resolved.key : null;

              if (!matchKey) {
                if (el.resultCard) el.resultCard.style.display = "none";
                return;
              }
              showEntry(
                matchKey,
                resolved && resolved.mode !== "exact"
                  ? { mode: resolved.mode, query }
                  : null,
              );
            });
          }

          function bindCopy() {
            if (!el.copyBtn) return;
            el.copyBtn.addEventListener("click", () => {
              navigator.clipboard.writeText(rawHtml).then(() => {
                const copied = config.getCopiedLabel
                  ? config.getCopiedLabel()
                  : tr("validatorCopyDone", "Copied");
                const copy = config.getCopyLabel
                  ? config.getCopyLabel()
                  : tr("validatorCopyHtml", "Copy HTML");
                el.copyBtn.textContent = copied;
                setTimeout(() => {
                  el.copyBtn.textContent = copy;
                }, 1200);
              });
            });
          }

          async function loadFromFiles(files) {
            if (!files.idx || !files.dict) return;

            const idxBuffer = await files.idx.arrayBuffer();
            const dictBuffer = await files.dict.arrayBuffer();
            const synBuffer = files.syn ? await files.syn.arrayBuffer() : null;
            const ifoText = files.ifo
              ? dec.decode(await files.ifo.arrayBuffer())
              : "";

            loadFromBuffers({ idxBuffer, dictBuffer, synBuffer, ifoText });
          }

          function loadFromBuffers(data) {
            parseIdx(data.idxBuffer);
            dictData = data.dictBuffer;
            parseSyn(data.synBuffer || null);

            const ifoText = data.ifoText || "";
            const wordcount = (ifoText.match(/wordcount=(\d+)/) || [])[1] || "?";
            const syncount =
              (ifoText.match(/synwordcount=(\d+)/) || [])[1] || synMap.size;

            const synPart = synMap.size
              ? tr("validatorStatusReadySynonyms", " · {count} synonyms", {
                  count: synMap.size,
                })
              : "";
            const ifoSynPart =
              syncount !== "0"
                ? tr("validatorStatusReadyIfoSynPart", ", synwordcount={syncount}", {
                    syncount,
                  })
                : "";
            const ifoPart = ifoText
              ? tr(
                  "validatorStatusReadyIfo",
                  " (ifo: wordcount={wordcount}{synPart})",
                  {
                    wordcount,
                    synPart: ifoSynPart,
                  },
                )
              : "";

            setStatus(
              tr("validatorStatusReadyBase", "Ready: {entries} entries", {
                entries: wordMap.size,
              }) +
                synPart +
                ifoPart,
            );
            if (el.search) el.search.style.display = "block";
          }

          function attachFileInputs(fileInputIds) {
            const idsMap = fileInputIds || {};
            const ifoEl = document.getElementById(idsMap.ifo);
            const idxEl = document.getElementById(idsMap.idx);
            const dictEl = document.getElementById(idsMap.dict);
            const synEl = document.getElementById(idsMap.syn);

            const triggerLoad = () => {
              loadFromFiles({
                ifo: ifoEl ? ifoEl.files[0] : null,
                idx: idxEl ? idxEl.files[0] : null,
                dict: dictEl ? dictEl.files[0] : null,
                syn: synEl ? synEl.files[0] : null,
              });
            };

            [ifoEl, idxEl, dictEl, synEl].forEach((node) => {
              if (node) node.addEventListener("change", triggerLoad);
            });
          }

          bindSearch();
          bindCopy();

          return {
            loadFromBuffers,
            loadFromFiles,
            attachFileInputs,
            getRawHtml: () => rawHtml,
          };
        }

        window.StarDictValidator = {
          create,
          initFromFiles(config) {
            const api = create(config);
            api.attachFileInputs(config.fileInputIds || {});
            return api;
          },
        };
      })();

      // StarDict output renderer for PalmDoc converter.
      function renderOutput(finalMap, synMap, encoder, generateSyn) {
        document.getElementById("downloadArea").style.display = "block";
        const links = document.getElementById("links");
        links.innerHTML = "";

        // Build .dict and .idx
        // StarDict requires .idx to be sorted alphabetically (case-insensitive)
        const sortedEntries = Array.from(finalMap.entries()).sort(([a], [b]) =>
          a.toLowerCase().localeCompare(b.toLowerCase()),
        );

        const concatChunks = (chunks, total) => {
          const out = new Uint8Array(total);
          let pos = 0;
          for (const c of chunks) { out.set(c, pos); pos += c.length; }
          return out;
        };

        const wordToOrdinal = new Map();
        const nullByte = new Uint8Array(1);
        let dictChunks = [], idxChunks = [],
          dictTotalSize = 0, idxTotalSize = 0,
          offset = 0, count = 0;

        for (const [word, def] of sortedEntries) {
          wordToOrdinal.set(word, count);
          const db = encoder.encode(def);
          const wb = encoder.encode(word);
          dictChunks.push(db);
          dictTotalSize += db.length;
          idxChunks.push(wb);
          idxTotalSize += wb.length;
          idxChunks.push(nullByte);
          idxTotalSize += 1;
          const dv = new DataView(new ArrayBuffer(8));
          dv.setUint32(0, offset, false);
          dv.setUint32(4, db.length, false);
          idxChunks.push(new Uint8Array(dv.buffer));
          idxTotalSize += 8;
          offset += db.length;
          count++;
        }

        // Build .syn only from real alternate -> canonical mappings.
        let synCount = 0;
        let synChunks = [], synTotalSize = 0;

        if (generateSyn && synMap && synMap.size > 0) {
          const validSyns = [];
          for (const [alt, canonical] of synMap.entries()) {
            if (!wordToOrdinal.has(canonical)) continue;
            if (wordToOrdinal.has(alt)) continue;
            validSyns.push([alt, wordToOrdinal.get(canonical)]);
          }
          validSyns.sort(([a], [b]) => a.toLowerCase().localeCompare(b.toLowerCase()));

          for (const [alt, ordinal] of validSyns) {
            const ab = encoder.encode(alt);
            synChunks.push(ab);
            synTotalSize += ab.length;
            synChunks.push(nullByte);
            synTotalSize += 1;
            const dv = new DataView(new ArrayBuffer(4));
            dv.setUint32(0, ordinal, false);
            synChunks.push(new Uint8Array(dv.buffer));
            synTotalSize += 4;
          }
          synCount = validSyns.length;
          addLog(`Synonym file: ${synCount} entries written.`);
        }

        // .ifo
        let ifoLines = [
          "StarDict's dict ifo file",
          "version=2.4.2",
          `wordcount=${count}`,
          `idxfilesize=${idxTotalSize}`,
          "bookname=Wielki_Slownik_Ang-Pol",
          "sametypesequence=h",
        ];
        if (synCount > 0) ifoLines.push(`synwordcount=${synCount}`);
        const ifo = ifoLines.join("\n") + "\n";

        const ifoBytes = new TextEncoder().encode(ifo);
        const idxBytes = concatChunks(idxChunks, idxTotalSize);
        const dictBytes = concatChunks(dictChunks, dictTotalSize);
        const synBytesArr = synCount > 0 ? concatChunks(synChunks, synTotalSize) : null;

        // Download links
        const dl = (name, data) => {
          const a = document.createElement("a");
          a.href = URL.createObjectURL(new Blob([data]));
          a.download = name;
          a.className = "btn-dl";
          a.textContent = `⬇ ${name}`;
          links.appendChild(a);
        };
        dl("dictionary.ifo", ifoBytes);
        dl("dictionary.idx", idxBytes);
        dl("dictionary.dict", dictBytes);
        if (synCount > 0) {
          dl("dictionary.syn", synBytesArr);
          const badge = document.createElement("span");
          badge.className = "badge-syn";
          badge.textContent = `${synCount} synonyms`;
          links.appendChild(badge);
        }

        addLog(
          `✅ Done. Entries: ${count}, idx: ${idxTotalSize} B, dict: ${dictTotalSize} B${synCount ? `, syn: ${synCount}` : ""}.`,
        );

        // Preview
        const pArea = document.getElementById("previewArea");
        const pGrid = document.getElementById("previewGrid");
        pGrid.innerHTML = "";
        pArea.style.display = "block";
        const keys = sortedEntries.map(([k]) => k);
        const shown = new Set();
        const sampleKeys = [];
        for (let i = 0; i < Math.min(3, keys.length); i++) {
          let k;
          do {
            k = keys[Math.floor(Math.random() * keys.length)];
          } while (shown.has(k));
          shown.add(k);
          sampleKeys.push(k);
          const div = document.createElement("div");
          div.className = "preview-item";
          div.innerHTML =
            `<b style="color:#007bff;display:block;border-bottom:1px solid #eee;margin-bottom:5px">${k}</b>` +
            finalMap.get(k);
          pGrid.appendChild(div);
        }

        if (window.StarDictValidator) {
          if (!window.__palmValidator) {
            window.__palmValidator = window.StarDictValidator.create({
              ids: {
                status: "validatorStatus",
                search: "validatorSearchBox",
                resultCard: "validatorResultCard",
                resultWord: "validatorResultWord",
                byteBadge: "validatorByteBadge",
                synInfo: "validatorSynInfo",
                paneRendered: "validatorPaneRendered",
                copyBtn: "validatorCopyBtn",
              },
              getCopyLabel: () => "Copy HTML",
              getCopiedLabel: () => "Copied",
            });
          }
          window.__palmValidator.loadFromBuffers({
            ifoText: new TextDecoder("utf-8").decode(ifoBytes),
            idxBuffer: idxBytes.buffer,
            dictBuffer: dictBytes.buffer,
            synBuffer: synBytesArr ? synBytesArr.buffer : null,
          });

          const searchEl = document.getElementById("validatorSearchBox");
          if (searchEl && sampleKeys.length > 0) {
            const pick = sampleKeys[Math.floor(Math.random() * sampleKeys.length)];
            searchEl.value = pick;
            searchEl.dispatchEvent(new Event("input", { bubbles: true }));
          }
        }
      }


      // ── i18n ──────────────────────────────────────────────────────────────────────
      const I18N = {
        en: {
          title: "MOBI to StarDict",
          subtitle:
            'Tested with <b>Wielki Słownik Ang-Pol 2014</b> and free dictionaries from <a href="https://sowaczyta.pl/slowniki-zbiorcze/" target="_blank" rel="noopener">sowaczyta.pl/slowniki-zbiorcze</a>, e.g. <i>zbiorczy słownik czesko-polski</i> and <i>zbiorczy słownik włosko-polski</i>.',
          step1: "Step 1: Select Dictionary File",
          dropzone: "📁 Select .mobi file or drag it here",
          step2: "Step 2: Options",
          styleLabel: "🎨 Entry Style:",
          styleNone: "None – raw HTML passthrough",
          styleClean: "Clean – semantic, no inline styles",
          styleNice: "Nice Theme – headword + phonetics styled",
          styleEink: "E-ink mono – high contrast, no color styling",
          styleRich: "Rich Color – full color-coded sections",
          styleCompatibilityNote:
            "Note: selected theme may not fully apply to every dictionary structure. If formatting looks broken, switch to <b>None</b>.",
          startBtn: "START CONVERSION",
          logIdle: "Status: Idle. Waiting for file...",
          logMobiIndexSample: "Inflection examples: {sample}",
          previewTitle: "🧩 Processed Entries Preview",
          validatorTitle: "🔎 Search Generated Dictionary",
          validatorSearchPh: "🔍 Search generated dictionary...",
          doneTitle: "✅ Done! Download Files:",
        },
        pl: {
          title: "MOBI do StarDict",
          subtitle:
            'Przetestowany z <b>Wielkim Słownikiem Ang-Pol 2014</b> oraz darmowymi słownikami ze strony <a href="https://sowaczyta.pl/slowniki-zbiorcze/" target="_blank" rel="noopener">sowaczyta.pl/slowniki-zbiorcze</a>, np. <i>zbiorczy słownik czesko-polski</i> i <i>zbiorczy słownik włosko-polski</i>.',
          step1: "Krok 1: Wybierz plik słownika",
          dropzone: "📁 Wybierz plik .mobi lub przeciągnij go tutaj",
          step2: "Krok 2: Opcje",
          styleLabel: "🎨 Styl wpisów:",
          styleNone: "Brak – oryginalny HTML bez zmian",
          styleClean: "Czysty – semantyczny, bez stylów inline",
          styleNice: "Ładny – nagłówek + fonetyka ze stylem",
          styleEink: "E-ink mono – wysoki kontrast, bez kolorowania",
          styleRich: "Kolorowy – pełne kolorowanie sekcji",
          styleCompatibilityNote:
            "Uwaga: wybrany motyw może nie zadziałać w pełni dla każdego słownika. Jeśli formatowanie wygląda źle, wybierz styl: <b>Brak</b>.",
          startBtn: "ROZPOCZNIJ KONWERSJĘ",
          logIdle: "Status: Bezczynny. Oczekiwanie na plik...",
          logMobiIndexSample: "Przykłady odmian: {sample}",
          previewTitle: "🧩 Podgląd przetworzonych wpisów",
          validatorTitle: "🔎 Wyszukaj w wygenerowanym słowniku",
          validatorSearchPh: "🔍 Szukaj w wygenerowanym słowniku...",
          doneTitle: "✅ Gotowe! Pobierz pliki:",
        },
      };
      // ── i18n: language detection, application & toggle ───────────────────────────
      // Expects a global `const I18N = { en: {...}, pl: {...} }` defined before this
      // file is included. All text lives only in I18N — HTML elements are empty shells.

      (function () {
        var stored = localStorage.getItem("lang");
        var auto =
          navigator.language && navigator.language.startsWith("pl") ? "pl" : "en";
        window.LANG = stored || auto;
        document.documentElement.lang = window.LANG;
      })();

      function applyI18n() {
        var t = I18N[window.LANG] || I18N.en;
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          var v = t[el.getAttribute("data-i18n")];
          if (v !== undefined) el.textContent = v;
        });
        document.querySelectorAll("[data-i18n-html]").forEach(function (el) {
          var v = t[el.getAttribute("data-i18n-html")];
          if (v !== undefined) el.innerHTML = v;
        });
        document.querySelectorAll("[data-i18n-ph]").forEach(function (el) {
          var v = t[el.getAttribute("data-i18n-ph")];
          if (v !== undefined) el.placeholder = v;
        });
        document.querySelectorAll("[data-i18n-title]").forEach(function (el) {
          var v = t[el.getAttribute("data-i18n-title")];
          if (v !== undefined) el.title = v;
        });
        var btn = document.getElementById("langToggle");
        if (btn) btn.textContent = window.LANG === "pl" ? "🇬🇧 EN" : "🇵🇱 PL";
      }

      function toggleLang() {
        window.LANG = window.LANG === "pl" ? "en" : "pl";
        localStorage.setItem("lang", window.LANG);
        document.documentElement.lang = window.LANG;
        applyI18n();
      }

      // Script is always placed at the end of <body> — DOM is ready, safe to apply immediately.
      applyI18n();

    </script>
  </body>
