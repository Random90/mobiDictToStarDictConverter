      // ── i18n helpers ──────────────────────────────────────────────────────────
      function formatI18nText(template, vars) {
        if (!vars) return template;
        return String(template).replace(/\{(\w+)}/g, (_, k) =>
          vars[k] !== undefined ? String(vars[k]) : `{${k}}`,
        );
      }

      function i18nText(key, fallback, vars) {
        const tables = window.__I18N_TABLES || {};
        const lang = window.LANG || "en";
        const table = tables[lang] || tables.en || {};
        const en = tables.en || {};
        const base = table[key] !== undefined ? table[key] : en[key];
        const text = base !== undefined ? base : fallback || key;
        return formatI18nText(text, vars);
      }

      // ── Unified style engines ─────────────────────────────────────────────────
      // Both KF8 (2-arg) and PalmDoc (4-arg) calling conventions are supported.
      // When rawH2Html argument is present → PalmDoc mode; otherwise → KF8 mode.
      const STYLES = {
        _escapeRegExp(s) {
          return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        },

        _ensureHeadwordSpan(word, html) {
          if (/<span\s*>\s*<b>[\s\S]*?<\/b>\s*<\/span>/i.test(html))
            return html;
          const w = (word || "").trim();
          if (!w) return html;
          const escaped = STYLES._escapeRegExp(w);
          const hMatch = html.match(
            /^\s*<h([1-6])\b[^>]*>([\s\S]*?)<\/h\1>\s*/i,
          );
          if (hMatch) {
            const plain = hMatch[2]
              .replace(/<[^>]+>/g, " ")
              .replace(/\s+/g, " ")
              .trim();
            const reLeadWord = new RegExp(`^${escaped}(?:\\b|\\s)`, "i");
            if (reLeadWord.test(plain)) {
              const tail = plain
                .replace(new RegExp(`^${escaped}\\s*`, "i"), "")
                .trim();
              const rest = html.slice(hMatch[0].length);
              return `<span><b>${w}</b></span>${tail ? ` ${tail}` : ""}${rest ? ` ${rest}` : ""}`.trim();
            }
          }
          const leadRe = new RegExp(`^\\s*${escaped}(?:\\b|\\s*)`, "i");
          if (leadRe.test(html))
            return html.replace(leadRe, `<span><b>${w}</b></span> `);
          return html;
        },

        none(word, pHtmlOrPhonetics, rawH2Html, contentHtml) {
          if (rawH2Html !== undefined) return rawH2Html + contentHtml;
          return pHtmlOrPhonetics;
        },

        clean(word, pHtmlOrPhonetics, rawH2Html, contentHtml) {
          if (rawH2Html !== undefined) {
            const strip = (h) => h.replace(/ style="[^"]*"/g, "");
            const ph = pHtmlOrPhonetics ? ` <em>${pHtmlOrPhonetics}</em>` : "";
            return `<b>${word}</b>${ph}<br>${strip(contentHtml)}`;
          }
          return pHtmlOrPhonetics
            .replace(/ width="[^"]*"/gi, "")
            .replace(/ style="[^"]*"/gi, "");
        },

        nice(word, pHtmlOrPhonetics, rawH2Html, contentHtml) {
          if (rawH2Html !== undefined) {
            const ph = pHtmlOrPhonetics
              ? ` <span style="color:#666;font-size:.88em;font-style:italic">${pHtmlOrPhonetics}</span>`
              : "";
            let content = contentHtml
              .replace(
                /(<i>(?:n|v|adj|adv|prep|conj|pron|interj|abbr|acr)\b.*?<\/i>)/g,
                '<span style="color:#c0392b;font-weight:bold">$1</span>',
              )
              .replace(
                /(<b>(?:\d+)\.?<\/b>)/g,
                '<span style="color:#2980b9;font-weight:bold">$1</span>',
              );
            return `<div style="margin-bottom:6px"><b style="font-size:1.15em;color:#003d82">${word}</b>${ph}</div>${content}`;

      // parseMobiIndexes – shared MOBI ORTH+INFL binary index decoder

      // converters.  INDX records are part of the MOBI container format and can
      // exist in both MOBI7 (PalmDoc) and MOBI8 (KF8) dictionary files.
      //

      //   raw               – Uint8Array of the entire .mobi file
      //   recsOffsets       – flat Array<number> of record start offsets within raw
      //   logFn             – optional logging callback
      //   externalHeadwords – optional Array<string> of headwords indexed by ORTH
      //                       ordinal (i.e. in the same order as the binary ORTH
      //                       index sub-records).  When supplied, binary ORTH label
      //                       decoding is skipped and this array is used directly.
      //                       ⚠ The array MUST be in ORTH ordinal order – passing
      //                       words in any other order (e.g. HTML extraction order)

      //                       cases it is simpler and more correct to pass null and
      //                       let the built-in ORDT-aware binary decoder handle it.
      //
      // Returns Map<string, string>: inflectedForm → canonicalHeadword.
      //
      // ORTH label encoding:
      //   KF8 / modern Mobipocket dictionaries with non-ASCII headwords use ORDT
      //   (character remapping table) encoding: each label byte is an index into a
      //   uint16 codepoint table stored in the INDX control record.  The decoder
      //   detects ORDT automatically via the `code` field (0xfdea) or the `ocnt`
      //   flag in the INDX header, and falls back to plain UTF-8 for standard files.
      //
      // INFL binary format (MOBI INDX):
      //   ORTH entries have tag42 = inflection group ID (1..N)
      //   INFL entries fall into two categories:
      //     A) Paradigm template entries (empty label, tag26 present):
      //        tag26 = list of INFL form-entry ordinals belonging to this paradigm.
      //        The INFL ordinal G of the template equals the paradigm group ID,
      //        matching ORTH tag42=G.
      //     B) Form entries (non-empty label, no tag26):
      //        Label encodes the inflected form as reversed suffix chunks:
      //          [0x02][reversed_form_suffix][0x03][reversed_canonical_suffix]
      //        Inflected form = (canonical stripped of canonical_suffix) + form_suffix
      //        Label bytes starting with 0x01 are grammar/metadata entries (skipped).
      //        INFL labels are always plain UTF-8 (never ORDT-encoded).
      // ─────────────────────────────────────────────────────────────────────────────
      function parseMobiIndexes(
        raw,
        recsOffsets,
        logFn,
        externalHeadwords,
        outputMap,
      ) {
        const log = logFn || (typeof addLog === "function" ? addLog : () => {});
        // i18n helper: uses global i18nText (defined by the host template) when available,
        // otherwise substitutes variables into the English fallback string directly.
        const t = (key, fallback, vars) => {
          if (typeof i18nText === "function") return i18nText(key, fallback, vars);
          if (!vars) return fallback;
          return String(fallback).replace(/\{(\w+)}/g, (_, k) =>
            vars[k] !== undefined ? String(vars[k]) : `{${k}}`,
          );
        };
        // outputMap: when provided, inflected forms are written directly into this
        // Map (e.g. the converter's synMap), avoiding a large intermediate collection.
        const inflMap = outputMap instanceof Map ? outputMap : new Map();
        const utf8 = new TextDecoder("utf-8", { fatal: false });
        const totalLen = raw.length;

        const getRec = (i) => {
          const s = recsOffsets[i];
          const e = i + 1 < recsOffsets.length ? recsOffsets[i + 1] : totalLen;
          return raw.subarray(s, e); // zero-copy view
        };

        const ru32 = (a, o) =>
          ((a[o] << 24) | (a[o + 1] << 16) | (a[o + 2] << 8) | a[o + 3]) >>> 0;
        const ru16 = (a, o) => ((a[o] << 8) | a[o + 1]) >>> 0;

        // Variable-width integer: high bit (0x80) SET = last byte.
        const readVWI = (a, p) => {
          let v = 0;
          while (p < a.length) {
            const b = a[p++];
            v = ((v << 7) | (b & 0x7f)) >>> 0;
            if (b & 0x80) break;
          }
          return [v, p];
        };

        // Lowest-set-bit position of a bitmask.
        const maskShift = (mask) => {
          if (!mask) return 0;
          let s = 0,
            m = mask;
          while (m && !(m & 1)) {
            s++;
            m >>>= 1;
          }
          return s;
        };

        // Returns an array of Unicode codepoints indexed by byte value, or null.
        //
        // INDX header layout (offsets from record start, all uint32 big-endian):
        //   0x04: headerLength
        //   0x1c: code     (0xfdea = ORDT-encoded labels)
        //   0xa4: ocnt     (non-zero also signals ORDT presence)
        //   0xa8: oentries (number of entries in each ORDT table)
        //   0xac: op1      (absolute offset of ORDT1 within this record)
        //   0xb0: op2      (absolute offset of ORDT2 within this record)
        //
        // Both ORDT1 and ORDT2 start with a 4-byte 'ORDT' magic marker.
        // ORDT2 contains oentries × uint16 codepoints; we use ORDT2 for decoding
        // (it is the full-Unicode table, whereas ORDT1 is a legacy single-byte one).
        // Requires both markers to be valid, mirroring KindleUnpack / Python behaviour.
        const readOrdt = (rec) => {
          if (rec.length < 0xb4) return null;
          const code = ru32(rec, 0x1c); // encoding flag
          const ocnt = ru32(rec, 0xa4); // ORDT-present signal
          const oentries = ru32(rec, 0xa8);
          const op1 = ru32(rec, 0xac);
          const op2 = ru32(rec, 0xb0);
          if (!(code === 0xfdea || ocnt) || oentries === 0) return null;
          // Validate both ORDT1 and ORDT2 markers (both must be 'ORDT')
          if (op1 + 4 > rec.length || op2 + 4 + oentries * 2 > rec.length)
            return null;
          if (
            rec[op1] !== 0x4f ||
            rec[op1 + 1] !== 0x52 ||
            rec[op1 + 2] !== 0x44 ||
            rec[op1 + 3] !== 0x54
          )
            return null;
          if (
            rec[op2] !== 0x4f ||
            rec[op2 + 1] !== 0x52 ||
            rec[op2 + 2] !== 0x44 ||
            rec[op2 + 3] !== 0x54
          )
            return null;
          const ordt = [];
          for (let i = 0; i < oentries; i++) ordt.push(ru16(rec, op2 + 4 + i * 2));
          return ordt;
        };

        // Decode an ORTH label.
        //   With ORDT: each byte is an index into the codepoint table; codepoint 0 → skip.
        //   Without:   filter bytes < 0x05 (control markers) then decode as UTF-8.
        const decodeOrthLabel = (labelBytes, ordt) => {
          if (ordt) {
            let s = "";
            for (const b of labelBytes) {
              const cp = b < ordt.length ? ordt[b] : b;
              if (cp > 0) s += String.fromCodePoint(cp);
            }
            return s;
          }
          return utf8.decode(labelBytes.filter((b) => b >= 0x05));
        };

        // Parse TAGX section within rec at tagxOff.
        const parseTagx = (rec, tagxOff) => {
          if (tagxOff + 12 > rec.length) return null;
          if (
            rec[tagxOff] !== 0x54 ||
            rec[tagxOff + 1] !== 0x41 ||
            rec[tagxOff + 2] !== 0x47 ||
            rec[tagxOff + 3] !== 0x58
          )
            return null;
          const tagxLen = ru32(rec, tagxOff + 4);
          const ctrlByteCount = ru32(rec, tagxOff + 8);
          const nTags = Math.floor((tagxLen - 12) / 4);
          const tags = [];
          for (let i = 0; i < nTags; i++) {
            const b = tagxOff + 12 + i * 4;
            tags.push({
              tag: rec[b],
              numVals: rec[b + 1],
              mask: rec[b + 2],
              end: rec[b + 3],
              shift: maskShift(rec[b + 2]),
            });
          }
          return { ctrlByteCount, tags };
        };

        // Parse all entries from an INDX data sub-record.
        // Entry layout: [labelLen:u8][label bytes][ctrlBytes][VWI tag values…]
        //
        // Returns array of { labelBytes, tagVals } objects.
        const parseSubRec = (rec, tagx) => {
          if (rec.length < 0x20) return [];
          const nEntries = ru32(rec, 0x18);
          const idxtOff = ru32(rec, 0x14);
          if (
            nEntries === 0 ||
            idxtOff === 0 ||
            idxtOff + 4 + nEntries * 2 > rec.length
          )
            return [];
          if (
            rec[idxtOff] !== 0x49 ||
            rec[idxtOff + 1] !== 0x44 ||
            rec[idxtOff + 2] !== 0x58 ||
            rec[idxtOff + 3] !== 0x54
          )
            return [];

          const entries = [];
          for (let i = 0; i < nEntries; i++) {
            if (idxtOff + 4 + i * 2 + 2 > rec.length) break;
            const entryOff = ru16(rec, idxtOff + 4 + i * 2);
            let pos = entryOff;
            if (pos + 1 > rec.length) break;

            // Single-byte label length, then label bytes
            const labelLen = rec[pos++];
            if (pos + labelLen > rec.length) break;
            const labelBytes = rec.subarray(pos, pos + labelLen); // zero-copy view
            pos += labelLen;

            if (pos + tagx.ctrlByteCount > rec.length) break;
            const ctrlBytes = rec.subarray(pos, pos + tagx.ctrlByteCount); // zero-copy view
            pos += tagx.ctrlByteCount;

            // Two-pass tag-value parsing (mirrors KindleUnpack's getTagMap design):
            //
            // Pass 1 – scan control bits and, for *extended* tags (multi-bit mask
            //   all set), read the VWI byte-count header immediately.  ALL byte-count
            //   VWIs for ALL tags are consumed first, advancing pos past the header
            //   block.  Direct-count tags consume nothing here.
            //
            // Pass 2 – read actual VWI values in tag order, using the counts collected
            //   in pass 1.  This ordering matches the on-disk layout:
            //     [ctrl][byteCount_T1][byteCount_T2]…[values_T1][values_T2]…
            //
            const tagSpecs = [];
            const tagVals = {};
            let cbIdx = 0;
            for (const t of tagx.tags) {
              if (t.mask !== 0 && cbIdx < ctrlBytes.length) {
                const maskedVal = ctrlBytes[cbIdx] & t.mask;
                if (maskedVal !== 0) {
                  const maskBits = t.mask
                    .toString(2)
                    .split("")
                    .filter((c) => c === "1").length;
                  if (maskBits > 1 && maskedVal === t.mask) {
                    // Extended: consume the VWI byte-count header NOW (pass 1).
                    const [byteCount, np0] = readVWI(rec, pos);
                    pos = np0;
                    tagSpecs.push({ tag: t.tag, count: null, byteCount });
                  } else {
                    // Direct: count is encoded in the control bits, no header to read.
                    const flagValue = maskedVal >>> t.shift;
                    const count = t.numVals * flagValue;
                    tagSpecs.push({ tag: t.tag, count, byteCount: null });
                  }
                }
              }
              if (t.end) cbIdx++;
            }
            // Pass 2 – read VWI values for each tag in order.
            for (const spec of tagSpecs) {
              const vals = [];
              if (spec.count !== null) {
                for (let v = 0; v < spec.count && pos < rec.length; v++) {
                  const [val, np] = readVWI(rec, pos);
                  vals.push(val);
                  pos = np;
                }
              } else {
                const limit = pos + spec.byteCount;
                while (pos < limit && pos < rec.length) {
                  const [val, np] = readVWI(rec, pos);
                  vals.push(val);
                  pos = np;
                }
              }
              tagVals[spec.tag] = vals;
            }
            entries.push({ labelBytes, tagVals });
          }
          return entries;
        };

        // Reverse a Uint8Array byte-by-byte (for reversed UTF-8 suffix chunks).
        const reverseBytes = (arr) => {
          const r = new Uint8Array(arr.length);
          for (let i = 0; i < arr.length; i++) r[i] = arr[arr.length - 1 - i];
          return r;
        };

        // Parse a Type-B INFL form entry label.
        // Returns { formSuffix, canonicalSuffix } or null if not a Type-B entry.
        //
        // Label format:  [0x02][reversed_form_suffix_bytes][0x03][reversed_canonical_suffix_bytes]
        //   - 0x02 chunk (mandatory): reversed bytes → form suffix string
        //   - 0x03 chunk (optional):  reversed bytes → canonical suffix string (empty = no stripping)
        //   - 0x01 prefix entries are grammar/metadata (Type A) – skipped by returning null
        //   - Other marker bytes (0x04, 0x0c, …) are ignored
        const parseFormLabel = (lb) => {
          if (!lb || lb.length === 0 || lb[0] === 0x01) return null;

          let formSuffixBytes = null;
          let canonicalSuffixBytes = null;

          let i = 0;
          while (i < lb.length) {
            const marker = lb[i++];
            // Read chunk until next control byte (< 0x20) or end
            const start = i;
            while (i < lb.length && lb[i] >= 0x20) i++;
            const chunk = lb.slice(start, i);

            if (marker === 0x02) formSuffixBytes = chunk;
            else if (marker === 0x03) canonicalSuffixBytes = chunk;
            // 0x04, 0x0c, etc. → ignore
          }

          if (!formSuffixBytes) return null;

          const formSuffix = utf8.decode(reverseBytes(formSuffixBytes));
          const canonicalSuffix = canonicalSuffixBytes
            ? utf8.decode(reverseBytes(canonicalSuffixBytes))
            : "";

          return { formSuffix, canonicalSuffix };
        };

        // Scan all records to build INDX groups (control record + data sub-records).
        const groups = [];
        let cur = null;
        for (let i = 0; i < recsOffsets.length; i++) {
          const s = recsOffsets[i];
          if (totalLen - s < 4) continue;
          if (
            raw[s] !== 0x49 ||
            raw[s + 1] !== 0x4e ||
            raw[s + 2] !== 0x44 ||
            raw[s + 3] !== 0x58
          )
            continue;

          const rec = getRec(i);
          if (rec.length < 8) continue;
          const hdrLen = ru32(rec, 4);
          if (hdrLen >= rec.length) continue;

          const tagx = parseTagx(rec, hdrLen);
          if (tagx) {
            cur = { ctrlRecIdx: i, tagx, subRecs: [] };
            groups.push(cur);
          } else if (cur) {
            cur.subRecs.push(i);
          }
        }

        if (groups.length < 2) return inflMap;

        // Identify groups by TAGX tag numbers:
        //   ORTH: contains tag 42 (infl_group_ref)
        //   INFL: contains tag 26 (form entry list in paradigm templates)
        //         also contains tag 27 in form entries, but group is identified by tag 26
        const orthGroup = groups.find((g) => g.tagx.tags.some((t) => t.tag === 42));
        const inflGroup = groups.find((g) =>
          g.tagx.tags.some((t) => t.tag === 26 || t.tag === 27),
        );

        if (!orthGroup) return inflMap;
        if (!inflGroup) return inflMap;

        // Read ORDT from the ORTH control record for correct label decoding.
        const orthOrdt = readOrdt(getRec(orthGroup.ctrlRecIdx));

        // Build orthHeadwords AND groupHeadwords in a single pass over ORTH sub-records.
        // Previously this was two separate passes; combining them halves the ORTH
        // parsing work and reduces getRec() calls.
        let orthHeadwords;
        const groupHeadwords = new Map(); // G → string[]

        if (Array.isArray(externalHeadwords) && externalHeadwords.length > 0) {
          // Caller supplied pre-decoded headwords; still need one pass for groupHeadwords.
          orthHeadwords = externalHeadwords;
          let oOrd = 0;
          for (const ri of orthGroup.subRecs) {
            for (const e of parseSubRec(getRec(ri), orthGroup.tagx)) {
              const t42 = e.tagVals[42];
              if (t42 && t42.length > 0) {
                const g = t42[0];
                if (!groupHeadwords.has(g)) groupHeadwords.set(g, []);
                const hw = orthHeadwords[oOrd];
                if (hw) groupHeadwords.get(g).push(hw);
              }
              oOrd++;
            }
          }
        } else {
          // Single combined pass: decode labels AND collect groupHeadwords together.
          orthHeadwords = [];
          for (const ri of orthGroup.subRecs) {
            for (const e of parseSubRec(getRec(ri), orthGroup.tagx)) {
              const hw = decodeOrthLabel(e.labelBytes, orthOrdt);
              orthHeadwords.push(hw);
              const t42 = e.tagVals[42];
              if (t42 && t42.length > 0) {
                const g = t42[0];
                if (!groupHeadwords.has(g)) groupHeadwords.set(g, []);
                if (hw) groupHeadwords.get(g).push(hw);
              }
            }
          }
        }

        if (orthHeadwords.length === 0) return inflMap;

        // ── Step 1: Pre-load ALL INFL entries into a flat array ─────────────────────
        //
        // INFL entries fall into two types by their position:
        //   - Paradigm template entries (empty label, tag26): one per inflection group G,
        //     at ordinal == G.  Their tag26 lists the ordinals of all form entries that
        //     belong to this paradigm.
        //   - Form entries (non-empty label, tag27): encode a specific inflected form
        //     via reversed-suffix label bytes.
        //
        // We pre-load everything so we can do O(1) random access by ordinal.
        //
        const inflEntries = [];
        for (const ri of inflGroup.subRecs) {
          for (const e of parseSubRec(getRec(ri), inflGroup.tagx)) {
            inflEntries.push(e);
          }
        }

        if (groupHeadwords.size === 0) return inflMap;

        // ── Step 2: Process paradigm templates → derive inflected forms ─────────────
        //
        // A paradigm template entry at INFL ordinal G corresponds to group G.
        // Its tag26 list contains ordinals of form entries.  Each form entry's label
        // encodes the inflected form via reversed-suffix chunks:
        //
        //   label = [0x02][rev_form_bytes][0x03][rev_canonical_bytes]
        //
        // Algorithm for each (canonical, form_entry) pair:
        //   canonical_suffix = reverse(rev_canonical_bytes)
        //   form_suffix      = reverse(rev_form_bytes)
        //   if canonical.endsWith(canonical_suffix):
        //     stem = canonical[:-len(canonical_suffix)]
        //     form = stem + form_suffix
        //     inflMap.set(form, canonical)   ← unless form == canonical
        //
        let inflAdded = 0;
        for (let G = 0; G < inflEntries.length; G++) {
          const tmpl = inflEntries[G];
          const t26 = tmpl.tagVals[26];
          if (!t26 || t26.length === 0) continue; // not a template

          const headwords = groupHeadwords.get(G);
          if (!headwords || headwords.length === 0) continue;

          for (const formOrd of t26) {
            if (formOrd >= inflEntries.length) continue;
            const formEntry = inflEntries[formOrd];
            const parsed = parseFormLabel(formEntry.labelBytes);
            if (!parsed) continue;

            const { formSuffix, canonicalSuffix } = parsed;

            for (const canonical of headwords) {
              let stem;
              if (canonicalSuffix) {
                if (!canonical.endsWith(canonicalSuffix)) continue;
                stem = canonical.slice(0, canonical.length - canonicalSuffix.length);
              } else {
                stem = canonical;
              }
              const form = stem + formSuffix;
              // !inflMap.has(form) check: first-one-wins deduplication.
              // When inflMap IS the caller's synMap this also avoids overwriting
              // synonyms that were already collected from the HTML.
              if (form && form !== canonical && !inflMap.has(form)) {
                inflMap.set(form, canonical);
                inflAdded++;
              }
            }
          }
        }

        if (inflAdded > 0) {
          const sampleEntries = [];
          let sampled = 0;
          for (const [k, v] of inflMap) {
            if (sampled++ >= 5) break;
            sampleEntries.push(`${k}→${v}`);
          }
          log(
            t("logMobiIndexSample", "Inflection examples: {sample}", {
              sample: sampleEntries.join(", "),
            }),
          );
        }

        // When writing directly into an external map, return a lightweight proxy
        // object whose .size reports only the newly added count so callers can
        // still use `inflMap.size > 0` for logging without confusion.
        if (outputMap instanceof Map) {
          return { size: inflAdded, entries: () => [][Symbol.iterator]() };
        }

        return inflMap;
      }

      // ─────────────────────────────────────────────────────────────────────────────
      // HuffCdicBase – shared HUFF/CDIC decompression logic
      // Used by mobiConverter.html and Tools/MobiReader.html
      // DO NOT edit the compiled HTML files directly – edit this file and the
      // templates, then run:  node build.js
      // ─────────────────────────────────────────────────────────────────────────────
      class HuffCdicBase {
        constructor(buffer) {
          this.buffer = buffer;
          this.raw = new Uint8Array(buffer);
          this.recs = [];
          // Flat TypedArrays for dict1 (256 entries, indexed by top 8 bits of code).
          // Using TypedArrays instead of an object array avoids pointer chasing in
          // the 33M-iteration decompression inner loop and fits in L1 cache.
          this.dict1Codelen = new Uint8Array(256);
          this.dict1Term = new Uint8Array(256); // 1 = terminal, 0 = non-terminal
          this.dict1Maxcode = new Uint32Array(256);
          // min/max code arrays for non-terminal codeword lookup (indices 1..32).
          this.mincodeArr = new Uint32Array(33);
          this.maxcodeArr = new Uint32Array(33);
          this.dict = [];
          // Pre-allocated output buffer reused across top-level decompress() calls.
          // Avoids 53K × (new Uint8Array + new Array + 80 pushes + copy loop).
          // 131072 bytes ≫ any single KF8 text record (typically 2-8 KB).
          this._decompOutBuf = new Uint8Array(131072);
        }

        t(key, fallback, vars) {
          if (typeof i18nText === "function") return i18nText(key, fallback, vars);
          return String(fallback || key).replace(/\{(\w+)}/g, (_, k) =>
            vars && vars[k] !== undefined ? String(vars[k]) : `{${k}}`,
          );
        }

        _stripTrailingWithFlags(data, flags) {
          // KindleUnpack parity: count trailer entries from set bits > 0 and trim one entry per count.
          const multibyte = flags & 1;
          let trailers = 0;
          let tmp = flags >>> 1;
          while (tmp > 0) {
            if (tmp & 1) trailers++;
            tmp >>>= 1;
          }

          const getSizeOfTrailingDataEntry = (buf) => {
            if (buf.length === 0) return 0;
            let num = 0;
            const start = Math.max(0, buf.length - 4);
            for (let i = start; i < buf.length; i++) {
              const v = buf[i];
              if (v & 0x80) num = 0;
              num = ((num << 7) | (v & 0x7f)) >>> 0;
            }
            return num;
          };

          let out = data;
          for (let i = 0; i < trailers; i++) {
            const num = getSizeOfTrailingDataEntry(out);
            const keep = Math.max(0, out.length - num);
            out = out.subarray(0, keep);
          }

          if (multibyte) {
            const tail = out.length ? out[out.length - 1] : 0;
            const num = (tail & 3) + 1;
            const keep = Math.max(0, out.length - num);
            out = out.subarray(0, keep);
          }

          return out;
        }

        _normalizeExtraDataFlags(raw, sourceLabel) {
          if (raw === 0xffff) {
            // For sentinel/noisy values, start in conservative mode immediately.
            addLog(
              this.t(
                "logExtraDataSentinel",
                "⚠️ {source}: ExtraDataFlags is 0xFFFF (sentinel/noisy), forcing conservative strip mode 0x1.",
                {
                  source: sourceLabel,
                },
              ),
            );
            return 0x0001;
          }
          // MOBI ExtraDataFlags trailer layout uses low bits; high bits are often noisy/vendor-specific.
          const masked = raw & 0x001f;
          if (masked !== raw) {
            addLog(
              this.t(
                "logExtraDataMask",
                "⚠️ {source}: masking ExtraDataFlags 0x{from} -> 0x{to}",
                {
                  source: sourceLabel,
                  from: raw.toString(16),
                  to: masked.toString(16),
                },
              ),
            );
          }
          return masked || 0x0001;
        }

        // ── Low-level readers ─────────────────────────────────────────────────────
        u32(o) {
          const r = this.raw;
          return ((r[o] << 24) | (r[o + 1] << 16) | (r[o + 2] << 8) | r[o + 3]) >>> 0;
        }
        u16(o) {
          return ((this.raw[o] << 8) | this.raw[o + 1]) >>> 0;
        }

        _getRecord0Base() {
          const r0 = this.recs[0];
          let mobi = r0 + 16;
          if (
            !(
              this.raw[mobi] === 0x4d &&
              this.raw[mobi + 1] === 0x4f &&
              this.raw[mobi + 2] === 0x42 &&
              this.raw[mobi + 3] === 0x49
            )
          ) {
            mobi = r0;
          }
          return mobi === r0 + 16 ? r0 : mobi;
        }

        // PalmDOC text_records is the authoritative end of text payload.
        getTextRecordMax(huffIdx) {
          const recBase = this._getRecord0Base();
          const headerCount = this.u16(recBase + 0x08);
          const huffBound = Math.max(0, huffIdx - 1);

          if (!headerCount) return huffBound;
          if (headerCount > huffBound) {
            addLog(
              this.t(
                "logTextRecordsClamp",
                "⚠️ text_records ({headerCount}) exceeds HUFF bound ({huffBound}); clamping.",
                {
                  headerCount,
                  huffBound,
                },
              ),
            );
            return huffBound;
          }
          return headerCount;
        }

        // ── PDB record list ───────────────────────────────────────────────────────
        // Populates this.recs with file offsets and returns the array.
        buildRecords() {
          const n = this.u16(76);
          this.recs = [];
          for (let i = 0; i < n; i++) this.recs.push(this.u32(78 + i * 8));
          return this.recs;
        }

        // ── Find ExtraDataFlags ───────────────────────────────────────────────────
        // KindleUnpack-parity lookup for pure and hybrid KF8 files (EXTH tag 121 boundary override).
        findExtraDataFlags() {
          const recs = this.recs;
          const recBase = this._getRecord0Base();

          // KindleUnpack header offsets are relative to the record start (PalmDOC + MOBI block).
          const hdrLen = this.u32(recBase + 0x14);
          const mobiVer = this.u32(recBase + 0x68);
          const encoding = hdrLen >= 0x10 ? this.u32(recBase + 0x1c) : 0;

          const verLabel =
            mobiVer >= 8 ? "KF8" : mobiVer >= 6 ? "MOBI6" : `MOBI${mobiVer}`;
          const encLabel =
            encoding === 65001 || encoding === 0
              ? "UTF-8"
              : encoding === 1252
                ? "Windows-1252"
                : `encoding ${encoding}`;
          addLog(
            this.t("logMobiFormat", "MOBI: {label} (v{ver}), encoding: {enc}", {
              label: verLabel,
              ver: mobiVer,
              enc: encLabel,
            }),
          );

          let flags = 0x0001;
          if (hdrLen >= 0xe4 && mobiVer >= 5) {
            const raw = this.u16(recBase + 0xf2);
            flags = this._normalizeExtraDataFlags(raw, "MOBI header");
          }

          // EXTH tag 121 points to the KF8 boundary; when present, use KF8 section flags.
          const exthOff = recBase + 16 + hdrLen;
          if (
            this.raw[exthOff] === 0x45 &&
            this.raw[exthOff + 1] === 0x58 &&
            this.raw[exthOff + 2] === 0x54 &&
            this.raw[exthOff + 3] === 0x48
          ) {
            const exthLen = this.u32(exthOff + 4);
            const numRec = this.u32(exthOff + 8);
            let pos = exthOff + 12;

            for (let i = 0; i < numRec && pos + 8 <= exthOff + exthLen; i++) {
              const tag = this.u32(pos);
              const len = this.u32(pos + 4);
              if (tag === 121 && len === 12) {
                const kf8Bound = this.u32(pos + 8);
                const kf8RecIdx = kf8Bound + 1;
                if (kf8RecIdx < recs.length) {
                  const kf8Off = recs[kf8RecIdx];
                  let kf8Mobi = kf8Off + 16;
                  if (
                    !(
                      this.raw[kf8Mobi] === 0x4d &&
                      this.raw[kf8Mobi + 1] === 0x4f &&
                      this.raw[kf8Mobi + 2] === 0x42 &&
                      this.raw[kf8Mobi + 3] === 0x49
                    )
                  )
                    kf8Mobi = kf8Off;
                  const kf8Base = kf8Mobi === kf8Off + 16 ? kf8Off : kf8Mobi;
                  const kl = this.u32(kf8Base + 0x14);
                  const kv = this.u32(kf8Base + 0x68);
                  if (kl >= 0xe4 && kv >= 5) {
                    const raw = this.u16(kf8Base + 0xf2);
                    flags = this._normalizeExtraDataFlags(raw, "KF8 override");
                  }
                }
              }
              pos += len;
            }
          }

          return flags;
        }

        // ── Strip trailing bytes ───────────────────────────────────────────────────
        stripTrailing(data, flags) {
          if (!flags || data.length === 0) return data;
          return this._stripTrailingWithFlags(data, flags);
        }

        // ── Load HUFF record ──────────────────────────────────────────────────────
        loadHuff(hOff) {
          if (
            this.raw[hOff] !== 0x48 ||
            this.raw[hOff + 1] !== 0x55 ||
            this.raw[hOff + 2] !== 0x46 ||
            this.raw[hOff + 3] !== 0x46 ||
            this.raw[hOff + 4] !== 0x00 ||
            this.raw[hOff + 5] !== 0x00 ||
            this.raw[hOff + 6] !== 0x00 ||
            this.raw[hOff + 7] !== 0x18
          ) {
            throw new Error(this.t("errInvalidHuffHeader", "invalid huff header"));
          }

          const off1 = this.u32(hOff + 8);
          const off2 = this.u32(hOff + 12);
          // Populate flat TypedArray tables (one entry per top-byte value 0-255).
          for (let i = 0; i < 256; i++) {
            const v = this.u32(hOff + off1 + i * 4);
            const codelen = v & 0x1f;
            const term = !!(v & 0x80);
            if (codelen === 0)
              throw new Error(
                this.t(
                  "errInvalidHuffTableZeroCodeLen",
                  "invalid huff table: zero codelen",
                ),
              );
            if (codelen <= 8 && !term)
              throw new Error(
                this.t(
                  "errInvalidHuffTableShortNonTerminal",
                  "invalid huff table: short non-terminal code",
                ),
              );
            const mxraw = (v >>> 8) >>> 0;
            const maxcode =
              Number((BigInt(mxraw + 1) << BigInt(32 - codelen)) - 1n) >>> 0;
            this.dict1Codelen[i] = codelen;
            this.dict1Term[i] = term ? 1 : 0;
            this.dict1Maxcode[i] = maxcode;
          }
          this.mincodeArr = new Uint32Array(33);
          this.maxcodeArr = new Uint32Array(33);
          for (let i = 1; i <= 32; i++) {
            const rawMin = this.u32(hOff + off2 + (i - 1) * 8);
            const rawMax = this.u32(hOff + off2 + (i - 1) * 8 + 4);
            const shift = 32 - i;
            this.mincodeArr[i] = Number(BigInt(rawMin) << BigInt(shift)) >>> 0;
            this.maxcodeArr[i] =
              Number((BigInt(rawMax + 1) << BigInt(shift)) - 1n) >>> 0;
          }
          addLog(
            this.t("logHuffLoaded", "HUFF loaded. off1=0x{off1} off2=0x{off2}", {
              off1: off1.toString(16),
              off2: off2.toString(16),
            }),
          );
        }

        // ── Load one CDIC record ──────────────────────────────────────────────────
        loadCdic(rOff) {
          if (
            this.raw[rOff] !== 0x43 ||
            this.raw[rOff + 1] !== 0x44 ||
            this.raw[rOff + 2] !== 0x49 ||
            this.raw[rOff + 3] !== 0x43 ||
            this.raw[rOff + 4] !== 0x00 ||
            this.raw[rOff + 5] !== 0x00 ||
            this.raw[rOff + 6] !== 0x00 ||
            this.raw[rOff + 7] !== 0x10
          ) {
            throw new Error(this.t("errInvalidCdicHeader", "invalid cdic header"));
          }

          const phrases = this.u32(rOff + 8);
          const bits = this.u32(rOff + 12);
          const n = Math.min(1 << bits, phrases - this.dict.length);
          for (let j = 0; j < n; j++) {
            const off = this.u16(rOff + 16 + j * 2);
            const blen = this.u16(rOff + 16 + off);
            const flag = !!(blen & 0x8000);
            const slen = blen & 0x7fff;
            const slice = this.raw.subarray(rOff + 18 + off, rOff + 18 + off + slen);
            // Store as [slice, flagBit] to defer expansion until loadAllCdic finishes.
            this.dict.push(flag ? slice : { slice, flag: false });
          }
        }

        // ── Load all consecutive CDIC records after a HUFF record ────────────────
        // After all records are loaded, pre-expand every non-terminal (compressed)
        // CDIC entry so the hot decompress loop only ever sees plain Uint8Arrays.
        // This eliminates the per-symbol flag check and {slice,flag} object wrapper
        // from ~33M inner-loop iterations, improving cache locality significantly.
        loadAllCdic(huffIdx) {
          const recs = this.recs;
          let count = 0;
          for (let i = huffIdx + 1; i < recs.length; i++) {
            const rOff = recs[i];
            const magic = String.fromCharCode(
              this.raw[rOff],
              this.raw[rOff + 1],
              this.raw[rOff + 2],
              this.raw[rOff + 3],
            );
            if (magic !== "CDIC") break;
            this.loadCdic(rOff);
            count++;
          }
          // Pre-expand all non-terminal entries (flag=false means still compressed).
          // After this loop, every this.dict[i] is a plain Uint8Array.
          const dict = this.dict;
          for (let i = 0; i < dict.length; i++) {
            const e = dict[i];
            if (e && !(e instanceof Uint8Array)) {
              // Guard against circular references: set null before recursing so any
              // re-entrant access to dict[i] hits the null-break and returns empty.
              dict[i] = null;
              dict[i] = this.decompress(e.slice, false);
            }
          }
          addLog(
            this.t(
              "logCdicLoaded",
              "Loaded {count} CDIC records -> {symbols} symbols in dictionary.",
              {
                count,
                symbols: this.dict.length,
              },
            ),
          );
        }

        // ── HUFF/CDIC decompression ────────────────────────────────────────────────
        // Hot-path optimisation: the original used BigInt for 64-bit bitstream
        // arithmetic. BigInt is ~10x slower than 32-bit integer ops in V8.
        // We represent the 64-bit sliding window as two 32-bit ints (hi, lo) and
        // compute the 32-bit code extraction with plain bitwise ops instead.
        //
        // We also eliminate the "padded" Uint8Array copy by using bounds-checked
        // reads of the raw data directly: the slow branch only fires for the last
        // ~4 reads per record, saving 53K allocations per conversion.
        //
        // dict1 is now stored as three flat Uint8/Uint32Arrays instead of an object
        // array, eliminating property-lookup overhead and pointer chasing in the
        // 33M-iteration inner loop.
        //
        // Top-level calls (isTopLevel = true, the default) write directly into a
        // pre-allocated this._decompOutBuf, returning a zero-copy subarray view.
        // This avoids 53K × (new Array chunks + new Uint8Array result + copy loop),
        // reducing ~212 MB of temporary allocations and major GC pressure.
        // Recursive calls (CDIC expansion) use the legacy chunks path and are rare.
        decompress(data, isTopLevel = true) {
          if (data.length === 0 || this.dict.length === 0) return new Uint8Array(0);

          const dlen = data.length;

          // Read 4 bytes big-endian at byte offset p.
          // Fast path (p+3 < dlen): direct byte access.
          // Slow path (near end of data): byte-by-byte with zero padding.
          const read32 = (p) => {
            if (p + 3 < dlen) {
              return (
                ((data[p] << 24) |
                  (data[p + 1] << 16) |
                  (data[p + 2] << 8) |
                  data[p + 3]) >>>
                0
              );
            }
            return (
              (((p < dlen ? data[p] : 0) << 24) |
                ((p + 1 < dlen ? data[p + 1] : 0) << 16) |
                ((p + 2 < dlen ? data[p + 2] : 0) << 8) |
                (p + 3 < dlen ? data[p + 3] : 0)) >>>
              0
            );
          };

          // Cache TypedArray references in locals to avoid repeated property lookups.
          const dict1Codelen = this.dict1Codelen;
          const dict1Term = this.dict1Term;
          const dict1Maxcode = this.dict1Maxcode;
          const mincodeArr = this.mincodeArr;
          const maxcodeArr = this.maxcodeArr;
          const dict = this.dict;

          let bitsleft = dlen * 8;
          let pos = 0;

          // Initialise 64-bit window as two big-endian uint32 halves.
          let hi = read32(0);
          let lo = read32(4);
          // n = bits remaining in the current "hi" half (1..32).
          let n = 32;

          if (isTopLevel) {
            // ── Fast path: write directly into the pre-allocated output buffer ──────
            // Avoids 53K × (chunks array + Uint8Array allocation + copy loop).
            // The caller immediately decodes the returned subarray to a string, so the
            // buffer is safe to reuse for the next record.
            let outBuf = this._decompOutBuf;
            let outLen = 0;

            while (true) {
              if (n <= 0) {
                pos += 4;
                hi = lo;
                lo = read32(pos + 4);
                n += 32;
              }
              const code = n === 32 ? hi : ((hi << (32 - n)) | (lo >>> n)) >>> 0;
              const idx = code >>> 24;
              let codelen = dict1Codelen[idx];
              let maxcode = dict1Maxcode[idx];
              if (!dict1Term[idx]) {
                while (code < mincodeArr[codelen]) codelen++;
                maxcode = maxcodeArr[codelen];
              }
              n -= codelen;
              bitsleft -= codelen;
              if (bitsleft < 0) break;
              const r = ((maxcode - code) >>> (32 - codelen)) >>> 0;
              if (r >= dict.length) break;
              const slice = dict[r];
              if (!slice) break;
              const needed = outLen + slice.length;
              if (needed > outBuf.length) {
                // Grow the reusable buffer (rare: only if a record expands beyond 128 KB).
                const bigger = new Uint8Array(Math.max(outBuf.length * 2, needed));
                bigger.set(outBuf.subarray(0, outLen));
                outBuf = this._decompOutBuf = bigger;
              }
              outBuf.set(slice, outLen);
              outLen += slice.length;
            }
            return outBuf.subarray(0, outLen); // zero-copy view, valid until next call
          }

          // ── Legacy/recursive path: used only during CDIC expansion ─────────────
          const chunks = [];
          let outLen = 0;

          while (true) {
            if (n <= 0) {
              pos += 4;
              hi = lo;
              lo = read32(pos + 4);
              n += 32;
            }
            const code = n === 32 ? hi : ((hi << (32 - n)) | (lo >>> n)) >>> 0;
            const idx = code >>> 24;
            let codelen = dict1Codelen[idx];
            let maxcode = dict1Maxcode[idx];
            if (!dict1Term[idx]) {
              while (code < mincodeArr[codelen]) codelen++;
              maxcode = maxcodeArr[codelen];
            }
            n -= codelen;
            bitsleft -= codelen;
            if (bitsleft < 0) break;
            const r = ((maxcode - code) >>> (32 - codelen)) >>> 0;
            if (r >= dict.length) break;
            let entry = dict[r];
            if (!entry) break;
            // During recursive CDIC expansion (called from loadAllCdic pre-expansion),
            // some entries may still be unexpanded objects. Expand them lazily here.
            if (!(entry instanceof Uint8Array)) {
              dict[r] = null;
              const expanded = this.decompress(entry.slice, false);
              entry = expanded;
              dict[r] = entry;
            }
            chunks.push(entry);
            outLen += entry.length;
          }

          const result = new Uint8Array(outLen);
          let off = 0;
          for (const c of chunks) {
            result.set(c, off);
            off += c.length;
          }
          return result;
        }

        // ── Parse MOBI ORTH+INFL binary indexes → inflection form map ──────────────
        // Delegates to the shared parseMobiIndexes() function (mobi-index-core.js).
        // ORDT decoding is handled inside parseMobiIndexes itself, so we do NOT pass
        // finalMap keys here – those are in HTML extraction order, not ORTH ordinal
        // order, and would cause wrong headword↔group mappings.
        //
        // synMap is passed as outputMap so inflected forms are written directly,
        // avoiding a large intermediate Map of 2M+ entries.
        parseMobiIndexes() {
          const synMap = this.synMap || null;
          return parseMobiIndexes(this.raw, this.recs, addLog, null, synMap);
        }
      }

      // Main converter class for KF8/HUFF dictionaries.
      class KF8Converter extends HuffCdicBase {
        constructor(buffer, options = {}) {
          super(buffer);
          this.options = { style: "nice", generateSyn: true, ...options };
          this.finalMap = new Map(); // word -> styled definition HTML
          this.synMap = new Map(); // alternate_form -> canonical_word
          this.entrySeen = new Map(); // word -> Set(fingerprint) for overlap dedupe
          this.synStats = {
            idxBlocks: 0,
            idxIformsSeen: 0,
            idxIformsAdded: 0,
            phraseTailAdded: 0,
          };
          this.detectedEntryFormat = null;
        }

        // FNV-1a 32-bit hash used for deduplication fingerprints.
        // Samples the full string up to 300 chars then includes the total length,
        // giving a practical collision probability < 0.1% for typical dictionaries.
        _defHash(s) {
          if (!s) return 0;
          const len = s.length;
          const cap = Math.min(len, 300);
          let h = 0x811c9dc5;
          for (let i = 0; i < cap; i++) {
            h ^= s.charCodeAt(i);
            h = Math.imul(h, 0x01000193) >>> 0;
          }
          // Mix length so strings sharing the same prefix still differ.
          h ^= len;
          h = Math.imul(h, 0x01000193) >>> 0;
          return h || 1; // ensure non-zero (0 reserved as "empty/invalid")
        }

        _sanitizeEntryHtml(html) {
          if (!html) return html;
          // Fast-path: SJP2 and most header-block dicts use literal 'width="0"'.
          // String.replaceAll with a literal is ~10x faster than a regex for common cases.
          if (html.indexOf("width") === -1) return html;
          // Try the literal replacement first (covers most cases).
          html = html.replaceAll('width="0"', "").replaceAll("width='0'", "");
          // Fallback regex for other width= values (rare; e.g. width="-20", width="100%").
          if (html.indexOf("width") !== -1)
            html = html.replace(/\swidth\s*=\s*["'][^"']*["']/gi, "");
          return html;
        }

        _ingestEntry(word, def, synHtml = "") {
          if (!word || !def) return;
          const key = word.trim();
          if (!key) return;

          def = this._sanitizeEntryHtml(def);

          // Use a fast numeric hash instead of storing the full string in entrySeen.
          // This cuts ~400 MB of heap on large dictionaries (entrySeen previously
          // held a whitespace-normalised copy of every definition string).
          const fp = this._defHash(def);
          if (!fp) return;

          let seen = this.entrySeen.get(key);
          if (!seen) {
            seen = new Set();
            this.entrySeen.set(key, seen);
          }
          if (seen.has(fp)) return;
          seen.add(fp);

          if (!this.finalMap.has(key)) {
            this.finalMap.set(key, def);
          } else {
            const merged = this.finalMap.get(key) + "<hr/>" + def;
            this.finalMap.set(key, merged);
          }

          this._collectSyns(key, synHtml || def);
        }

        _detectEntryFormat(html) {
          if (this.detectedEntryFormat) return this.detectedEntryFormat;

          if (/<idx:entry\b/i.test(html)) return "main";
          if (/<p\b[^>]*width\s*=\s*["']?-20/i.test(html)) return "main";

          const headerHeadCount = (
            html.match(/<h[1-3]\b[^>]*>\s*<b[^>]*>[\s\S]*?<\/b>\s*<\/h[1-3]>/gi) || []
          ).length;
          if (
            headerHeadCount >= 3 &&
            /<blockquote\b/i.test(html) &&
            /<hr\b/i.test(html)
          )
            return "header-block";

          if (/<h2\b/i.test(html)) return "main";
          return null;
        }

        // Extract entries from a HTML chunk (format-routed, legacy-safe)
        extractEntriesFrom(html, isFinal = false) {
          const detected = this._detectEntryFormat(html);
          if (detected && !this.detectedEntryFormat) {
            this.detectedEntryFormat = detected;
            addLog(
              this.t("logDetectedEntryFormat", "Detected entry format: {format}", {
                format: detected,
              }),
            );
          }

          if (this.detectedEntryFormat === "header-block") {
            this._extractEntriesHeaderBlocks(html, isFinal);
            return;
          }
          this._extractEntriesMain(html, isFinal);
        }

        // Main extractor (original logic for primary dictionary formats)
        _extractEntriesMain(html, isFinal = false) {
          const styleFn = STYLES[this.options.style] || STYLES.nice;

          // Method 1: KF8 idx:entry
          const entryRe = /<idx:entry\b[^>]*>([\s\S]*?)<\/idx:entry>/gi;
          let m;
          while ((m = entryRe.exec(html)) !== null) {
            const block = m[0];
            const orthM = block.match(/<idx:orth\b[^>]*>/i);
            if (!orthM) continue;
            const valueM = orthM[0].match(/\bvalue="([^"]+)"/i);
            if (!valueM) continue;
            const word = valueM[1].trim();
            if (!word || word.length >= 120) continue;
            let def = block
              .replace(/<idx:entry[^>]*>/gi, "")
              .replace(/<\/idx:entry>/gi, "")
              .replace(/<idx:orth[^>]*>[\s\S]*?<\/idx:orth>/gi, "")
              .replace(/<idx:infl[\s\S]*?<\/idx:infl>/gi, "")
              .trim();
            def = styleFn(word, `<span><b>${word}</b></span> ${def}`);
            // Keep raw idx block for synonym extraction (idx:iform inflections).
            this._ingestEntry(word, def, block);
          }

          // Method 2: h2-based (JEM / older Mobipocket dictionary style)
          const parts = html.split(/<h2\b/i);
          for (let k = 1; k < parts.length; k++) {
            const seg = parts[k];
            const tagEnd = seg.indexOf(">");
            if (tagEnd === -1) continue;
            const h2Close = seg.indexOf("</h2>", tagEnd);
            if (h2Close === -1) continue;

            const h2Content = seg.substring(tagEnd + 1, h2Close);
            const rawText = h2Content.replace(/<[^>]+>/g, "");
            const word = rawText.split("[")[0].trim();
            if (!word || word.length >= 100) continue;

            const after = seg.substring(h2Close + 5);
            const boundary = after.search(/<h2\b|<hr\b/i);
            if (!isFinal && boundary === -1) continue;

            const defContent = boundary >= 0 ? after.substring(0, boundary) : after;
            const rawHtml = `<h2>${h2Content}</h2>${defContent}`;
            const def = styleFn(word, rawHtml);
            this._ingestEntry(word, def, defContent);
          }

          // Method 3: <p width="-20"><span><b>headword</b></span>...</p>
          const hrParts = html.split(/<hr\s*\/?>/i);
          for (let k = 0; k < hrParts.length; k++) {
            const seg = hrParts[k];
            if (!/<p\b[^>]*width\s*=\s*["']?-20/i.test(seg)) continue;

            const pClose = seg.indexOf("</p>");
            if (!isFinal && pClose === -1) continue;

            const pOpen = seg.search(/<p\b[^>]*width\s*=\s*["']?-20/i);
            const pEnd = pClose >= 0 ? pClose + 4 : seg.length;
            if (pOpen < 0) continue;
            let pContent = seg.substring(pOpen, pEnd);

            // Defensive guard: reject overlap/boundary fragments unless headword starts the paragraph.
            const headAtStart = pContent.match(
              /^\s*<p\b[^>]*>\s*<span\s*>\s*<b>([\s\S]*?)<\/b>\s*<\/span>/i,
            );
            if (!headAtStart) continue;

            const headInner = headAtStart[1].trim();
            let word = "";
            if (headInner.includes("<")) {
              // Boundary-fragment paragraphs sometimes leak POS markup into the headword field.
              const plain = headInner
                .replace(/<[^>]+>/g, " ")
                .replace(/\s+/g, " ")
                .trim();
              const candidate = plain.split("/")[0].trim();
              if (!candidate || candidate.length >= 120) continue;
              if (
                /\/\s*(?:adj|adv|n|v|prep|conj|pron|interj|biol|fin|am)\.?\b/i.test(
                  plain,
                )
              )
                continue;
              word = candidate;
              pContent = pContent.replace(
                /(^\s*<p\b[^>]*>\s*<span\s*>\s*<b>)[\s\S]*?(<\/b>\s*<\/span>)/i,
                `$1${word}$2`,
              );
            } else {
              word = headInner.replace(/\s+/g, " ").trim();
              if (
                /\/\s*(?:adj|adv|n|v|prep|conj|pron|interj|biol|fin|am)\.?\b/i.test(
                  word,
                )
              )
                continue;
            }

            if (!word || word.length >= 120) continue;

            const def = styleFn(word, pContent);
            this._ingestEntry(word, def, pContent);
          }
        }

        _extractEntriesHeaderBlocks(html, isFinal = false) {
          const styleFn = STYLES[this.options.style] || STYLES.nice;
          const headRe = /<h([1-6])\b[^>]*>\s*<b[^>]*>([\s\S]*?)<\/b>\s*<\/h\1>/gi;
          const starts = [];
          let m;
          while ((m = headRe.exec(html)) !== null) {
            starts.push({ index: m.index, headInner: m[2] || "" });
          }

          for (let i = 0; i < starts.length; i++) {
            const s = starts[i];
            const headInner = (s.headInner || "")
              .replace(/<[^>]+>/g, " ")
              .replace(/\s+/g, " ")
              .trim();
            if (!headInner || headInner.length > 120) continue;

            const blockStart = s.index;
            const blockEnd =
              i + 1 < starts.length ? starts[i + 1].index : html.length;

            if (!isFinal && i === starts.length - 1) break;

            let block = html.slice(blockStart, blockEnd);

            // Trim trailing <hr> separator (and optional trailing <div>) using lastIndexOf
            // instead of scanning the whole block with a regex from position 0.
            // This avoids O(|block|) regex scan on every entry and eliminates backtracking.
            const hrPos = block.lastIndexOf("<hr");
            if (hrPos !== -1) {
              const suffix = block.slice(hrPos);
              if (/^<hr\b[^>]*>\s*(?:<div\b[^>]*>\s*)?$/i.test(suffix)) {
                // Trim any leading whitespace before the <hr> too
                let cut = hrPos;
                while (
                  cut > 0 &&
                  (block[cut - 1] === " " ||
                    block[cut - 1] === "\n" ||
                    block[cut - 1] === "\r" ||
                    block[cut - 1] === "\t")
                )
                  cut--;
                block = block.slice(0, cut);
              }
            }
            block = block.trim();
            if (!block) continue;

            const def = styleFn(headInner, block);
            this._ingestEntry(headInner, def, block);
          }
        }

        // Synonym collection helper
        _collectSyns(canonicalWord, html) {
          if (!this.options.generateSyn) return;

          const normalizeCandidate = (raw) => {
            if (!raw) return "";
            return raw
              .replace(/<[^>]+>/g, " ")
              .replace(/&nbsp;/gi, " ")
              .replace(/&amp;/gi, "&")
              .replace(/&quot;/gi, '"')
              .replace(/&#39;/gi, "'")
              .normalize("NFKC")
              .replace(/^[\s,;:()\[\]{}"'`]+|[\s,;:()\[\]{}"'`]+$/g, "")
              .replace(/\s+/g, " ")
              .trim();
          };

          const maybeAddSyn = (candidate) => {
            const alt = normalizeCandidate(candidate);
            if (!alt) return false;
            if (alt.length < 2 || alt.length > 80) return false;
            if (/^\d+$/.test(alt)) return false;
            if (alt.toLowerCase() === canonicalWord.toLowerCase()) return false;
            if (!this.synMap.has(alt)) {
              this.synMap.set(alt, canonicalWord);
              return true;
            }
            return false;
          };

          const looksLikeInflectionOf = (candidate, base) => {
            const c = (candidate || "").toLowerCase();
            const b = (base || "").toLowerCase();
            if (!c || !b || c === b) return false;
            if (c === b + "s" || c === b + "ed" || c === b + "ing") return true;
            if (/(s|x|z|ch|sh|o)$/.test(b) && c === b + "es") return true;
            if (
              b.endsWith("y") &&
              b.length > 2 &&
              !/[aeiou]y$/.test(b) &&
              c === b.slice(0, -1) + "ies"
            )
              return true;
            return false;
          };

          // 1. Subscript-stripped variant: word1 / word2 -> word
          const stripped = canonicalWord
            .replace(/[\u2080-\u2089\u00B9\u00B2\u00B3\u2070]$/, "")
            .trim();
          if (
            stripped !== canonicalWord &&
            stripped.length > 1 &&
            !this.synMap.has(stripped)
          )
            this.synMap.set(stripped, canonicalWord);

          // 1b & 2: idx:iform and <span><b> patterns are only present in the KF8
          // "main" (idx:entry-based) format.  Skip entirely for header-block dicts
          // (e.g. SJP2) to avoid 600K+ pointless regex scans.
          const isHeaderBlock = this.detectedEntryFormat === "header-block";

          if (!isHeaderBlock) {
            // 1b. KF8 inflections from idx metadata, e.g. <idx:iform value="workers">
            if (/<idx:entry\b/i.test(html)) this.synStats.idxBlocks++;
            const extractIformValue = (attrs, inner) => {
              const vm = attrs.match(
                /\bvalue\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s"'=<>`]+))/i,
              );
              return vm ? vm[1] || vm[2] || vm[3] || "" : inner || "";
            };
            const iformPairRe = /<idx:iform\b([^>]*)>([\s\S]*?)<\/idx:iform>/gi;
            let ifm;
            while ((ifm = iformPairRe.exec(html)) !== null) {
              this.synStats.idxIformsSeen++;
              if (maybeAddSyn(extractIformValue(ifm[1] || "", ifm[2] || "")))
                this.synStats.idxIformsAdded++;
            }
            const iformSelfRe = /<idx:iform\b([^>]*)\/>/gi;
            while ((ifm = iformSelfRe.exec(html)) !== null) {
              this.synStats.idxIformsSeen++;
              if (maybeAddSyn(extractIformValue(ifm[1] || "", "")))
                this.synStats.idxIformsAdded++;
            }

            // 2. Sub-phrase <span><b>phrase</b></span> entries (multi-word or different from headword)
            for (const m of html.matchAll(
              /<span\s*>\s*<b>([\s\S]*?)<\/b>\s*<\/span>/gi,
            )) {
              const phrase = m[1].replace(/<[^>]+>/g, "").trim();
              if (!phrase || phrase.toLowerCase() === canonicalWord.toLowerCase())
                continue;
              if (phrase.length < 2 || phrase.length > 80) continue;
              if (!this.synMap.has(phrase)) this.synMap.set(phrase, canonicalWord);

              // Fallback for dictionaries that strip idx:iform metadata.
              const toks = phrase.split(/\s+/).filter(Boolean);
              if (toks.length >= 2) {
                const tail = toks[toks.length - 1].replace(
                  /^[^A-Za-z0-9'-]+|[^A-Za-z0-9'-]+$/g,
                  "",
                );
                if (looksLikeInflectionOf(tail, canonicalWord) && maybeAddSyn(tail))
                  this.synStats.phraseTailAdded++;
              }
            }
          }

          // 3. Plural markers in parentheses, e.g. (<i>l.m.</i> <b>visionaries</b>)
          for (const m of html.matchAll(
            /\(\s*<i[^>]*>\s*(?:l\.?\s*m\.?|liczba\s+mnoga|plural|pl\.?)\s*<\/i>\s*<b[^>]*>([\s\S]*?)<\/b>\s*\)/gi,
          )) {
            maybeAddSyn(m[1]);
          }

          // 4. "tez X" / "also X" alternate forms
          for (const m of html.matchAll(
            /\((?:też|also)\s+<b[^>]*>([\s\S]*?)<\/b>/gi,
          )) {
            maybeAddSyn(m[1]);
          }

          // 5. Plain <b>X</b> where X looks like a compound (contains space)
          for (const m of html.matchAll(/<b[^>]*>([\s\S]*?)<\/b>/gi)) {
            const phrase = normalizeCandidate(m[1]);
            if (!phrase.includes(" ")) continue; // only multi-word
            if (phrase.toLowerCase() === canonicalWord.toLowerCase()) continue;
            if (phrase.length > 80 || /^\d/.test(phrase)) continue;
            if (!this.synMap.has(phrase)) this.synMap.set(phrase, canonicalWord);
          }
        }

        // Streaming decompress + extract
        streamDecompress(textRecordMax, extraFlags) {
          return new Promise((resolve) => {
            const utf8 = new TextDecoder("utf-8", { fatal: false });
            const OVERLAP = 16384;
            let overlap = "";
            let i = 1;
            const BATCH = 80;
            let firstDecodedLogged = false;
            const endExclusive = textRecordMax + 1;

            const processChunk = () => {
              const lim = Math.min(i + BATCH, endExclusive);
              for (; i < lim; i++) {
                const start = this.recs[i];
                const end =
                  i + 1 < this.recs.length
                    ? this.recs[i + 1]
                    : this.buffer.byteLength;
                let data = this.raw.subarray(start, end);
                data = this.stripTrailing(data, extraFlags);
                const dec = this.decompress(data);
                const text = utf8.decode(dec, { stream: true });

                if (!firstDecodedLogged && text.length > 0) {
                  firstDecodedLogged = true;
                  const preview = text.substring(0, 300).replace(/[\r\n]+/g, " ");
                  addLog(
                    this.t(
                      "logFirstRecordDecoded",
                      "First record decoded ({bytes} bytes). Preview:\n  {preview}",
                      { bytes: dec.length, preview },
                    ),
                  );
                }

                const chunk = overlap + text;
                this.extractEntriesFrom(chunk, false);
                overlap = chunk.length > OVERLAP ? chunk.slice(-OVERLAP) : chunk;
              }

              if (i < endExclusive) {
                if (i % 500 < BATCH)
                  addLog(
                    this.t(
                      "logDecompressing",
                      "Decompressing: {current}/{max}... entries so far: {entries}",
                      {
                        current: i,
                        max: textRecordMax,
                        entries: this.finalMap.size,
                      },
                    ),
                  );
                setTimeout(processChunk, 0);
              } else {
                this.extractEntriesFrom(overlap, true);
                addLog(
                  this.t(
                    "logExtractionComplete",
                    "Extraction complete: {entries} unique entries.",
                    { entries: this.finalMap.size },
                  ),
                );
                resolve();
              }
            };
            processChunk();
          });
        }

        // Main pipeline
        async run() {
          this.buildRecords();
          addLog(
            this.t("logPdbRecords", "PDB records: {count}", {
              count: this.recs.length,
            }),
          );

          const extraFlags = this.findExtraDataFlags();

          // Find HUFF record
          let huffIdx = -1;
          for (let i = 0; i < this.recs.length; i++) {
            const o = this.recs[i];
            if (
              this.raw[o] === 72 &&
              this.raw[o + 1] === 85 &&
              this.raw[o + 2] === 70 &&
              this.raw[o + 3] === 70
            ) {
              huffIdx = i;
              break;
            }
          }
          if (huffIdx === -1) {
            addLog(this.t("logErrorNoHuff", "ERROR: No HUFF record found."));
            return this.finalMap;
          }
          const textRecordMax = this.getTextRecordMax(huffIdx);
          addLog(
            this.t(
              "logHuffRecord",
              "HUFF record: {huffIdx}  (text records: 1-{textRecordMax})",
              {
                huffIdx,
                textRecordMax,
              },
            ),
          );

          this.loadHuff(this.recs[huffIdx]);
          this.loadAllCdic(huffIdx);

          if (this.dict.length === 0) {
            addLog(
              this.t(
                "logErrorEmptySymbolDict",
                "ERROR: Symbol dictionary is empty. Cannot decompress.",
              ),
            );
            return this.finalMap;
          }

          await this.streamDecompress(textRecordMax, extraFlags);

          // ── MOBI binary INDX: extract inflected forms from ORTH+INFL indexes ────
          if (this.options.generateSyn) {
            try {
              addLog(
                this.t(
                  "logParsingMobiIndex",
                  "Parsing MOBI INDX inflection index...",
                ),
              );
              // parseMobiIndexes writes directly into synMap (via outputMap parameter),
              // so no merge loop is needed; inflAdded is reported via .size on the proxy.
              const result = this.parseMobiIndexes();
              if (result.size > 0) {
                addLog(
                  this.t(
                    "logMobiIndexResult",
                    "MOBI INDX: {added} new syn entries added.",
                    { added: result.size },
                  ),
                );
              } else {
                addLog(
                  this.t(
                    "logMobiIndexNone",
                    "MOBI INDX: no ORTH/INFL index found (normal for non-SJP2 files).",
                  ),
                );
              }
            } catch (e) {
              addLog("MOBI INDX parse skipped (non-fatal): " + e.message);
            }
          }

          if (this.options.generateSyn) {
            addLog(
              this.t(
                "logSynStats",
                "idx:entry blocks seen: {idxBlocks}, idx:iform seen: {idxIformsSeen}, idx:iform added: {idxIformsAdded}, phrase-tail inflections: {phraseTailAdded}",
                {
                  idxBlocks: this.synStats.idxBlocks,
                  idxIformsSeen: this.synStats.idxIformsSeen,
                  idxIformsAdded: this.synStats.idxIformsAdded,
                  phraseTailAdded: this.synStats.phraseTailAdded,
                },
              ),
            );
          }
          addLog(
            this.t("logSynonymsCollected", "Synonyms collected: {count}", {
              count: this.synMap.size,
            }),
          );
          return { finalMap: this.finalMap, synMap: this.synMap };
        }
      }

      // ─────────────────────────────────────────────────────────────────────────────
      // PalmDocBase – shared PalmDoc decompression logic
      // Used by mobiConverter.html and Tools/MobiReader.html
      // DO NOT edit the compiled HTML files directly – edit this file and the
      // templates, then run:  node build.js
      // ─────────────────────────────────────────────────────────────────────────────
      class PalmDocBase {
        constructor(buffer) {
          this.buffer = buffer;
