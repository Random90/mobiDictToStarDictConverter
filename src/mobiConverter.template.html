<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="pageTitle">MOBI → StarDict Converter</title>
    <style>
      :root {
        --bg:       #1c2812;   /* outer page – darkest */
        --surface:  #2e4220;   /* main panel – clearly olive */
        --surface2: #384e26;   /* inner sections */
        --titlebar: #243418;   /* title bar strip */
        --accent:   #8acc4a;   /* warm olive-green highlight */
        --accent2:  #9ab858;   /* lighter accent – muted olive, not neon */
        --text:     #dfe6da;   /* neutral off-white text (main-page matched) */
        --muted:    #c1cabc;   /* softer neutral muted text */
        --border:   #4a6830;
      }

      /* ── Page ──────────────────────────────────────────────────────────────── */
      body {
        font-family: "Segoe UI", Tahoma, sans-serif;
        max-width: 980px;
        margin: 30px auto;
        color: var(--text);
        background-color: var(--bg);
        background-image:
          repeating-linear-gradient(
            0deg,
            rgba(0,0,0,.18) 0, rgba(0,0,0,.18) 1px,
            transparent 1px, transparent 4px
          ),
          radial-gradient(ellipse 100% 45% at 50% -5%, rgba(138,204,74,.12) 0%, transparent 65%),
          radial-gradient(ellipse 60% 30% at 0% 110%, rgba(138,204,74,.06) 0%, transparent 55%);
      }

      /* ── Panels / Cards ────────────────────────────────────────────────────── */
      .card {
        margin-bottom: 22px;
        border-radius: 10px;
        border: 1px solid #3a5e42;
        border-top-color: #52825a;
        background: linear-gradient(180deg, #3a5228 0%, var(--surface) 40%, #263a1c 100%);
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,.07),   /* top inner highlight */
          inset 0 -1px 0 rgba(0,0,0,.5),          /* bottom inner shadow  */
          0 6px 28px rgba(0,0,0,.65),
          0 1px 4px rgba(0,0,0,.8);
        overflow: hidden;                          /* clips the titlebar gradient */
      }

      /* Title bar stripe at top of every card */
      .card > h2:first-child,
      .card > h3:first-child {
        margin: 0 0 20px;
        padding: 10px 24px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: .12em;
        color: #dbe2d3;
        background: linear-gradient(180deg, #3e5630 0%, #2e4420 100%);
        border-bottom: 2px solid var(--accent);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 2px 6px rgba(0,0,0,.4);
      }

      /* Card inner padding (applied to the sibling of the title bar) */
      .card-body { padding: 20px 28px 28px; }
      /* For cards whose direct children aren't card-body wrapped */
      .card > p,
      .card > .upload-section,
      .card > #formatBadge,
      .card > .option-box,
      .card > #log,
      .card > .btn-main,
      .card > #downloadArea,
      .card > #previewArea { padding-left: 24px; padding-right: 24px; }

      /* ── Upload dropzone ───────────────────────────────────────────────────── */
      .upload-section {
        margin: 0 24px 10px;
        padding: 28px 20px;
        border-radius: 6px;
        border: 2px dashed #3d7a4e;
        cursor: pointer;
        text-align: center;
        background:
          repeating-linear-gradient(
            45deg,
            rgba(138,204,74,.04) 0, rgba(138,204,74,.04) 1px,
            transparent 1px, transparent 8px
          ),
          linear-gradient(180deg, #243318 0%, #2c3e1e 100%);
        box-shadow: inset 0 2px 5px rgba(0,0,0,.45);
        transition: border-color .2s, background .2s;
      }
      .upload-section:hover {
        border-color: var(--accent);
        background:
          repeating-linear-gradient(
            45deg,
            rgba(138,204,74,.08) 0, rgba(138,204,74,.08) 1px,
            transparent 1px, transparent 8px
          ),
          linear-gradient(180deg, #2c4220 0%, #38502a 100%);
      }

      /* ── Format badge ──────────────────────────────────────────────────────── */
      #formatBadge {
        display: none;
        font-size: 12px;
        font-weight: 700;
        padding: 5px 14px;
        border-radius: 4px;
        margin: 6px 24px 12px;
        text-transform: uppercase;
        letter-spacing: .06em;
      }
      #formatBadge.kf8     {
        background: #243118;
        border: 1px solid #596f3d;
        border-top-color: #2c3b1e;
        color: #dbe2d3;
        border-radius: 8px;
        box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.55);
      }
      #formatBadge.palmdoc { background:#0d1e2e; border:1px solid #4da6d9; color:#90caf9; }
      #formatBadge.drm     { background:#2a0d0d; border:1px solid #e57373; color:#ffcdd2; }
      #formatBadge.unknown { background:#281e00; border:1px solid #ffca28; color:#fff59d; }

      /* ── Console log ───────────────────────────────────────────────────────── */
      #log {
        margin: 16px 24px 18px;
        background: #1a2612;
        color: #d6ddce;
        padding: 12px 14px;
        font-family: "Cascadia Code", "Consolas", monospace;
        height: 320px;
        overflow-y: auto;
        border-radius: 4px;
        font-size: 11.5px;
        border: 1px solid #3a5228;
        border-top-color: #243318;
        box-shadow: inset 0 2px 8px rgba(0,0,0,.5);
        white-space: pre-wrap;
        background-image: repeating-linear-gradient(
          0deg,
          rgba(138,204,74,.04) 0, rgba(138,204,74,.04) 1px,
          transparent 1px, transparent 16px
        );
      }

      /* ── Main convert button ───────────────────────────────────────────────── */
      .btn-main {
        display: block;
        width: calc(100% - 48px);
        margin: 14px 24px 0;
        padding: 13px 30px;
        font-size: 16px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .1em;
        color: #1a2a0a;
        cursor: pointer;
        border-radius: 5px;
        border: 1px solid #3a5e14;
        border-top-color: #6a9a2e;
        border-bottom: 3px solid #2e4c0e;
        background: linear-gradient(180deg, #8aaa48 0%, #7e9a3c 30%, #6e8830 72%, #5e7822 100%);
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,.28),  /* top bevel highlight */
          inset 1px 0 0 rgba(255,255,255,.10),  /* left bevel */
          inset -1px 0 0 rgba(0,0,0,.15),       /* right bevel */
          inset 0 -1px 0 rgba(0,0,0,.35),       /* bottom inner shadow */
          0 4px 0 #2a4008,                       /* hard bottom lift */
          0 6px 18px rgba(0,0,0,.65),            /* drop shadow */
          0 1px 4px rgba(0,0,0,.9);              /* close shadow */
        transition: filter .15s, transform .1s;
      }
      .btn-main:hover   { filter: brightness(1.1); }
      .btn-main:active  {
        border-bottom-width: 1px;
        transform: translateY(3px);
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,.18),
          inset 0 2px 6px rgba(0,0,0,.4),
          0 1px 0 #2a4008;
      }
      .btn-main:disabled {
        background: linear-gradient(180deg, #243a2a 0%, #1b2e20 100%);
        border-bottom-color: #0f1e14;
        border-top-color: #2a3c1e;
        color: var(--muted);
        cursor: not-allowed;
        box-shadow: inset 0 1px 3px rgba(0,0,0,.4);
        filter: none;
        transform: none;
      }

      /* ── Download buttons ──────────────────────────────────────────────────── */
      .btn-dl {
        display: inline-block;
        margin: 4px;
        padding: 8px 14px;
        background: linear-gradient(180deg, #7f9b47 0%, #70863a 52%, #5d722b 100%);
        color: #1b2a0b;
        text-decoration: none;
        border-radius: 4px;
        font-weight: 700;
        font-size: 13px;
        border: 1px solid #3a571a;
        border-top-color: #6f9338;
        border-bottom: 2px solid #2d4210;
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,.22),
          inset 0 -1px 0 rgba(0,0,0,.3),
          0 2px 6px rgba(0,0,0,.45);
        transition: filter .15s;
      }
      .btn-dl:hover { filter: brightness(1.12); }

      /* ── Options box ───────────────────────────────────────────────────────── */
      .option-box {
        margin: 0 24px 14px;
        padding: 14px 16px;
        border-radius: 6px;
        border: 1px solid #596f3d;
        border-top-color: #728c50;
        background: linear-gradient(180deg, #425935 0%, #3a4f2f 48%, #324528 100%);
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,.08),
          0 8px 22px rgba(0,0,0,.42);
      }
      .option-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }
      .option-row label { font-weight: 600; min-width: 120px; font-size: 13px; }
      .option-row select,
      .validator-search {
        padding: 6px 10px;
        border-radius: 8px;
        border: 1px solid #596f3d;
        border-top-color: #2c3b1e;
        background: #243118;
        color: var(--text);
        font-size: 0.9rem;
        box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.55);
      }
      .option-row select {
        cursor: pointer;
        width: 100%;
      }
      .check-item { display: flex; align-items: center; gap: 10px; font-size: 13px; padding: 5px 0; }
      input[type="checkbox"] { accent-color: var(--accent); }
      .style-preview {
        border: 1px solid #1e3020;
        border-top-color: #2a4232;
        border-radius: 4px;
        padding: 9px 12px;
        margin-top: 6px;
        font-size: 12px;
        background: #fff;
        color: #1c1e21;
        min-height: 32px;
        box-shadow: inset 0 2px 4px rgba(0,0,0,.15);
      }
      .style-note { font-size: 11px; color: var(--muted); margin-top: 6px; }

      /* ── Badge (syn count) ─────────────────────────────────────────────────── */
      .badge-syn {
        background: linear-gradient(180deg, #738b3f 0%, #5b712a 100%);
        color: #1f2b10;
        border-radius: 3px;
        border: 1px solid #4d6325;
        border-bottom-color: #344616;
        padding: 2px 8px;
        font-size: 11px;
        font-weight: bold;
        white-space: nowrap;
      }

      /* ── Preview grid ──────────────────────────────────────────────────────── */
      .preview-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-top: 10px;
      }
      .preview-item {
        background: #fff;
        color: #1c1e21;
        border: 1px solid #2a4232;
        border-top-color: #3a5e42;
        padding: 10px;
        border-radius: 4px;
        font-size: 11px;
        max-height: 220px;
        overflow-y: auto;
        box-shadow: inset 0 1px 3px rgba(0,0,0,.12);
      }

      /* ── Inline validator ──────────────────────────────────────────────────── */
      .validator-search {
        width: 100%;
        margin-top: 10px;
        box-sizing: border-box;
        display: none;
        background: #192310;
        appearance: none;
        -webkit-appearance: none;
      }
      .validator-status { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
      .validator-card {
        display: none;
        margin-top: 10px;
        padding: 12px;
        background: linear-gradient(180deg, #425935 0%, #3a4f2f 48%, #324528 100%);
        border: 1px solid #596f3d;
        border-top-color: #728c50;
        border-radius: 5px;
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,.08),
          0 8px 22px rgba(0,0,0,.42);
      }
      .validator-split { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 8px; }
      .validator-pane {
        border: 1px solid #1e3020;
        border-top-color: #2a4232;
        border-radius: 4px;
        padding: 10px;
        max-height: 560px;
        overflow: auto;
        background: #fff;
        color: #1c1e21;
        box-shadow: inset 0 2px 4px rgba(0,0,0,.1);
      }

      /* ── Lang toggle ───────────────────────────────────────────────────────── */
      #langToggle {
        position: fixed;
        top: 12px;
        right: 14px;
        z-index: 9999;
        background: linear-gradient(180deg, #1e3828 0%, #132018 100%);
        border: 1px solid #3a5e42;
        color: var(--text);
        border-radius: 999px;
        padding: 5px 14px;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 2px 6px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.07);
        text-transform: uppercase;
        letter-spacing: .05em;
      }
      #langToggle:hover { border-color: var(--accent); color: var(--accent); }

      a { color: #dbe2d3; }
      h3 { color: #dbe2d3; margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .07em; }
    </style>
  </head>
  <body>
    <button id="langToggle" onclick="toggleLang()" data-i18n-title="langToggleTitle">
      🇵🇱 PL
    </button>
    <div class="card">
      <h2 data-i18n="title"></h2>
      <p style="padding:0 24px;margin-bottom:12px;font-size:13px;color:var(--text)" data-i18n-html="desc"></p>

      <div class="upload-section" id="dropZone">
        <span id="fileNameDisplay" data-i18n="dropzone"></span>
        <input type="file" id="fileInput" accept=".mobi,.azw,.azw3" style="display: none" />
      </div>
      <div id="formatBadge"></div>

      <div class="option-box">
        <div class="option-row">
          <label data-i18n="styleLabel"></label>
          <select id="styleSelect">
            <option value="none"  data-i18n="styleNone"></option>
            <option value="nice" selected data-i18n="styleNice"></option>
            <option value="eink" data-i18n="styleEink"></option>
            <option value="rich" data-i18n="styleRich"></option>
          </select>
        </div>
        <div class="style-preview" id="stylePreview"></div>
        <div class="style-note" data-i18n-html="styleCompatibilityNote"></div>

        <div class="check-item" style="margin-top:10px">
          <input type="checkbox" id="compressCheck" checked />
          <label for="compressCheck" data-i18n="compressLabel"></label>
        </div>
        <div class="style-note" data-i18n-html="compressNote"></div>
      </div>

      <button id="startBtn" class="btn-main" disabled data-i18n="startBtn"></button>

      <div id="log" data-i18n="logIdle"></div>

      <div id="downloadArea" style="display:none;margin:20px 24px 0;padding:18px 20px;background:linear-gradient(180deg,#344828 0%,#2f4222 46%,#28381c 100%);border-radius:6px;border:1px solid #4f6731;border-top-color:#607b3f;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 14px rgba(0,0,0,.45);">
        <h3 data-i18n="doneTitle"></h3>
        <div id="links" style="display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-items:flex-start;"></div>
      </div>

      <div id="previewArea" style="display:none;margin:20px 0 18px">
        <h3 data-i18n="previewTitle"></h3>
        <div class="preview-grid" id="previewGrid"></div>
        <h4 data-i18n="validatorTitle" style="margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-size:11px"></h4>
        <input type="text" id="validatorSearchBox" class="validator-search"
               data-i18n-ph="validatorSearchPh" placeholder="" />
        <div id="validatorStatus" class="validator-status"></div>
        <div id="validatorResultCard" class="validator-card">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
            <b id="validatorResultWord"></b>
            <div style="display:flex;gap:6px;align-items:center">
              <span id="validatorByteBadge" class="badge-syn"></span>
              <button id="validatorCopyBtn" class="btn-dl"
                      style="padding:6px 10px;background:var(--surface);color:var(--text);border:1px solid var(--border)"
                      data-i18n="validatorCopyHtml"></button>
            </div>
          </div>
          <div id="validatorSynInfo"
               style="display:none;color:var(--muted);font-size:12px;margin-top:6px"></div>
          <div class="validator-split">
            <div id="validatorPaneRendered" class="validator-pane"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // ── i18n helpers ──────────────────────────────────────────────────────────
      function formatI18nText(template, vars) {
        if (!vars) return template;
        return String(template).replace(/\{(\w+)}/g, (_, k) =>
          vars[k] !== undefined ? String(vars[k]) : `{${k}}`);
      }

      function i18nText(key, fallback, vars) {
        const tables = window.__I18N_TABLES || {};
        const lang = window.LANG || 'en';
        const table = tables[lang] || tables.en || {};
        const en = tables.en || {};
        const base = table[key] !== undefined ? table[key] : en[key];
        const text = base !== undefined ? base : fallback || key;
        return formatI18nText(text, vars);
      }

      // ── Unified style engines ─────────────────────────────────────────────────
      // Both KF8 (2-arg) and PalmDoc (4-arg) calling conventions are supported.
      // When rawH2Html argument is present → PalmDoc mode; otherwise → KF8 mode.
      const STYLES = {
        _escapeRegExp(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); },

        _ensureHeadwordSpan(word, html) {
          if (/<span\s*>\s*<b>[\s\S]*?<\/b>\s*<\/span>/i.test(html)) return html;
          const w = (word || '').trim();
          if (!w) return html;
          const escaped = STYLES._escapeRegExp(w);
          const hMatch = html.match(/^\s*<h([1-6])\b[^>]*>([\s\S]*?)<\/h\1>\s*/i);
          if (hMatch) {
            const plain = hMatch[2].replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
            const reLeadWord = new RegExp(`^${escaped}(?:\\b|\\s)`, 'i');
            if (reLeadWord.test(plain)) {
              const tail = plain.replace(new RegExp(`^${escaped}\\s*`, 'i'), '').trim();
              const rest = html.slice(hMatch[0].length);
              return `<span><b>${w}</b></span>${tail ? ` ${tail}` : ''}${rest ? ` ${rest}` : ''}`.trim();
            }
          }
          const leadRe = new RegExp(`^\\s*${escaped}(?:\\b|\\s*)`, 'i');
          if (leadRe.test(html)) return html.replace(leadRe, `<span><b>${w}</b></span> `);
          return html;
        },

        none(word, pHtmlOrPhonetics, rawH2Html, contentHtml) {
          if (rawH2Html !== undefined) return rawH2Html + contentHtml;
          return pHtmlOrPhonetics;
        },

        clean(word, pHtmlOrPhonetics, rawH2Html, contentHtml) {
          if (rawH2Html !== undefined) {
            const strip = (h) => h.replace(/ style="[^"]*"/g, '');
            const ph = pHtmlOrPhonetics ? ` <em>${pHtmlOrPhonetics}</em>` : '';
            return `<b>${word}</b>${ph}<br>${strip(contentHtml)}`;
          }
          return pHtmlOrPhonetics
            .replace(/ width="[^"]*"/gi, '')
            .replace(/ style="[^"]*"/gi, '');
        },

        nice(word, pHtmlOrPhonetics, rawH2Html, contentHtml) {
          if (rawH2Html !== undefined) {
            const ph = pHtmlOrPhonetics
              ? ` <span style="color:#666;font-size:.88em;font-style:italic">${pHtmlOrPhonetics}</span>`
              : '';
            let content = contentHtml
              .replace(/(<i>(?:n|v|adj|adv|prep|conj|pron|interj|abbr|acr)\b.*?<\/i>)/g,
                '<span style="color:#c0392b;font-weight:bold">$1</span>')
              .replace(/(<b>(?:\d+)\.?<\/b>)/g,
                '<span style="color:#2980b9;font-weight:bold">$1</span>');
            return `<div style="margin-bottom:6px"><b style="font-size:1.15em;color:#003d82">${word}</b>${ph}</div>${content}`;
          }
          const pHtml = STYLES._ensureHeadwordSpan(word, pHtmlOrPhonetics);
          let body = pHtml
            .replace(/(<i>(?:n|v|adj|adv|prep|conj|pron|interj|abbr|acr)\.?<\/i>)/g,
              '<span style="color:#c0392b;font-weight:bold">$1</span>')
            .replace(/\b(<b>(\d+)\.<\/b>)/g,
              '<span style="color:#2980b9;font-weight:bold">$1</span>');
          body = body.replace(/(<span\s*>\s*<b>)([\s\S]*?)(<\/b>\s*<\/span>)/,
            '<span><b style="font-size:1.15em;color:#003d82">$2</b></span>');
          return body;
        },

        eink(word, pHtmlOrPhonetics, rawH2Html, contentHtml) {
          if (rawH2Html !== undefined) {
            const ph = pHtmlOrPhonetics
              ? ` <span style="font-size:.9em;font-style:italic">${pHtmlOrPhonetics}</span>` : '';
            let content = contentHtml
              .replace(/(<i>(?:n|v|adj|adv|prep|conj|pron|interj|abbr|acr)\.?<\/i>)/g, '<b>$1</b>')
              .replace(/\b(\d+)\./g, '<b>$1.</b>')
              .replace(/(<i>[a-z]{2,5}\.<\/i>)/g, '<small>$1</small>')
              .replace(/(<b>([^<]{3,60})<\/b>(?=\s*[/(<]))/g,
                '<b style="text-decoration:underline">$2</b>');
            return `<div style="margin-bottom:6px;padding:4px 0;border-left:2px solid #000;padding-left:8px"><b style="font-size:1.2em">${word}</b>${ph}</div>${content}`;
          }
          const pHtml = STYLES._ensureHeadwordSpan(word, pHtmlOrPhonetics);
          const ipaM = pHtml.match(/(?<!<)\/([^/<]{2,60})\//);
          const ipa = ipaM ? ` <span style="font-size:.9em;font-style:italic">/${ipaM[1]}/</span>` : '';
          let body = ipaM ? pHtml.replace(ipaM[0], '') : pHtml;
          body = body
            .replace(/<b>(\d+)\.<\/b>/g, '<b>$1.</b>')
            .replace(/(<i>(?:[a-z]{2,5})\.<\/i>)/g, '<small>$1</small>')
            .replace(/(<i>(?:n|v|adj|adv|prep|conj|pron|interj|abbr|acr)\.?<\/i>)/g, '<b>$1</b>');
          let seenHeadword = false;
          body = body.replace(/<span\s*>\s*<b[^>]*>([\s\S]*?)<\/b>\s*<\/span>/gi, (m, inner) => {
            if (!seenHeadword) {
              seenHeadword = true;
              return `<span style="display:block;border-left:2px solid #000;padding-left:7px;margin-bottom:4px"><b style="font-size:1.18em">${inner}</b>${ipa}</span>`;
            }
            const plain = inner.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
            if (plain.length >= 3 && plain.length <= 80 && plain.includes(' '))
              return `<span><b style="text-decoration:underline">${inner}</b></span>`;
            return m;
          });
