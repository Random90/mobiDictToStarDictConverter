<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="pageTitle">MOBI → StarDict Converter</title>
    <style>
      #langToggle {
        position: fixed;
        top: 12px;
        right: 14px;
        z-index: 9999;
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 999px;
        padding: 4px 12px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      }
      #langToggle:hover { border-color: #007bff; color: #007bff; }
      body {
        font-family: "Segoe UI", sans-serif;
        max-width: 1000px;
        margin: 30px auto;
        background: #f0f2f5;
        color: #1c1e21;
      }
      .card {
        background: white;
        padding: 35px;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      }
      h2 { color: #007bff; margin-top: 0; border-bottom: 2px solid #e1e4e8; padding-bottom: 10px; }
      .upload-section {
        border: 3px dashed #007bff;
        background: #f8fbff;
        padding: 30px;
        text-align: center;
        cursor: pointer;
        border-radius: 12px;
        margin-bottom: 8px;
      }
      #formatBadge {
        display: none;
        font-size: 13px;
        font-weight: 600;
        padding: 6px 14px;
        border-radius: 8px;
        margin-bottom: 14px;
      }
      #formatBadge.kf8    { background: #e6f4ea; border: 1px solid #81c784; color: #1b5e20; }
      #formatBadge.palmdoc { background: #e3f2fd; border: 1px solid #64b5f6; color: #0d47a1; }
      #formatBadge.drm    { background: #ffebee; border: 1px solid #e57373; color: #b71c1c; }
      #formatBadge.unknown { background: #fff8e1; border: 1px solid #ffca28; color: #6d4c00; }
      #log {
        background: #1c1e21;
        color: #a5d6a7;
        padding: 15px;
        font-family: monospace;
        height: 340px;
        overflow-y: auto;
        border-radius: 8px;
        margin-top: 20px;
        font-size: 12px;
        border: 1px solid #30363d;
        white-space: pre-wrap;
      }
      .btn-main {
        background: #007bff;
        color: white;
        border: none;
        padding: 15px 30px;
        font-size: 18px;
        border-radius: 8px;
        cursor: pointer;
        width: 100%;
        font-weight: bold;
        transition: 0.3s;
        margin-top: 10px;
      }
      .btn-main:disabled { background: #6c757d; cursor: not-allowed; }
      .btn-dl {
        display: inline-block;
        margin: 5px;
        padding: 10px 15px;
        background: #28a745;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        font-weight: bold;
      }
      .preview-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-top: 12px;
      }
      .preview-item {
        background: #fff;
        border: 1px solid #ddd;
        padding: 10px;
        border-radius: 8px;
        font-size: 11px;
        max-height: 220px;
        overflow-y: auto;
      }
      .validator-search {
        width: 100%;
        padding: 11px;
        font-size: 16px;
        margin-top: 12px;
        border-radius: 6px;
        border: 2px solid #007bff;
        box-sizing: border-box;
        display: none;
      }
      .validator-status { font-size: 12px; color: #666; margin-top: 7px; }
      .validator-card {
        display: none;
        margin-top: 10px;
        padding: 12px;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 8px;
      }
      .validator-split { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 8px; }
      .validator-pane {
        border: 1px solid #ddd;
        border-radius: 7px;
        padding: 10px;
        max-height: 560px;
        overflow: auto;
      }
      .option-box {
        background: #f8f9fa;
        border: 1px solid #dee2e6;
        padding: 14px 18px;
        border-radius: 10px;
        margin-bottom: 14px;
      }
      .option-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }
      .option-row label { font-weight: 600; min-width: 120px; font-size: 13px; }
      .option-row select {
        padding: 5px 10px;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 13px;
        cursor: pointer;
        width: 100%;
        text-overflow: ellipsis;
      }
      .check-item { display: flex; align-items: center; gap: 10px; font-size: 13px; padding: 5px 0; }
      .style-preview {
        border: 1px solid #ddd;
        border-radius: 7px;
        padding: 9px 13px;
        margin-top: 6px;
        font-size: 12px;
        background: #fff;
        min-height: 32px;
      }
      .style-note { font-size: 11px; color: #666; margin-top: 6px; }
      .badge-syn {
        background: #6f42c1;
        color: white;
        border-radius: 4px;
        padding: 2px 7px;
        font-size: 11px;
        font-weight: bold;
        margin-left: 6px;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <button id="langToggle" onclick="toggleLang()" data-i18n-title="langToggleTitle">
      🇵🇱 PL
    </button>
    <div class="card">
      <h2 data-i18n="title"></h2>
      <p data-i18n-html="desc"></p>

      <div class="upload-section" id="dropZone">
        <span id="fileNameDisplay" data-i18n="dropzone"></span>
        <input type="file" id="fileInput" accept=".mobi,.azw,.azw3" style="display: none" />
      </div>
      <div id="formatBadge"></div>

      <div class="option-box">
        <div class="option-row">
          <label data-i18n="styleLabel"></label>
          <select id="styleSelect">
            <option value="none"  data-i18n="styleNone"></option>
            <option value="nice" selected data-i18n="styleNice"></option>
            <option value="eink" data-i18n="styleEink"></option>
            <option value="rich" data-i18n="styleRich"></option>
          </select>
        </div>
        <div class="style-preview" id="stylePreview"></div>
        <div class="style-note" data-i18n-html="styleCompatibilityNote"></div>

        <div class="check-item" style="margin-top:10px">
          <input type="checkbox" id="compressCheck" checked />
          <label for="compressCheck" data-i18n="compressLabel"></label>
        </div>
        <div class="style-note" data-i18n-html="compressNote"></div>
      </div>

      <button id="startBtn" class="btn-main" disabled data-i18n="startBtn"></button>

      <div id="log" data-i18n="logIdle"></div>

      <div id="downloadArea" style="display:none;margin-top:25px;padding:20px;background:#e6ffed;border-radius:8px;border:1px solid #b7eb8f;">
        <h3 data-i18n="doneTitle"></h3>
        <div id="links" style="display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-items:flex-start;"></div>
      </div>

      <div id="previewArea" style="display:none;margin-top:20px">
        <h3 data-i18n="previewTitle"></h3>
        <div class="preview-grid" id="previewGrid"></div>
        <h4 data-i18n="validatorTitle" style="margin:14px 0 6px;color:#5b6570"></h4>
        <input type="text" id="validatorSearchBox" class="validator-search"
               data-i18n-ph="validatorSearchPh" placeholder="" />
        <div id="validatorStatus" class="validator-status"></div>
        <div id="validatorResultCard" class="validator-card">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
            <b id="validatorResultWord"></b>
            <div style="display:flex;gap:6px;align-items:center">
              <span id="validatorByteBadge" class="badge-syn"></span>
              <button id="validatorCopyBtn" class="btn-dl"
                      style="padding:6px 10px;background:#6c757d"
                      data-i18n="validatorCopyHtml"></button>
            </div>
          </div>
          <div id="validatorSynInfo"
               style="display:none;color:#6f42c1;font-size:12px;margin-top:6px"></div>
          <div class="validator-split">
            <div id="validatorPaneRendered" class="validator-pane"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // ── i18n helpers ──────────────────────────────────────────────────────────
      function formatI18nText(template, vars) {
        if (!vars) return template;
        return String(template).replace(/\{(\w+)}/g, (_, k) =>
          vars[k] !== undefined ? String(vars[k]) : `{${k}}`);
      }

      function i18nText(key, fallback, vars) {
        const tables = window.__I18N_TABLES || {};
        const lang = window.LANG || 'en';
        const table = tables[lang] || tables.en || {};
        const en = tables.en || {};
        const base = table[key] !== undefined ? table[key] : en[key];
        const text = base !== undefined ? base : fallback || key;
        return formatI18nText(text, vars);
      }

      // ── Unified style engines ─────────────────────────────────────────────────
      // Both KF8 (2-arg) and PalmDoc (4-arg) calling conventions are supported.
      // When rawH2Html argument is present → PalmDoc mode; otherwise → KF8 mode.
      const STYLES = {
        _escapeRegExp(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); },

        _ensureHeadwordSpan(word, html) {
          if (/<span\s*>\s*<b>[\s\S]*?<\/b>\s*<\/span>/i.test(html)) return html;
          const w = (word || '').trim();
          if (!w) return html;
          const escaped = STYLES._escapeRegExp(w);
          const hMatch = html.match(/^\s*<h([1-6])\b[^>]*>([\s\S]*?)<\/h\1>\s*/i);
          if (hMatch) {
            const plain = hMatch[2].replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
            const reLeadWord = new RegExp(`^${escaped}(?:\\b|\\s)`, 'i');
            if (reLeadWord.test(plain)) {
              const tail = plain.replace(new RegExp(`^${escaped}\\s*`, 'i'), '').trim();
              const rest = html.slice(hMatch[0].length);
              return `<span><b>${w}</b></span>${tail ? ` ${tail}` : ''}${rest ? ` ${rest}` : ''}`.trim();
            }
          }
          const leadRe = new RegExp(`^\\s*${escaped}(?:\\b|\\s*)`, 'i');
          if (leadRe.test(html)) return html.replace(leadRe, `<span><b>${w}</b></span> `);
          return html;
        },

        none(word, pHtmlOrPhonetics, rawH2Html, contentHtml) {
          if (rawH2Html !== undefined) return rawH2Html + contentHtml;
          return pHtmlOrPhonetics;
        },

        clean(word, pHtmlOrPhonetics, rawH2Html, contentHtml) {
          if (rawH2Html !== undefined) {
            const strip = (h) => h.replace(/ style="[^"]*"/g, '');
            const ph = pHtmlOrPhonetics ? ` <em>${pHtmlOrPhonetics}</em>` : '';
            return `<b>${word}</b>${ph}<br>${strip(contentHtml)}`;
          }
          return pHtmlOrPhonetics
            .replace(/ width="[^"]*"/gi, '')
            .replace(/ style="[^"]*"/gi, '');
        },

        nice(word, pHtmlOrPhonetics, rawH2Html, contentHtml) {
          if (rawH2Html !== undefined) {
            const ph = pHtmlOrPhonetics
              ? ` <span style="color:#666;font-size:.88em;font-style:italic">${pHtmlOrPhonetics}</span>`
              : '';
            let content = contentHtml
              .replace(/(<i>(?:n|v|adj|adv|prep|conj|pron|interj|abbr|acr)\b.*?<\/i>)/g,
                '<span style="color:#c0392b;font-weight:bold">$1</span>')
              .replace(/(<b>(?:\d+)\.?<\/b>)/g,
                '<span style="color:#2980b9;font-weight:bold">$1</span>');
            return `<div style="margin-bottom:6px"><b style="font-size:1.15em;color:#003d82">${word}</b>${ph}</div>${content}`;
          }
          const pHtml = STYLES._ensureHeadwordSpan(word, pHtmlOrPhonetics);
          let body = pHtml
            .replace(/(<i>(?:n|v|adj|adv|prep|conj|pron|interj|abbr|acr)\.?<\/i>)/g,
              '<span style="color:#c0392b;font-weight:bold">$1</span>')
            .replace(/\b(<b>(\d+)\.<\/b>)/g,
              '<span style="color:#2980b9;font-weight:bold">$1</span>');
          body = body.replace(/(<span\s*>\s*<b>)([\s\S]*?)(<\/b>\s*<\/span>)/,
            '<span><b style="font-size:1.15em;color:#003d82">$2</b></span>');
          return body;
        },

        eink(word, pHtmlOrPhonetics, rawH2Html, contentHtml) {
          if (rawH2Html !== undefined) {
            const ph = pHtmlOrPhonetics
              ? ` <span style="font-size:.9em;font-style:italic">${pHtmlOrPhonetics}</span>` : '';
            let content = contentHtml
              .replace(/(<i>(?:n|v|adj|adv|prep|conj|pron|interj|abbr|acr)\.?<\/i>)/g, '<b>$1</b>')
              .replace(/\b(\d+)\./g, '<b>$1.</b>')
              .replace(/(<i>[a-z]{2,5}\.<\/i>)/g, '<small>$1</small>')
              .replace(/(<b>([^<]{3,60})<\/b>(?=\s*[/(<]))/g,
                '<b style="text-decoration:underline">$2</b>');
            return `<div style="margin-bottom:6px;padding:4px 0;border-left:2px solid #000;padding-left:8px"><b style="font-size:1.2em">${word}</b>${ph}</div>${content}`;
          }
          const pHtml = STYLES._ensureHeadwordSpan(word, pHtmlOrPhonetics);
          const ipaM = pHtml.match(/(?<!<)\/([^/<]{2,60})\//);
          const ipa = ipaM ? ` <span style="font-size:.9em;font-style:italic">/${ipaM[1]}/</span>` : '';
          let body = ipaM ? pHtml.replace(ipaM[0], '') : pHtml;
          body = body
            .replace(/<b>(\d+)\.<\/b>/g, '<b>$1.</b>')
            .replace(/(<i>(?:[a-z]{2,5})\.<\/i>)/g, '<small>$1</small>')
            .replace(/(<i>(?:n|v|adj|adv|prep|conj|pron|interj|abbr|acr)\.?<\/i>)/g, '<b>$1</b>');
          let seenHeadword = false;
          body = body.replace(/<span\s*>\s*<b[^>]*>([\s\S]*?)<\/b>\s*<\/span>/gi, (m, inner) => {
            if (!seenHeadword) {
              seenHeadword = true;
              return `<span style="display:block;border-left:2px solid #000;padding-left:7px;margin-bottom:4px"><b style="font-size:1.18em">${inner}</b>${ipa}</span>`;
            }
            const plain = inner.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
            if (plain.length >= 3 && plain.length <= 80 && plain.includes(' '))
              return `<span><b style="text-decoration:underline">${inner}</b></span>`;
            return m;
          });
          return body;
        },

        rich(word, pHtmlOrPhonetics, rawH2Html, contentHtml) {
          if (rawH2Html !== undefined) {
            const ph = pHtmlOrPhonetics
              ? ` <span style="background:#eef5ff;color:#0366d6;padding:1px 5px;border-radius:3px;font-size:.85em">${pHtmlOrPhonetics}</span>` : '';
            let content = contentHtml
              .replace(/(<i>(?:n|v|adj|adv|prep|conj|pron|interj|abbr|acr)\.?<\/i>)/g,
                '<b style="color:#e74c3c">$1</b>')
              .replace(/\b(\d+)\./g, '<b style="color:#1565c0">$1.</b>')
              .replace(/(<i>[a-z]{2,5}\.<\/i>)/g,
                '<span style="color:#7c3aed;font-size:.85em">$1</span>')
              .replace(/(<b>([^<]{3,60})<\/b>(?=\s*[/(<]))/g,
                '<b style="color:#5c4b00">$2</b>');
            return `<div style="margin-bottom:6px;padding:4px 0;border-left:3px solid #2980b9;padding-left:8px"><b style="font-size:1.2em;color:#1a237e">${word}</b>${ph}</div>${content}`;
          }
          const pHtml = STYLES._ensureHeadwordSpan(word, pHtmlOrPhonetics);
          const ipaM = pHtml.match(/(?<!<)\/([^/<]{2,60})\//);
          const ipa = ipaM
            ? ` <span style="background:#eef5ff;color:#0366d6;padding:1px 5px;border-radius:3px;font-size:.83em">/${ipaM[1]}/</span>` : '';
          let body = ipaM ? pHtml.replace(ipaM[0], '') : pHtml;
          body = body
            .replace(/(<i>(?:n|v|adj|adv|prep|conj|pron|interj|abbr|acr)\.?<\/i>)/g,
              '<b style="color:#e74c3c">$1</b>')
            .replace(/<b>(\d+)\.<\/b>/g, '<b style="color:#1565c0">$1.</b>')
            .replace(/(<i>(?:[a-z]{2,5})\.<\/i>)/g,
              '<span style="color:#7c3aed;font-size:.83em">$1</span>');
          let seenHeadword = false;
          body = body.replace(/<span\s*>\s*<b[^>]*>([\s\S]*?)<\/b>\s*<\/span>/gi, (m, inner) => {
            if (!seenHeadword) {
              seenHeadword = true;
              return `<span style="display:block;border-left:3px solid #2980b9;padding-left:7px;margin-bottom:4px"><b style="font-size:1.18em;color:#1a237e">${inner}</b>${ipa}</span>`;
            }
            const plain = inner.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
            if (plain.length >= 3 && plain.length <= 80 && plain.includes(' '))
              return `<span><b style="color:#5c4b00">${inner}</b></span>`;
            return m;
          });
          return body;
        },
      };

      // Live preview using a sample entry
      const PREVIEW_HTML = `<p> <span ><b>download</b></span> /ˌdaʊnˈləʊd/ <i>v</i> <b>1.</b> <i>inf.</i> pobierać, ściągać <br/> <span ><b>download time</b></span> <i>n</i> czas pobierania </p>`;
      function updateStylePreview() {
        const fn = STYLES[document.getElementById('styleSelect').value] || STYLES.nice;
        document.getElementById('stylePreview').innerHTML = fn('download', PREVIEW_HTML);
      }
      document.getElementById('styleSelect').addEventListener('change', updateStylePreview);
      updateStylePreview();

      // ── Logging ───────────────────────────────────────────────────────────────
      const logEl = document.getElementById('log');
      function addLog(msg) {
        logEl.textContent += `\n[${new Date().toLocaleTimeString()}] ${msg}`;
        logEl.scrollTop = logEl.scrollHeight;
      }

      // ── Format detection ──────────────────────────────────────────────────────
      // @@include(src/mobi-detect-core.js)

      let globalBuffer = null;
      let detectedFormat = null; // 'kf8' | 'palmdoc' | 'unknown'

      const fileInput = document.getElementById('fileInput');
      document.getElementById('dropZone').onclick = () => fileInput.click();
      fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        document.getElementById('fileNameDisplay').textContent =
          `📁 ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
        globalBuffer = await file.arrayBuffer();

        const { format, drm, compressionCode } = detectMobiFormat(globalBuffer);
        const badge = document.getElementById('formatBadge');
        badge.style.display = 'block';
        badge.className = '';

        if (drm) {
          badge.className = 'drm';
          badge.textContent = i18nText('detectDRM', '🔒 DRM protected – cannot convert');
          document.getElementById('startBtn').disabled = true;
          addLog(i18nText('detectDRM', '🔒 DRM protected – cannot convert'));
          return;
        }

        if (format === 'kf8') {
          badge.className = 'kf8';
          badge.textContent = i18nText('detectFormatKF8', '⚡ KF8 / HUFF·CDIC (modern format)');
          addLog(i18nText('logFileLoaded', 'File loaded: {file}', { file: file.name }));
          addLog(i18nText('detectFormatKF8', '⚡ KF8 / HUFF·CDIC (modern format)'));
        } else if (format === 'palmdoc') {
          badge.className = 'palmdoc';
          badge.textContent = i18nText('detectFormatPalm', '📜 PalmDoc / Mobi7 (legacy format)');
          addLog(i18nText('logFileLoaded', 'File loaded: {file}', { file: file.name }));
          addLog(i18nText('detectFormatPalm', '📜 PalmDoc / Mobi7 (legacy format)'));
        } else {
          badge.className = 'unknown';
          badge.textContent = i18nText('detectFormatUnknown',
            '⚠️ Unknown compression ({code}) – trying PalmDoc', { code: compressionCode });
          addLog(i18nText('detectFormatUnknown',
            '⚠️ Unknown compression ({code}) – trying PalmDoc', { code: compressionCode }));
        }

        detectedFormat = format === 'unknown' ? 'palmdoc' : format;
        document.getElementById('startBtn').disabled = false;
      });

      // ── MOBI core source files ────────────────────────────────────────────────
      // @@include(src/mobi-index-core.js)
      // @@include(src/huffcdic-core.js)
      // @@include(src/kf8-converter.js)
      // @@include(src/palmdoc-core.js)
      // @@include(src/palmdoc-converter.js)

      // ── StarDict output ───────────────────────────────────────────────────────
      // @@include(node_modules/pako/dist/pako_deflate.min.js)
      // @@include(src/stardict-dictzip-core.js)
      // @@include(src/stardict-validator-core.js)
      // @@include(src/stardict-output.js)

      // ── Start button ──────────────────────────────────────────────────────────
      document.getElementById('startBtn').onclick = () => {
        const btn = document.getElementById('startBtn');
        btn.disabled = true;
        btn.textContent = i18nText('startBtnWorking', 'WORKING...');

        const options = {
          style:       document.getElementById('styleSelect').value,
          generateSyn: true,
          merge:       true,
        };
        const compress = document.getElementById('compressCheck').checked;

        setTimeout(async () => {
          try {
            let finalMap, synMap;
            if (detectedFormat === 'kf8') {
              const conv = new KF8Converter(globalBuffer, options);
              ({ finalMap, synMap } = await conv.run());
            } else {
              const conv = new Converter(globalBuffer, options, addLog);
              ({ finalMap, synMap } = await conv.run());
            }

            if (finalMap.size > 0) {
              await renderOutput(finalMap, synMap, true, compress);
              btn.textContent = i18nText('startBtnDone', '✅ DONE');
            } else {
              addLog(i18nText('logNoEntries', '⚠️ No entries extracted. Check log for details.'));
              btn.disabled = false;
              btn.textContent = i18nText('startBtnRetry', 'RETRY');
            }
          } catch (err) {
            addLog(i18nText('logFatalError', 'FATAL ERROR: {message}\n{stack}',
              { message: err.message, stack: err.stack }));
            btn.disabled = false;
            btn.textContent = i18nText('startBtnErrorRetry', 'ERROR - Retry');
          }
        }, 150);
      };

      // ── i18n tables ───────────────────────────────────────────────────────────
      const I18N = {
        en: {
          pageTitle:    'MOBI → StarDict Converter',
