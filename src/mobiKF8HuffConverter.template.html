<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="pageTitle">MOBI8/KF8 to StarDict - HUFF/CDIC</title>
    <style>
      #langToggle {
        position: fixed;
        top: 12px;
        right: 14px;
        z-index: 9999;
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 999px;
        padding: 4px 12px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      }
      #langToggle:hover {
        border-color: #007bff;
        color: #007bff;
      }
      body {
        font-family: "Segoe UI", sans-serif;
        max-width: 1000px;
        margin: 30px auto;
        background: #f0f2f5;
        color: #1c1e21;
      }
      .card {
        background: white;
        padding: 35px;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      }
      h2 {
        color: #007bff;
        margin-top: 0;
        border-bottom: 2px solid #e1e4e8;
        padding-bottom: 10px;
      }
      .upload-section {
        border: 3px dashed #007bff;
        background: #f8fbff;
        padding: 30px;
        text-align: center;
        cursor: pointer;
        border-radius: 12px;
        margin-bottom: 20px;
      }
      #log {
        background: #1c1e21;
        color: #a5d6a7;
        padding: 15px;
        font-family: monospace;
        height: 340px;
        overflow-y: auto;
        border-radius: 8px;
        margin-top: 20px;
        font-size: 12px;
        border: 1px solid #30363d;
        white-space: pre-wrap;
      }
      .btn-main {
        background: #007bff;
        color: white;
        border: none;
        padding: 15px 30px;
        font-size: 18px;
        border-radius: 8px;
        cursor: pointer;
        width: 100%;
        font-weight: bold;
        transition: 0.3s;
        margin-top: 10px;
      }
      .btn-main:disabled {
        background: #6c757d;
        cursor: not-allowed;
      }
      .btn-dl {
        display: inline-block;
        margin: 5px;
        padding: 10px 15px;
        background: #28a745;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        font-weight: bold;
      }
      .preview-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-top: 12px;
      }
      .preview-item {
        background: #fff;
        border: 1px solid #ddd;
        padding: 10px;
        border-radius: 8px;
        font-size: 11px;
        max-height: 220px;
        overflow-y: auto;
      }
      .validator-search {
        width: 100%;
        padding: 11px;
        font-size: 16px;
        margin-top: 12px;
        border-radius: 6px;
        border: 2px solid #007bff;
        box-sizing: border-box;
        display: none;
      }
      .validator-status {
        font-size: 12px;
        color: #666;
        margin-top: 7px;
      }
      .validator-card {
        display: none;
        margin-top: 10px;
        padding: 12px;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 8px;
      }
      .validator-split {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
        margin-top: 8px;
      }
      .validator-pane {
        border: 1px solid #ddd;
        border-radius: 7px;
        padding: 10px;
        max-height: 560px;
        overflow: auto;
      }
      .validator-raw {
        background: #1c1e21;
        color: #e8e8e8;
        font-family: monospace;
        font-size: 11px;
        white-space: pre-wrap;
      }
      .option-box {
        background: #f8f9fa;
        border: 1px solid #dee2e6;
        padding: 14px 18px;
        border-radius: 10px;
        margin-bottom: 14px;
      }
      .option-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }
      .option-row label {
        font-weight: 600;
        min-width: 120px;
        font-size: 13px;
      }
      .option-row select {
        padding: 5px 10px;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 13px;
        cursor: pointer;
        width: 100%;
        text-overflow: ellipsis;
      }
      .check-item {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        padding: 5px 0;
      }
      .style-preview {
        border: 1px solid #ddd;
        border-radius: 7px;
        padding: 9px 13px;
        margin-top: 6px;
        font-size: 12px;
        background: #fff;
        min-height: 32px;
      }
      .style-note {
        font-size: 11px;
        color: #666;
        margin-top: 6px;
      }
      .badge-syn {
        background: #6f42c1;
        color: white;
        border-radius: 4px;
        padding: 2px 7px;
        font-size: 11px;
        font-weight: bold;
        margin-left: 6px;
        vertical-align: middle;
      }
    </style>

  <body>
    <button
      id="langToggle"
      onclick="toggleLang()"
      data-i18n-title="langToggleTitle"
    >
      🇵🇱 PL
    </button>
    <div class="card">
      <h2 data-i18n="title"></h2>
      <p data-i18n-html="desc"></p>

      <div class="upload-section" id="dropZone">
        <span id="fileNameDisplay" data-i18n="dropzone"></span>
        <input
          type="file"
          id="fileInput"
          accept=".mobi,.azw,.azw3"
          style="display: none"
        />
      </div>

      <div class="option-box">
        <div class="option-row">
          <label data-i18n="styleLabel"></label>
          <select id="styleSelect">
            <option value="none" data-i18n="styleNone"></option>
            <!--                <option value="clean" data-i18n="styleClean"></option>-->
            <option value="nice" selected data-i18n="styleNice"></option>
            <option value="eink" data-i18n="styleEink"></option>
            <option value="rich" data-i18n="styleRich"></option>
          </select>
        </div>
        <div class="style-preview" id="stylePreview"></div>
        <div class="style-note" data-i18n-html="styleCompatibilityNote"></div>

        <div class="check-item" style="margin-top:10px">
          <input type="checkbox" id="compressCheck" checked />
          <label for="compressCheck" data-i18n="compressLabel"></label>
        </div>
        <div class="style-note" data-i18n-html="compressNote"></div>
      </div>

      <button
        id="startBtn"
        class="btn-main"
        disabled
        data-i18n="startBtn"
      ></button>

      <div id="log" data-i18n="logIdle"></div>

      <div
        id="downloadArea"
        style="
          display: none;
          margin-top: 25px;
          padding: 20px;
          background: #e6ffed;
          border-radius: 8px;
          border: 1px solid #b7eb8f;
        "
      >
        <h3 data-i18n="doneTitle"></h3>
        <div id="links"></div>
      </div>

      <div id="previewArea" style="display: none; margin-top: 20px">
        <h3 data-i18n="previewTitle"></h3>
        <div class="preview-grid" id="previewGrid"></div>
        <h4
          data-i18n="validatorTitle"
          style="margin: 14px 0 6px; color: #5b6570"
        ></h4>
        <input
          type="text"
          id="validatorSearchBox"
          class="validator-search"
          data-i18n-ph="validatorSearchPh"
          placeholder=""
        />
        <div id="validatorStatus" class="validator-status"></div>
        <div id="validatorResultCard" class="validator-card">

              justify-content: space-between;
              align-items: center;
              gap: 8px;
              flex-wrap: wrap;

                data-i18n="validatorCopyHtml"
              ></button>

            style="

              color: #6f42c1;
              font-size: 12px;

    <script>
      function formatI18nText(template, vars) {
        if (!vars) return template;
        return String(template).replace(/\{(\w+)}/g, (_, k) =>
          vars[k] !== undefined ? String(vars[k]) : `{${k}}`,
        );
      }

      function i18nText(key, fallback, vars) {
        const tables = window.__I18N_TABLES || {};
        const lang = window.LANG || "en";
        const table = tables[lang] || tables.en || {};
        const en = tables.en || {};
        const base = table[key] !== undefined ? table[key] : en[key];
        const text = base !== undefined ? base : fallback || key;
        return formatI18nText(text, vars);
      }

      // ─────────────────────────────────────────────────────────────────────────────
      // Style engines  (applied to each extracted entry's HTML)
      // ─────────────────────────────────────────────────────────────────────────────
      // @@include(src/styles-core.js)
      // ─────────────────────────────────────────────────────────────────────────────

      // Live preview using a fake entry
      const PREVIEW_HTML = `<p> <span ><b>download</b></span> /ˌdaʊnˈləʊd/ <i>v</i> <b>1.</b> <i>inf.</i> pobierać, ściągać <br/> <span ><b>download time</b></span> <i>n</i> czas pobierania </p>`;
      function updateStylePreview() {
        const fn =
          STYLES[document.getElementById("styleSelect").value] || STYLES.nice;
        document.getElementById("stylePreview").innerHTML = fn(
          "download",
          PREVIEW_HTML,
        );
      }
      document
        .getElementById("styleSelect")
        .addEventListener("change", updateStylePreview);
      updateStylePreview();

      // ─────────────────────────────────────────────────────────────────────────────
      // Logging
      // ─────────────────────────────────────────────────────────────────────────────
      const logEl = document.getElementById("log");
      function addLog(msg) {
        logEl.textContent += `\n[${new Date().toLocaleTimeString()}] ${msg}`;
        logEl.scrollTop = logEl.scrollHeight;
      }

      // ─────────────────────────────────────────────────────────────────────────────
      // File I/O
      // ─────────────────────────────────────────────────────────────────────────────
      let globalBuffer = null;
      const fileInput = document.getElementById("fileInput");
      document.getElementById("dropZone").onclick = () => fileInput.click();
      fileInput.addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        document.getElementById("fileNameDisplay").textContent =
          `📁 ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
        globalBuffer = await file.arrayBuffer();
        document.getElementById("startBtn").disabled = false;
        addLog(
          i18nText("logFileLoaded", "File loaded: {file}", { file: file.name }),
        );
      });

      // ─────────────────────────────────────────────────────────────────────────────
      // @@include(src/mobi-index-core.js)
      // ─────────────────────────────────────────────────────────────────────────────
      // @@include(src/huffcdic-core.js)
      // ─────────────────────────────────────────────────────────────────────────────

      // ─────────────────────────────────────────────────────────────────────────────
      // Main converter class
      // ─────────────────────────────────────────────────────────────────────────────
      // @@include(src/kf8-converter.js)

      // ─────────────────────────────────────────────────────────────────────────────
      // StarDict output
      // ─────────────────────────────────────────────────────────────────────────────
      // @@include(node_modules/pako/dist/pako_deflate.min.js)
      // @@include(src/stardict-dictzip-core.js)
      // @@include(src/stardict-validator-core.js)
      // @@include(src/stardict-output-kf8.js)

      // ─────────────────────────────────────────────────────────────────────────────
      // Worker source (all converter code compiled into one JSON string by build.js)
      // @@worker(src/kf8-worker-inner.js)
      // ─────────────────────────────────────────────────────────────────────────────

      // ─────────────────────────────────────────────────────────────────────────────
      // Button handler – spawns a Web Worker for the heavy lifting so the main
      // thread stays responsive throughout the 20-60 s conversion.
      // ─────────────────────────────────────────────────────────────────────────────
      document.getElementById("startBtn").onclick = () => {
        const btn = document.getElementById("startBtn");
        btn.disabled = true;
        btn.textContent = i18nText("startBtnWorking", "WORKING...");

        const options = {
          style: document.getElementById("styleSelect").value,
          generateSyn: true,
        };
        const compress = document.getElementById("compressCheck").checked;

        // Create a Blob URL worker from the pre-built worker source string.
        // Blob URL workers work from file:// and https:// equally.
        const blob      = new Blob([__KF8_WORKER_SRC__], { type: "application/javascript" });
        const workerUrl = URL.createObjectURL(blob);
        const worker    = new Worker(workerUrl);

        worker.onmessage = async ({ data }) => {
          if (data.type === "log") {
            addLog(data.msg);
          } else if (data.type === "done") {
            URL.revokeObjectURL(workerUrl);
            const finalMap = new Map(data.finalMapEntries);
            const synMap   = new Map(data.synMapEntries);
            try {
              if (finalMap.size > 0) {
                await renderOutput(finalMap, synMap, true, compress);
                btn.textContent = i18nText("startBtnDone", "✅ DONE");
              } else {
                addLog(i18nText("logNoEntries", "⚠️ No entries extracted. Check log for details."));
                btn.disabled = false;
                btn.textContent = i18nText("startBtnRetry", "RETRY");
              }
            } catch (err) {
              addLog(i18nText("logFatalError", "FATAL ERROR: {message}\n{stack}",
                { message: err.message, stack: err.stack }));
              btn.disabled = false;
              btn.textContent = i18nText("startBtnErrorRetry", "ERROR - Retry");
            }
          } else if (data.type === "error") {
            URL.revokeObjectURL(workerUrl);
            addLog(i18nText("logFatalError", "FATAL ERROR: {message}\n{stack}",
              { message: data.message, stack: data.stack }));
            btn.disabled = false;
            btn.textContent = i18nText("startBtnErrorRetry", "ERROR - Retry");
          }
        };

        worker.onerror = (e) => {
          URL.revokeObjectURL(workerUrl);
          addLog("Worker error: " + (e.message || e));
          btn.disabled = false;
          btn.textContent = i18nText("startBtnErrorRetry", "ERROR - Retry");
        };

        // postMessage clones the ArrayBuffer (33 ms for 33 MB) so globalBuffer
        // remains usable for a potential retry without re-selecting the file.
        worker.postMessage({
          buffer:     globalBuffer,
          options,
          i18nTables: window.__I18N_TABLES || {},
          lang:       window.LANG || "en",
        });
      };
